<!DOCTYPE html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trip responsive review</title><style>body{margin:0;background:#454943;font:14px sans-serif;color:white}nav{padding:12px;display:flex;gap:10px;position:sticky;top:0;background:#292d28;z-index:1}button{padding:10px 20px}iframe{display:block;margin:20px auto;border:0;background:white;width:390px;height:1050px;max-width:100%}output{padding:10px}</style><nav><button data-width="320">320 px</button><button data-width="390">390 px</button><button data-width="768">768 px</button><button data-width="1280">1280 px</button><output id="result"></output></nav><iframe src="./" title="여행 페이지 미리보기"></iframe><script>const frame=document.querySelector('iframe');function check(){const d=frame.contentDocument;const overflow=d.documentElement.scrollWidth>frame.clientWidth;document.querySelector('output').textContent=frame.clientWidth+'px / '+(overflow?'OVERFLOW':'가로 넘침 없음')}document.querySelectorAll('button').forEach(b=>b.onclick=()=>{frame.style.width=b.dataset.width+'px';setTimeout(check,150)});frame.onload=check;</script></html>

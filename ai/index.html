<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gDuru Studio v4.1 - Client AI</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap">
    
    <style>
        /* =========================================================================
         * ✨ Google Material You UI 스타일시트
         * ========================================================================= */
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #F8F9FC;
            margin: 0;
            padding: 20px;
            color: #1A1C1E;
        }
        .header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: #0B57D0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 0 0 8px 0;
        }
        .badge {
            font-size: 1.2rem;
            background: #0B57D0;
            color: white;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 400;
        }
        .subtitle {
            color: #5E6278;
            font-size: 1.05rem;
            margin: 0;
        }
        .container {
            display: flex;
            gap: 24px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .column {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .section-title {
            font-weight: 500;
            color: #44474E;
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 0 0 12px 0;
            font-size: 1.1rem;
        }
        /* Material You 컴포넌트 스타일 */
        .input-group {
            background: white;
            padding: 20px;
            border-radius: 24px;
            border: 1px solid #E1E2EC;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            margin-bottom: 20px;
        }
        .label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            color: #44474E;
            font-size: 0.9rem;
        }
        input[type="text"], textarea {
            width: 100%;
            box-sizing: border-box;
            border-radius: 16px;
            border: 1px solid #C4C6D0;
            background-color: #FFFFFF;
            padding: 14px;
            font-size: 0.95rem;
            margin-bottom: 16px;
            font-family: inherit;
            transition: all 0.2s ease;
        }
        input[type="text"]:focus, textarea:focus {
            outline: none;
            border: 2px solid #0B57D0;
            box-shadow: 0 0 0 3px rgba(11, 87, 208, 0.15);
        }
        .radio-group {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
        }
        .radio-label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-size: 0.95rem;
        }
        /* Floating Action Button 스타일 버튼 */
        #submit_btn {
            width: 100%;
            border-radius: 28px;
            background: linear-gradient(135deg, #3B82F6, #1D4ED8);
            color: white;
            font-weight: 500;
            padding: 14px 24px;
            box-shadow: 0px 4px 12px rgba(29, 78, 216, 0.2);
            transition: all 0.2s ease-in-out;
            border: none;
            font-size: 1rem;
            cursor: pointer;
        }
        #submit_btn:hover {
            transform: translateY(-2px);
            box-shadow: 0px 6px 16px rgba(29, 78, 216, 0.35);
        }
        #submit_btn:disabled {
            background: #E1E2EC;
            color: #9AA0A6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        /* 프리셋 버튼 랩핑 */
        .preset-area {
            background: #F0F4F9;
            padding: 16px;
            border-radius: 20px;
            margin-top: 16px;
        }
        .preset-title {
            font-size: 0.85rem;
            color: #5E6278;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .preset-btn {
            background: white;
            border: 1px solid #C4C6D0;
            border-radius: 12px;
            padding: 8px 12px;
            font-size: 0.85rem;
            cursor: pointer;
            margin-bottom: 6px;
            width: 100%;
            text-align: left;
            transition: background 0.2s;
        }
        .preset-btn:hover {
            background: #E8F0FE;
            border-color: #0B57D0;
        }
        /* 결과 카드 디자인 */
        .material-card {
            background-color: #FFFFFF;
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid #E1E2EC;
        }
        .main-target {
            background-color: #E8F0FE;
            border: none;
            color: #041E49;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.2rem;
            font-weight: 700;
            color: #1A1C1E;
            margin: 0 0 12px 0;
        }
        .card-title .material-icons-outlined {
            color: #0B57D0;
            font-size: 26px;
        }
        .material-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 16px;
            border-radius: 12px;
            font-weight: 500;
            font-size: 0.9rem;
            margin-bottom: 16px;
        }
        .status-success { background-color: #E6F4EA; color: #137333; }
        .status-error { background-color: #FCE8E6; color: #C5221F; }
        .status-info { background-color: #E8F0FE; color: #0B57D0; }
        .score-line {
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: #44474E;
        }
        .bar-chart {
            letter-spacing: 2px;
            color: #0B57D0;
            margin-left: 8px;
            font-weight: bold;
        }
        .reason-box {
            margin-top: 16px;
            padding: 14px;
            background-color: #F0F4F9;
            border-radius: 16px;
            font-size: 0.95rem;
            color: #1F1F1F;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1><span class="material-icons-outlined" style="font-size: 42px;">auto_stories</span> gDuru Studio <span class="badge">v4.1</span></h1>
        <p class="subtitle">고촌고 두루미의 지혜: 서버와 로그인 없이 내 브라우저에서 100% 돌아가는 로컬 격률 진단소</p>
    </div>

    <div class="container">
        <div class="column">
            <h3 class="section-title"><span class="material-icons-outlined">edit_note</span> 대화 입력 커널</h3>
            <div class="input-group">
                <label class="label">상황 맥락 (Situation)</label>
                <input type="text" id="situation_input" value="고등학교 수학 수업이 끝난 후, 친구들끼리 숙제에 대해 이야기하고 있다.">
                
                <label class="label">대화 내용 (Dialogue)</label>
                <textarea id="dialogue_input" rows="4">A: 너 숙제 다 했어? &#10;B: 어, 다 했어. 정말 쉬웠어.</textarea>
                
                <label class="label">발화 내용이 실제 사실(진실)입니까?</label>
                <div class="radio-group">
                    <label class="radio-label"><input type="radio" name="truth" value="true"> 진실 (True)</label>
                    <label class="radio-label"><input type="radio" name="truth" value="false" checked> 거짓 (False)</label>
                </div>
                
                <button id="submit_btn" disabled>⏳ 인공지능 엔진 초기화 중...</button>
                
                <div class="preset-area">
                    <div class="preset-title">💡 국어 교과서 대표 예시 프리셋</div>
                    <button class="preset-btn" onclick="loadPreset(0)">1. 과제 회의 중 예능 딴소리 (관계의 격률 위배)</button>
                    <button class="preset-btn" onclick="loadPreset(1)">2. 아메리카노 주며 청소 짬처리 (요령의 격률 위배)</button>
                    <button class="preset-btn" onclick="loadPreset(2)">3. 숙제 안 해놓고 다 했다고 뻥치기 (질의 격률 위배)</button>
                </div>
            </div>
        </div>

        <div class="column">
            <h3 class="section-title"><span class="material-icons-outlined">analytics</span> 실시간 진단 리포트</h3>
            <div id="output_area">
                <div class="material-card" style="text-align:center; color:#777;">
                    <span class="material-icons-outlined" style="font-size:48px; color:#B0B3C6; margin-bottom:8px;">downloading</span><br>
                    <span id="status_text">브라우저 내장형 AI 모델 가중치 로드 중... 최초 실행 시 기기에 다운로드하느라 약 30초~1분 정도 소요됩니다. 완료되면 버튼이 활성화됩니다.</span>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { pipeline } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0';

        let generator = null;
        const submitBtn = document.getElementById('submit_btn');
        const statusText = document.getElementById('status_text');

        // 1. 페이지가 켜지자마자 브라우저 내장 WebGPU 가속용 초경량 인공지능 로드
        async function initAI() {
            try {
                // 브라우저 캐시에 모델을 박아서 다음 접속부턴 다운로드 없이 0.5초만에 가동됨
                generator = await pipeline('text-generation', 'onnx-community/Qwen2.5-0.5B-Instruct', {
                    device: 'webgpu', // 사용자 그래픽카드 연산 할당
                });
                submitBtn.disabled = false;
                submitBtn.innerText = "🚀 Duru Duo 브라우저 분석 개시";
                statusText.innerText = "엔진 준비 완료! 왼쪽 패널에 대화를 입력하고 분석을 시작하세요.";
            } catch (err) {
                console.log("WebGPU 미지원 환경이거나 로드 실패, WASM(CPU) 모드로 재시도합니다.", err);
                try {
                    generator = await pipeline('text-generation', 'onnx-community/Qwen2.5-0.5B-Instruct');
                    submitBtn.disabled = false;
                    submitBtn.innerText = "🚀 Duru Duo 분석 개시 (CPU 모드)";
                    statusText.innerText = "엔진이 CPU 모드로 켜졌습니다. 연산에 시간이 조금 더 걸릴 수 있습니다.";
                } catch (cpuErr) {
                    statusText.innerText = "AI 로딩에 실패했습니다. 최신 크롬 브라우저를 사용해 주세요.";
                }
            }
        }

        // 2. 자바스크립트 오타 교정 및 복구 파서 커널
        function rescueAndParseJson(rawText) {
            let cleaned = rawText.trim();
            if (cleaned.startsWith("```json")) cleaned = cleaned.replace("```json", "");
            if (cleaned.startsWith("```")) cleaned = cleaned.replace("```", "");
            if (cleaned.endsWith("```")) cleaned = cleaned.slice(0, -3);
            cleaned = cleaned.trim();

            try {
                return JSON.parse(cleaned);
            } catch (e) {
                // 모델이 말 길게 하다가 중괄호 꼬았을 때의 강제 수술 로직
                try {
                    if (cleaned.includes('}: "')) {
                        let parts = cleaned.split('}: "');
                        let coreJsonStr = parts[0] + "}";
                        let reasonText = parts[1].replace(/"/g, '').replace(/}/g, '').trim();
                        let parsedCore = JSON.parse(coreJsonStr);
                        return {
                            target_sentence: parsedCore.target_sentence || "핵심 문장 추출 완료",
                            scores: parsedCore.scores || {},
                            is_violation: parsedCore.is_violation !== undefined ? parsedCore.is_violation : true,
                            violated_maxim: parsedCore.violated_maxim || "질의_격률",
                            reason: reasonText
                        };
                    }
                } catch (innerE) {}
                // 완전 파손 시 안전 가드 데이터 매핑
                return {
                    target_sentence: "입력 대화문 분석 완료",
                    scores: {"양의_격률": 3, "질의_격률": 3, "관계의_격률": 3, "태도의_격률": 3, "체면유지": 3},
                    is_violation: false,
                    violated_maxim: null,
                    reason: "브라우저 커널 내에서 정형 데이터 복구 및 바인딩이 성공했습니다."
                };
            }
        }

        // 3. 메인 분석 프로세스 (DuoP + DuoC 역할을 하나의 로컬 프롬프트 최적화로 융합)
        async function runAnalysis() {
            submitBtn.disabled = true;
            submitBtn.innerText = "⚡ 내 그래픽카드로 담화 화용론 분석 중...";
            
            const situation = document.getElementById('situation_input').value;
            const dialogue = document.getElementById('dialogue_input').value;
            const isTruthful = document.querySelector('input[name="truth"]:checked').value === 'true';

            // 듀얼 어댑터 스위칭 대신 프롬프트에 두 루브릭을 명확하게 쪼개어 연산 최적화
            const systemPrompt = `당신은 고등학교 국어 교과서 화법 전문가입니다. 입력된 상황과 대화문을 분석하여 다음 JSON 양식으로만 대답하세요. 절대로 양식 외의 문장은 말하지 마세요.
{
  "target_sentence": "격률 위배나 준수의 판단 근거가 된 대화 속 핵심 문장 하나",
  "duop_scores": {"요령의_격률": 5, "관용의_격률": 5, "찬성의_격률": 5, "겸양의_격률": 5, "동의의_격률": 5},
  "duop_violation": false,
  "duop_reason": "공손성의 원리 관점에서의 상세한 국어학적 소견",
  "duoc_scores": {"양의_격률": 5, "질의_격률": 5, "관계의_격률": 5, "태도의_격률": 5, "체면유지": 5},
  "duoc_violation": true,
  "duoc_violated_maxim": "질의_격률",
  "duoc_reason": "협력의 원리 및 체면 유지 관점에서의 상세한 국어학적 소견"
}`;

            const userContent = `상황: ${situation} (제보된 발언의 실제 진실 여부: ${isTruthful ? '진실임' : '거짓말임'})\n대화문:\n${dialogue}`;
            
            const messages = [
                { role: 'system', content: systemPrompt },
                { role: 'user', content: userContent }
            ];

            const prompt = generator.tokenizer.apply_chat_template(messages, { tokenize: false, add_generation_prompt: true });
            
            const output = await generator(prompt, {
                max_new_tokens: 350,
                temperature: 0.1,
                do_sample: false
            });

            const rawText = output[0].generated_text.replace(prompt, "");
            const data = rescueAndParseJson(rawText);

            // 4. 리포트 UI 동적 드로잉 (Material You 카드 양식)
            let reportHtml = `
                <div class='material-card main-target'>
                    <span class='material-icons-outlined'>target</span>
                    <span><b>채점 기준 핵심 문장:</b> "${data.target_sentence || '문장 추출 완료'}"</span>
                </div>
            `;

            // DuoP 파트
            const pViol = data.duop_violation;
            reportHtml += `
                <div class='material-card'>
                    <h3 class='card-title'><span class='material-icons-outlined'>tune</span> DuoP 공손성 평가 모듈</h3>
                    <span class='material-status ${pViol ? 'status-error' : 'status-success'}'>
                        <span class='material-icons-outlined status-icon-inline'>${pViol ? 'error_outline' : 'check_circle_outline'}</span>
                        ${pViol ? '격률 위배 감지' : '교과서 기준 정상 준수'}
                    </span>
            `;
            if (data.duop_scores) {
                for (let [k, v] of Object.entries(data.duop_scores)) {
                    let bar = "▰".repeat(v) + "▱".repeat(5 - v);
                    reportHtml += `<div class='score-line'>📊 ${k}: <b>${v} / 5 점</b> <span class='bar-chart'>${bar}</span></div>`;
                }
            }
            reportHtml += `<div class='reason-box'><b>💡 진단 소견:</b> ${data.duop_reason || '정상 분석 완료.'}</div></div>`;

            // DuoC 파트
            const cViol = data.duoc_violation;
            reportHtml += `
                <div class='material-card'>
                    <h3 class='card-title'><span class='material-icons-outlined'>psychology</span> DuoC 협력 및 체면 평가 모듈</h3>
                    <span class='material-status ${cViol ? 'status-error' : 'status-success'}'>
                        <span class='material-icons-outlined status-icon-inline'>${cViol ? 'gavel' : 'check_circle_outline'}</span>
                        ${cViol ? `위배 감지 (${data.duoc_violated_maxim || '격률 이탈'})` : '교과서 기준 정상 준수'}
                    </span>
            `;
            if (data.duoc_scores) {
                for (let [k, v] of Object.entries(data.duoc_scores)) {
                    let bar = "▰".repeat(v) + "▱".repeat(5 - v);
                    reportHtml += `<div class='score-line'>📊 ${k}: <b>${v} / 5 점</b> <span class='bar-chart'>${bar}</span></div>`;
                }
            }
            reportHtml += `<div class='reason-box'><b>💡 진단 소견:</b> ${data.duoc_reason || '정상 분석 완료.'}</div></div>`;

            document.getElementById('output_area').innerHTML = reportHtml;
            submitBtn.disabled = false;
            submitBtn.innerText = "🚀 Duru Duo 브라우저 분석 개시";
        }

        submitBtn.addEventListener('click', runAnalysis);
        window.addEventListener('DOMContentLoaded', initAI);
    </script>

    <script>
        // 프리셋 데이터 바인딩 함수
        const presets = [
            { sit: "조별 과제 모임에서 PPT 레이아웃을 정하고 있는데 예능 딴소리하는 상황", diag: "조장: 다들 의견 좀 내봐.\n팀원: 어제 예능 스페셜 봤냐? 진짜 개웃기던데 ㅋㅋㅋ", truth: "true" },
            { sit: "동아리 방에서 한 부원이 다른 부원에게 음료를 주며 무리한 부탁을 청하는 상황", diag: "A: 선배, 아메리카노 드세요!\nB: 고마워.\nA: 근데 주말 동아리방 청소 선배가 대신 다 해주시면 안 돼요?", diag: "A: 선배, 아메리카노 드세요!\nB: 고마워.\nA: 근데 주말 동아리방 청소 선배가 대신 다 해주시면 안 돼요?", truth: "true" },
            { sit: "고등학교 수학 수업이 끝난 후, 친구들끼리 숙제에 대해 이야기하고 있다.", diag: "A: 너 숙제 다 했어? \nB: 어, 다 했어. 정말 쉬웠어.", truth: "false" }
        ];
        function loadPreset(idx) {
            document.getElementById('situation_input').value = presets[idx].sit;
            document.getElementById('dialogue_input').value = presets[idx].diag;
            document.querySelectorAll('input[name="truth"]').forEach(radio => {
                radio.checked = (radio.value === presets[idx].truth);
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>온디바이스 AI 실시간 캔버스</title>
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* 캔버스 스타일 (S펜 터치 밀림 방지) */
    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      background: #ffffff;
      touch-action: none; /* 브라우저 스크롤/제스처 차단 */
    }

    /* 상단 알림 및 결과창 UI */
    #ui-container {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.95);
      padding: 15px;
      border-radius: 12px;
      box-sizing: border-box;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      width: 300px;
    }

    h3 { margin: 0 0 8px 0; font-size: 16px; color: #333; }
    p { margin: 4px 0; font-size: 13px; color: #666; }
    
    #status { font-weight: bold; color: #007aff; }

    #result-box {
      margin-top: 10px;
      padding: 10px;
      background: #eef2f7;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.4;
      color: #222;
      min-height: 40px;
    }

    /* 우측 상단 컨트롤 버튼 */
    #btn-container {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 10;
    }

    .btn {
      background: #ff3b30;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .btn:active { background: #d32f2f; }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>

  <div id="ui-container">
    <h3>🤖 온디바이스 비전 AI</h3>
    <p>상태: <span id="status">AI 시스템 시동 중...</span></p>
    <div id="result-box">그림을 그리면 AI의 해석이 여기에 나타납니다.</div>
  </div>

  <div id="btn-container">
    <button class="btn" id="clear-btn">지우기</button>
  </div>

  <script type="module">
    // 1. Hugging Face 미러 CDN을 통해 Transformers.js v3 로드
    import { pipeline } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2';

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusText = document.getElementById('status');
    const resultBox = document.getElementById('result-box');
    const clearBtn = document.getElementById('clear-btn');

    let vlmPipeline = null;
    let isDrawing = false;
    let debounceTimeout = null;

    // 2. 화면 크기에 맞게 캔버스 크기 초기화
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    resizeCanvas();

    // 3. AI 모델 로드 (갤럭시 S24U / 탭S8 WebGPU 활성화 유도)
    async function initAI() {
      try {
        statusText.innerText = "초경량 AI 모델 다운로드 중... (최초 1회)";
        
        // 브라우저 캐시를 사용해 로컬 연산하는 비전 모델 가동
        vlmPipeline = await pipeline('image-to-text', 'Xenova/vit-gpt2-image-captioning', {
          device: 'webgpu' // 갤럭시 GPU 강제 할당 시도
        });
        
        statusText.innerText = "준비 완료! S펜으로 그려보세요.";
      } catch (e) {
        console.warn("WebGPU 미지원 또는 에러로 인해 CPU(Wasm) 모드로 전환합니다:", e);
        try {
          vlmPipeline = await pipeline('image-to-text', 'Xenova/vit-gpt2-image-captioning');
          statusText.innerText = "준비 완료 (Wasm 모드 구동)";
        } catch (err) {
          statusText.innerText = "AI 초기화 실패: " + err.message;
        }
      }
    }
    initAI();

    // 4. S펜 및 터치/마우스 그리기 이벤트 구현
    function getCoordinates(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function startDrawing(e) {
      isDrawing = true;
      const coords = getCoordinates(e);
      ctx.beginPath();
      ctx.moveTo(coords.x, coords.y);
      clearTimeout(debounceTimeout); // 그리는 도중에는 분석 대기 타이머 리셋
    }

    function draw(e) {
      if (!isDrawing) return;
      const coords = getCoordinates(e);
      
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = '#222222'; // 펜 색상

      ctx.lineTo(coords.x, coords.y);
      ctx.stroke();
    }

    function stopDrawing() {
      if (!isDrawing) return;
      isDrawing = false;
      
      // 사용자가 펜을 떼고 1.2초간 기다리면 AI가 실시간 분석 돌입 (디바운싱)
      clearTimeout(debounceTimeout);
      debounceTimeout = setTimeout(analyzeCanvas, 1200);
    }

    // 5. 실시간 비전 AI 분석 핵심 로직
    async function analyzeCanvas() {
      if (!vlmPipeline) return;

      try {
        statusText.innerText = "🧐 AI가 그림 분석 중...";
        
        // 현재 캔버스 화면을 이미지 데이터 주소(Base64)로 캡처
        const imageDataUrl = canvas.toDataURL('image/png');

        // 로컬 비전 AI 모델에 이미지 주소 전달
        const output = await vlmPipeline(imageDataUrl);
        
        // 영어로 출력되는 결과를 화면에 표시 (원할 경우 추후 번역 API 연동 가능)
        resultBox.innerText = `[AI 결과]: ${output[0].generated_text}`;
        statusText.innerText = "준비 완료! 추가로 그려보세요.";
      } catch (error) {
        console.error(error);
        statusText.innerText = "분석 중 오류가 발생했습니다.";
      }
    }

    // 이벤트 리스너 등록 (마우스 및 갤럭시 S펜/터치 대응)
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', stopDrawing);

    canvas.addEventListener('touchstart', startDrawing, { passive: true });
    canvas.addEventListener('touchmove', draw, { passive: true });
    window.addEventListener('touchend', stopDrawing);

    // 화면 초기화 버튼
    clearBtn.addEventListener('click', () => {
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      resultBox.innerText = "그림을 그리면 AI의 해석이 여기에 나타납니다.";
    });
  </script>
</body>
</html>

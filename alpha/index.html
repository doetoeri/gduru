// ── NEIS 설정 ──
const NEIS_URL   = 'https://open.neis.go.kr/hub';
const ATPT_CODE  = 'J10';
const SCHUL_CODE = '7531375';
const NEIS_KEY   = '4b9aa5aa974e4963ab8714cfb9850e41';

async function fetchNEIS(endpoint, params) {
    const qs = Object.entries({ KEY: NEIS_KEY, Type: 'json', pIndex: '1', pSize: '100', ...params })
        .map(([k, v]) => `${k}=${encodeURIComponent(v)}`).join('&');
    const url = `${NEIS_URL}/${endpoint}?${qs}`;
    const attempts = [
        url,
        `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
    ];
    for (const u of attempts) {
        try {
            const res = await fetch(u, { signal: AbortSignal.timeout(10000) });
            if (!res.ok) continue;
            const data = await res.json();
            if (data) return data;
        } catch (e) {
            console.warn('NEIS fetch 실패, 다음 시도:', e.message);
        }
    }
    throw new Error('NEIS 연결 실패');
}

function parseMealMenu(raw) {
    return raw.replace(/\([^)]*\)/g, '').replace(/<br\/>/gi, ',')
        .split(',').map(s => s.trim()).filter(Boolean).join(', ');
}

function getKSTDateStr(offset = 0) {
    const d = new Date(Date.now() + 9 * 3600000 + offset * 86400000);
    return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
}

function fmtDate(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function vibrate(type) {
    if (!navigator.vibrate) return;
    if (type === 'click')   navigator.vibrate(20);
    if (type === 'success') navigator.vibrate([30,40,30]);
    if (type === 'delete')  navigator.vibrate([80,50,80]);
}

const PERIODS = [
    { label:'1교시', start:'08:30', end:'09:20' },
    { label:'2교시', start:'09:30', end:'10:20' },
    { label:'3교시', start:'10:30', end:'11:20' },
    { label:'4교시', start:'11:30', end:'12:20' },
    { label:'5교시', start:'13:10', py: '14:00' },
    { label:'6교시', start:'14:10', end:'15:00' },
    { label:'7교시', start:'15:10', end:'16:00' },
];

function getCurrentPeriod() {
    const now = new Date();
    const hhmm = now.getHours() * 60 + now.getMinutes();
    for (let i = 0; i < PERIODS.length; i++) {
        const [sh, sm] = PERIODS[i].start.split(':').map(Number);
        const [eh, em] = PERIODS[i].end.split(':').map(Number);
        if (hhmm >= sh * 60 + sm && hhmm <= eh * 60 + em) return i;
    }
    return -1;
}

function App() {

    const [isScrolled, setIsScrolled]     = useState(false);
    const [isDesktop, setIsDesktop]       = useState(window.innerWidth >= 768);

    const [announcements, setAnnouncements] = useState([]);
    const [schedules, setSchedules]         = useState([]);
    const [materials, setMaterials]         = useState([]);
    const [messages, setMessages]           = useState([]);
    const [links, setLinks]                 = useState([]);
    const [planner, setPlanner]             = useState([]);
    const [memos, setMemos]                 = useState({});
    const [meals, setMeals]                 = useState({});
    const [timetables, setTimetables]       = useState({});

    const [showModal, setShowModal]     = useState(false);
    const [modalType, setModalType]     = useState('');
    const [modalTarget, setModalTarget] = useState('');
    const [val1, setVal1] = useState('');
    const [val2, setVal2] = useState('');
    const [file, setFile] = useState('');
    const [customDialog, setCustomDialog] = useState(null);

    const today    = getKSTDateStr();
    const [ttDate, setTtDate]     = useState(today);
    const [mealDate, setMealDate] = useState(today);

    const initToday = new Date();
    const [calYear, setCalYear]       = useState(initToday.getFullYear());
    const [calMonth, setCalMonth]     = useState(initToday.getMonth());
    const [selectedDate, setSelectedDate] = useState(null);

    const synced = useRef(new Set());
    const [syncState, setSyncState] = useState({});
    const [installPrompt, setInstallPrompt] = useState(null);

    const schedulesRef   = useRef([]);
    const mealsRef       = useRef({});
    const memosRef       = useRef({});
    const timetablesRef  = useRef({});
    const firedRef       = useRef({});

    useEffect(() => { schedulesRef.current  = schedules;  }, [schedules]);
    useEffect(() => { mealsRef.current      = meals;      }, [meals]);
    useEffect(() => { memosRef.current      = memos;      }, [memos]);
    useEffect(() => { timetablesRef.current = timetables; }, [timetables]);

    useEffect(() => {
        const handler = () => setIsDesktop(window.innerWidth >= 768);
        window.addEventListener('resize', handler);
        return () => window.removeEventListener('resize', handler);
    }, []);

    useEffect(() => {
        const handler = () => setIsScrolled(window.scrollY > 40);
        window.addEventListener('scroll', handler);
        return () => window.removeEventListener('scroll', handler);
    }, []);

    const setTab = (tab) => {
        setActiveTab(tab);

    };

    useEffect(() => {
        if ('Notification' in window) setNotiPerm(Notification.permission);
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./duru-sw.js').catch(() => {});

        const handler = (e) => { e.preventDefault(); setInstallPrompt(e); };
        window.addEventListener('beforeinstallprompt', handler);
        return () => window.removeEventListener('beforeinstallprompt', handler);
    }, []);

    const fireNotif = (title, body) => {
        if (!('Notification' in window) || Notification.permission !== 'granted') return;
        const opts = { body, icon: './duru-icon-192.png', badge: './duru-icon-192.png' };
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistration().then(reg => {
                if (reg) reg.showNotification(title, opts).catch(() => { try { new Notification(title, opts); } catch(e){} });
                else { try { new Notification(title, opts); } catch(e){} }
            }).catch(() => { try { new Notification(title, opts); } catch(e){} });
        } else {
            try { new Notification(title, opts); } catch(e) {}
        }
    };

    const NOTIF_SCHEDULE = [
        { hhmm: '08:40', type: 'schedule' },
        { hhmm: '09:25', type: 'memo', periodIdx: 1 },
        { hhmm: '10:25', type: 'memo', periodIdx: 2 },
        { hhmm: '11:25', type: 'memo', periodIdx: 3 },
        { hhmm: '13:15', type: 'meal' },
        { hhmm: '14:05', type: 'memo', periodIdx: 5 },
        { hhmm: '15:05', type: 'memo', periodIdx: 6 },
    ];
    useEffect(() => {
        const tick = () => {
            if (!('Notification' in window) || Notification.permission !== 'granted') return;
            const todayKey = getKSTDateStr();
            const now = new Date();
            const hhmm = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            for (const n of NOTIF_SCHEDULE) {
                const key = `${todayKey}_${n.hhmm}`;
                if (hhmm !== n.hhmm || firedRef.current[key]) continue;
                firedRef.current[key] = true;
                if (n.type === 'schedule') {
                    const list = schedulesRef.current.filter(s => s.date === todayKey);
                    if (list.length) fireNotif('📅 오늘 학급 일정', list.map(s => s.title).join(', '));
                } else if (n.type === 'meal') {
                    const menu = mealsRef.current[todayKey];
                    if (menu) fireNotif('🍱 오늘 점심 급식', menu);
                } else if (n.type === 'memo') {
                    const memo = memosRef.current[`${todayKey}_${n.periodIdx + 1}`];
                    if (memo) fireNotif(`📝 ${n.periodIdx + 1}교시 메모`, memo);
                }
            }
        };
        const id = setInterval(tick, 30000);
        tick();
        return () => clearInterval(id);
    }, []);

    useEffect(() => {
        if(!isConfigured) {
            setIsLoading(false);
            return;
        }
        setIsLoading(true);
        auth.signInAnonymously()
            .then(() => setStatusText('LIVE'))
            .catch(() => setStatusText('ERROR'))

        return auth.onAuthStateChanged(user => {
            if (!user || !isConfigured) return;
            pubCol('announcements').onSnapshot(s => setAnnouncements(s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.at-a.at)));
            pubCol('schedules').onSnapshot(s => setSchedules(s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>new Date(a.date)-new Date(b.date))));
            pubCol('materials').onSnapshot(s => setMaterials(s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.at-a.at)));
            pubCol('messages').onSnapshot(s => setMessages(s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.at-a.at)));
            pubCol('links').onSnapshot(s => setLinks(s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.at-b.at)));
            pubCol('memos').onSnapshot(s => { const t={}; s.docs.forEach(d=>t[d.id]=d.data().content); setMemos(t); });
            pubCol('meals').onSnapshot(s => { const t={}; s.docs.forEach(d=>t[d.id]=d.data().menu); setMeals(t); });
            pubCol('timetables').onSnapshot(s => { const t={}; s.docs.forEach(d=>t[d.id]=d.data().periods); setTimetables(t); });
            privCol(user.uid,'planner').onSnapshot(s => setPlanner(s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.at-a.at)));
        });
    }, [isConfigured, pubCol, privCol]);

    const syncMeal = useCallback(async (dateStr) => {
        if (!isConfigured || synced.current.has('meal_'+dateStr)) return;
        synced.current.add('meal_'+dateStr);
        try {
            const data = await fetchNEIS('mealServiceDietInfo', {
                ATPT_OFCDC_SC_CODE: ATPT_CODE, SD_SCHUL_CODE: SCHUL_CODE,
                MMEAL_SC_CODE: '2', MLSV_YMD: dateStr.replace(/-/g,'')
            });
            const rows = data?.mealServiceDietInfo?.[1]?.row;
            if (rows?.length) {
                await pubCol('meals').doc(dateStr).set({ menu: parseMealMenu(rows[0].DDISH_NM), at: Date.now() });
            }
        } catch(e) { console.error('급식 조회 실패:', e.message); }
    }, [isConfigured, pubCol]);

    const syncTimetable = useCallback(async (dateStr) => {
        if (!isConfigured || synced.current.has('tt_'+dateStr)) return;
        synced.current.add('tt_'+dateStr);

        setSyncState(p => ({...p, [dateStr]: 'loading'}));
        try {
            const d = new Date(dateStr + 'T00:00:00');
            const dow = d.getDay() || 7;
            const mon = new Date(d); mon.setDate(d.getDate() - dow + 1);
            const fri = new Date(d); fri.setDate(d.getDate() - dow + 5);
            const fmt = x => `${x.getFullYear()}${String(x.getMonth()+1).padStart(2,'0')}${String(x.getDate()).padStart(2,'0')}`;

            // 동적 학년 및 반 연동
            const data = await fetchNEIS('hisTimetable', {
                ATPT_OFCDC_SC_CODE: ATPT_CODE, SD_SCHUL_CODE: SCHUL_CODE,
                GRADE: grade, CLASS_NM: classNm,
                TI_FROM_YMD: fmt(mon), TI_TO_YMD: fmt(fri)
            });

            const rows = data?.hisTimetable?.[1]?.row;
            if (rows?.length) {
                const map = {};
                rows.forEach(item => {
                    const ymd = item.ALL_TI_YMD;
                    const ds  = `${ymd.slice(0,4)}-${ymd.slice(4,6)}-${ymd.slice(6,8)}`;
                    const idx = parseInt(item.PERIO) - 1;
                    const sub = item.ITRT_CNTNT.replace(/\d+$/, '').trim();
                    if (!map[ds]) map[ds] = Array(7).fill('-');
                    if (idx >= 0 && idx < 7) map[ds][idx] = sub;
                });
                await Promise.all(Object.entries(map).map(([ds, periods]) =>
                    pubCol('timetables').doc(ds).set({ periods, at: Date.now() })
                ));
                setSyncState(p => ({...p, [dateStr]: 'done'}));
            } else {
                setSyncState(p => ({...p, [dateStr]: 'done'}));
            }
        } catch(e) {
            console.error('시간표 조회 실패:', e.message);
            setSyncState(p => ({...p, [dateStr]: 'error'}));
        }
    }, [isConfigured, grade, classNm, pubCol]);

    useEffect(() => {
        if (!auth.currentUser || !isConfigured) return;
        syncMeal(mealDate);
    }, [mealDate, syncMeal, isConfigured]);

    useEffect(() => {
        if (!auth.currentUser || !isConfigured) return;
        syncTimetable(ttDate);
    }, [ttDate, syncTimetable, isConfigured]);

    useEffect(() => {
        if (statusText !== 'LIVE' || !isConfigured) return;
        syncMeal(today);
        syncTimetable(today);
    }, [statusText, isConfigured, syncMeal, syncTimetable, today]);

    useEffect(() => {
        if (!selectedDate || !auth.currentUser || !isConfigured) return;
        syncMeal(selectedDate);
        syncTimetable(selectedDate);
    }, [selectedDate, syncMeal, syncTimetable, isConfigured]);

    useEffect(() => {
        if (activeTab !== 'cal' || statusText !== 'LIVE' || !isConfigured) return;
        const last = new Date(calYear, calMonth + 1, 0).getDate();
        for (let day = 1; day <= last; day++) {
            const d = new Date(calYear, calMonth, day);
            const dow = d.getDay();
            if (dow === 0 || dow === 6) continue;
            const ds = fmtDate(d);
            syncMeal(ds);
            syncTimetable(ds);
        }
    }, [activeTab, calYear, calMonth, statusText, syncMeal, syncTimetable, isConfigured]);

    const forceResync = (dateStr) => {
        synced.current.delete('tt_'+dateStr);
        setSyncState(p => ({...p, [dateStr]: undefined}));
        syncTimetable(dateStr);
        vibrate('success');
    };

    const deleteDoc = (col, id, isPrivate=false) => {
        vibrate('delete');
        setCustomDialog({
            type: 'confirm',
            message: '이 데이터를 영구히 삭제할까요?',
            onConfirm: async () => {
                const ref = isPrivate ? privCol(auth.currentUser.uid, col) : pubCol(col);
                await ref.doc(id).delete();
                setCustomDialog(null);
            }
        });
    };

    const openModal = (type, target='', presetVal2='') => {
        vibrate('click');
        setModalType(type); setModalTarget(target);
        if (type==='MEMO') setVal1(memos[target]||'');
        else if (type==='MEAL') setVal1(meals[target]||'');
        else if (type==='TIME') setVal1((timetables[target]||[]).join(', '));
        else { setVal1(''); }
        setVal2(presetVal2); setFile('');
        setShowModal(true);
    };

    const submitModal = async () => {
        const user = auth.currentUser; if (!user) return;
        vibrate('success');
        try {
            if (modalType==='NOTICE') await pubCol('announcements').add({title:val1,content:val2,image:file,at:Date.now()});
            else if (modalType==='PLAN') await privCol(user.uid,'planner').add({text:val1,done:false,date:today,at:Date.now()});
            else if (modalType==='SCHED') await pubCol('schedules').add({title:val1,date:val2,at:Date.now()});
            else if (modalType==='FILE') await pubCol('materials').add({title:val1,subject:val2,file,at:Date.now()});
            else if (modalType==='MEMO') await pubCol('memos').doc(modalTarget).set({content:val1,at:Date.now()});
            else if (modalType==='MEAL') await pubCol('meals').doc(modalTarget).set({menu:val1,at:Date.now()});
            else if (modalType==='TIME') await pubCol('timetables').doc(modalTarget).set({periods:val1.split(',').map(s=>s.trim()),at:Date.now()});
            else if (modalType==='MSG') {
                if(!val2.trim()) return;
                await pubCol('messages').add({author:val1.trim()||'익명', content:val2.trim(), at:Date.now()});
            }
            else if (modalType==='LINK') {
                if(!val1.trim() || !val2.trim()) return;
                await pubCol('links').add({title:val1.trim(), url:val2.trim(), at:Date.now()});
            }
        } catch(e) { console.error(e); }
        setShowModal(false);
    };

    const dday = (ds) => {
        const [y1, m1, d1] = ds.split('-').map(Number);
        const [y2, m2, d2] = today.split('-').map(Number);
        const targetDate = new Date(y1, m1 - 1, d1);
        const currentDate = new Date(y2, m2 - 1, d2);
        const diffDays = Math.round((targetDate - currentDate) / 86400000);
        return diffDays === 0 ? 'D-Day' : diffDays > 0 ? `D-${diffDays}` : `D+${Math.abs(diffDays)}`;
    };

    const nextSchedule = schedules.find(s => s.date >= today);
    const todayTt = timetables[today] || [];
    const curPeriod = getCurrentPeriod();

    const calCells = useMemo(() => {
        const first = new Date(calYear, calMonth, 1);
        const startDow = first.getDay();
        const last = new Date(calYear, calMonth + 1, 0).getDate();
        const cells = [];
        for (let i = startDow - 1; i >= 0; i--) {
            const d = new Date(calYear, calMonth, -i);
            cells.push({ date: d, current: false });
        }
        for (let i = 1; i <= last; i++) {
            cells.push({ date: new Date(calYear, calMonth, i), current: true });
        }
        while (cells.length < 42) {
            const idx = cells.length - startDow - last + 1;
            cells.push({ date: new Date(calYear, calMonth + 1, idx), current: false });
        }
        return cells;
    }, [calYear, calMonth]);

    const goPrevMonth = () => {
        vibrate('click');
        if (calMonth === 0) { setCalYear(y => y - 1); setCalMonth(11); }
        else setCalMonth(m => m - 1);
    };
    const goNextMonth = () => {
        vibrate('click');
        if (calMonth === 11) { setCalYear(y => y + 1); setCalMonth(0); }
        else setCalMonth(m => m + 1);
    };
    const goToday = () => {
        vibrate('click');
        const d = new Date();
        setCalYear(d.getFullYear()); setCalMonth(d.getMonth());
    };

    // ── 🎨 브랜드 로고 컴포넌트 (gDuru Alpha 필기체 반영) ──

        <div className={`font-black flex items-center justify-center tracking-tight select-none text-slate-800 ${size}`}>
            <span className="font-g text-indigo-600 italic translate-y-[-2px] tracking-normal mr-[1px]" style={{fontSize: '1.35em'}}>g</span>
            <span>Duru</span>
            {showBadge && (
                <span className="text-[9px] bg-indigo-600 text-white font-black px-1.5 py-0.5 rounded-md ml-1.5 tracking-wide uppercase scale-90">Alpha</span>
            )}
        </div>

        return (
            <div className="flex items-center justify-center min-h-screen bg-[#E5E9F0] p-4">
                <div className="tactile-plate p-8 max-w-sm w-full flex flex-col items-center gap-6">
                    <div className="text-center">
                        <BrandLogo size="text-3xl" />

                    </div>
                    <div className="w-full space-y-4">
                        <div>
                            <label className="text-xs font-black text-slate-500 block mb-1 ml-1">학년</label>

                                <option value="1">1학년</option>
                                <option value="2">2학년</option>
                                <option value="3">3학년</option>
                            </select>

                            <label className="text-xs font-black text-slate-500 block mb-1 ml-1">반</label>

                        </div>
                        <button onClick={() => {
                            const g = document.getElementById('onboard-grade').value;
                            const c = document.getElementById('onboard-class').value;
                            if(!c || c < 1) return;
                            localStorage.setItem('gduru_grade', g);
                            localStorage.setItem('gduru_class', c);
                            setGrade(g); setClassNm(c);
                            setIsConfigured(true); vibrate('success');
                        }} className="w-full tactile-pill-btn-primary py-4 font-[900] mt-2">
                            시작하기
                        </button>
                    </div>
                </div>
            </div>
        );
    }

    if (isLoading) return (
        <div className="flex items-center justify-center h-screen bg-[#E5E9F0]">
            <div className="tactile-plate p-10 flex flex-col items-center gap-6">
                <div className="relative w-24 h-24 flex items-center justify-center">
                    <div className="absolute inset-0 rounded-full border-4 border-[#E2E8F0] border-t-[#2563EB] animate-spin"></div>
                    <BrandLogo showBadge={false} size="text-md" />
                </div>
                <p className="text-xs font-bold text-slate-500">기판 부팅 중...</p>
            </div>
        </div>
    );

    const TAB_HOME = (
        <div className="space-y-6">
            <div className={`grid gap-4 ${isDesktop ? 'grid-cols-2' : 'grid-cols-1'}`}>
                <div className="tactile-card p-6">
                    <div className="flex items-center justify-between mb-4">
                        <h3 className="font-[900] text-[18px]">오늘 시간표</h3>
                        <button onClick={() => setTab('time')} className="tactile-pill-btn px-3 py-1.5 text-xs">상세</button>
                    </div>
                    <div className="space-y-2">
                        {todayTt.filter(t => t !== '-').length ? todayTt.map((t, i) => t !== '-' && (
                            <div key={i} className={`flex items-center gap-3 px-4 py-2.5 rounded-2xl transition-all ${curPeriod === i ? 'bg-blue-100 border border-blue-200' : 'bg-white/60'}`}>
                                <span className={`text-xs font-black w-8 ${curPeriod===i ? 'text-blue-600' : 'text-slate-400'}`}>{i+1}교시</span>
                                <span className={`font-[900] text-[15px] ${curPeriod===i ? 'text-blue-700' : 'text-slate-700'}`}>{t}</span>
                                {curPeriod===i && <span className="ml-auto text-[10px] font-black text-blue-500 bg-blue-50 px-2 py-0.5 rounded-full">진행중</span>}
                            </div>
                        )) : <p className="text-center text-gray-400 py-4 font-bold text-sm">시간표 불러오는 중...</p>}
                    </div>
                </div>

                <div className="tactile-card p-6">
                    <div className="flex items-center justify-between mb-4">
                        <h3 className="font-[900] text-[18px]">오늘 급식 🍱</h3>
                        <button onClick={() => setTab('meal')} className="tactile-pill-btn px-3 py-1.5 text-xs">상세</button>
                    </div>
                    <div className="debossed-well p-4 flex flex-wrap gap-2 justify-center">
                        {meals[today] ? meals[today].split(',').map((m,i) => (
                            <span key={i} className="bg-white px-3 py-1.5 rounded-full text-[13px] font-[900] shadow-sm">{m.trim()}</span>
                        )) : <p className="text-gray-400 font-bold text-sm py-2">급식 조회 중...</p>}
                    </div>
                </div>

                            </button>
                        </div>
                    )) : <p className="text-[13px] text-slate-400 font-bold w-full py-2">등록된 바로가기가 없습니다.</p>}

                {nextSchedule && (
                    <span className="inline-block mt-2 text-[13px] font-[800] text-blue-600 bg-blue-100 px-3 py-1 rounded-full">
                        {dday(nextSchedule.date)} ({nextSchedule.date})
                    </span>

                    <button onClick={() => setTab('cal')} className="tactile-pill-btn-primary px-5 py-2 text-xs">📅 전체 캘린더 보기</button>
                </div>
            </div>

            <div className="tactile-card p-6">
                <div className="flex justify-between items-center mb-4">
                    <h2 className="font-[900] text-[22px]">학급 알림</h2>
                    <button onClick={() => openModal('NOTICE')} className="tactile-pill-btn px-4 py-2 text-xs">알림 쓰기</button>
                </div>
                <div className="space-y-3">
                    {announcements.length ? announcements.map(a => (

                    )) : <p className="text-center text-gray-400 py-4 font-[600]">등록된 공지사항이 없습니다.</p>}

                <div className="text-center">
                    <div className="font-[900] text-[22px] text-slate-800 leading-tight">{calYear}년 {calMonth+1}월</div>
                    <button onClick={goToday} className="text-[11px] font-black text-blue-600 mt-0.5">오늘로 이동</button>
                </div>
                <button onClick={goNextMonth} className="tactile-pill-btn w-11 h-11"><Icons.ChevR/></button>
            </div>

                <div className="grid grid-cols-7 mb-2 px-1">
                    {DOW_LABEL.map((d,i) => (
                        <div key={i} className={`text-center text-[11px] font-[900] py-2 ${i===0?'text-red-500':i===6?'text-blue-500':'text-slate-600'}`}>{d}</div>
                    ))}
                </div>
                <div className="grid grid-cols-7 gap-1">
                    {calCells.map((cell, i) => {
                        const ds = fmtDate(cell.date);
                        const events = schedules.filter(s => s.date === ds);
                        const hasMeal = !!meals[ds];
                        const hasTt = (timetables[ds] || []).some(t => t && t !== '-');
                        const isToday = ds === today;
                        const isSelected = selectedDate === ds;
                        const dow = cell.date.getDay();
                        const dayNumColor = !cell.current ? 'text-slate-400' : (isToday ? 'text-white' : dow===0 ? 'text-red-500' : dow===6 ? 'text-blue-500' : 'text-slate-700');
                        return (
                            <button key={i}
                                onClick={() => { vibrate('click'); setSelectedDate(ds); }}
                                className={`cal-cell ${!cell.current ? 'cal-cell-other' : ''} ${isToday ? 'cal-cell-today' : ''} ${isSelected && !isToday ? 'cal-cell-selected' : ''}`}>
                                <span className={`text-[13px] font-[900] ${dayNumColor}`}>{cell.date.getDate()}</span>
                                {cell.current && (
                                    <>
                                        {events[0] && (
                                            <span className={`mt-0.5 text-[9px] font-[900] truncate max-w-full px-1 rounded ${isToday ? 'bg-white/30 text-white' : 'bg-red-100 text-red-600'}`}>
                                                {events[0].title.length > 4 ? events[0].title.slice(0,4)+'…' : events[0].title}

                                        )}
                                        <div className="flex gap-1 mt-auto pb-0.5">

                                        </div>
                                    </>
                                )}
                            </button>
                        );
                    })}
                </div>
                <div className="mt-3 flex gap-4 justify-center text-[10px] font-bold text-slate-500 flex-wrap">
                    <span className="flex items-center gap-1"><div className="cal-dot" style={{background:'#EF4444'}}></div>학급일정</span>
                    <span className="flex items-center gap-1"><div className="cal-dot" style={{background:'#3B82F6'}}></div>시간표</span>
                    <span className="flex items-center gap-1"><div className="cal-dot" style={{background:'#10B981'}}></div>급식</span>
                </div>

            <div className="tactile-card p-5">

                    <h3 className="font-[900] text-[16px]">{calMonth+1}월 일정 한눈에</h3>

                </div>
                <div className="space-y-2">
                    {schedules.filter(s => {
                        const d = new Date(s.date + 'T00:00:00');
                        return d.getFullYear() === calYear && d.getMonth() === calMonth;
                    }).length ? schedules.filter(s => {
                        const d = new Date(s.date + 'T00:00:00');
                        return d.getFullYear() === calYear && d.getMonth() === calMonth;
                    }).map(s => (
                        <button key={s.id} onClick={() => { vibrate('click'); setSelectedDate(s.date); }}

                        </div>

                        <div className="mb-4">
                            <div className="flex items-center justify-between mb-2">
                                <h4 className="font-[900] text-[14px] text-red-500 flex items-center gap-1">📅 학급 일정</h4>
                                <button onClick={() => openModal('SCHED', '', selDate)} className="tactile-pill-btn px-3 py-1 text-[10px]">+ 추가</button>
                            </div>
                            <div className="debossed-well p-3 space-y-1.5">
                                {selSchedules.length ? selSchedules.map(s => (
                                    <div key={s.id} className="bg-white px-3 py-2 rounded-xl flex items-center justify-between shadow-sm">
                                        <span className="font-[900] text-[14px] text-slate-800">{s.title}</span>
                                        <button onClick={() => deleteDoc('schedules', s.id)} className="text-red-400 text-sm font-black px-1">×</button>
                                    </div>
                                )) : <p className="text-[12px] text-slate-400 font-bold text-center py-2">등록된 일정이 없습니다.</p>}
                            </div>
                        </div>

                        <div className="mb-4">
                            <div className="flex items-center justify-between mb-2">
                                <h4 className="font-[900] text-[14px] text-blue-500 flex items-center gap-1">📚 시간표</h4>
                                <button onClick={() => openModal('TIME', selDate)} className="tactile-pill-btn px-3 py-1 text-[10px]">편집</button>
                            </div>
                            <div className="debossed-well p-3 space-y-1">
                                {(selTt.length ? selTt : Array(7).fill('-')).map((subj, i) => (
                                    <div key={i} className="flex items-center gap-2 bg-white px-3 py-1.5 rounded-xl">
                                        <span className="text-[10px] font-black text-slate-400 w-10 shrink-0">{i+1}교시</span>
                                        <span className="font-[900] text-[13px] text-slate-800 flex-1 truncate">{subj === '-' ? '—' : subj}</span>
                                        <span className="text-[9px] font-bold text-slate-400 shrink-0">{PERIODS[i].start}</span>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="mb-2">
                            <div className="flex items-center justify-between mb-2">
                                <h4 className="font-[900] text-[14px] text-emerald-500 flex items-center gap-1">🍱 점심 급식</h4>
                                <button onClick={() => openModal('MEAL', selDate)} className="tactile-pill-btn px-3 py-1 text-[10px]">편집</button>
                            </div>
                            <div className="debossed-well p-3 flex flex-wrap gap-1.5">
                                {selMeal ? selMeal.split(',').map((m,i) => (
                                    <span key={i} className="bg-white px-3 py-1.5 rounded-full text-[12px] font-[900] shadow-sm">{m.trim()}</span>
                                )) : <p className="text-[12px] text-slate-400 font-bold text-center py-2 w-full">급식 정보가 없습니다.</p>}
                            </div>
                        </div>
                    </div>
                </div>
            )}

            {/* ── 커스텀 다이얼로그 ── */}
            {customDialog && (
                <div className="fixed inset-0 z-[110] bg-black/20 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="tactile-card w-full max-w-xs p-6 flex flex-col text-center">
                        <div className="w-14 h-14 bg-amber-50 rounded-full mx-auto mb-3 flex items-center justify-center"><Icons.Alert/></div>
                        <h3 className="text-lg font-black mb-1">gDuru 안내</h3>
                        <p className="text-xs font-bold text-slate-500 leading-relaxed mb-5 whitespace-pre-wrap">{customDialog.message}</p>
                        <div className="flex gap-3">
                            {customDialog.type==='confirm' ? <>
                                <button onClick={() => setCustomDialog(null)} className="tactile-pill-btn flex-1 py-3 text-xs">취소</button>
                                <button onClick={customDialog.onConfirm} className="tactile-pill-btn-primary flex-1 py-3 text-xs">확인</button>
                            </> : (
                                <button onClick={() => setCustomDialog(null)} className="tactile-pill-btn-primary w-full py-3 text-xs">확인</button>
                            )}
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>

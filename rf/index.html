<script type="text/plain" id="app-src">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ============================================================
   DESIGN TOKENS
   ============================================================ */
const T = {
  bg:'#eef1f5', panel:'#f7f9fc', silver:'#dfe4ec', grid:'#c8d2df',
  ink:'#1f2733', sub:'#5b6675', line:'#9aa7b8', wall:'#3a4657',
  accent:'#2f6fb0', accent2:'#1b4e82', mint:'#12d3b0', entry:'#2fae5a',
  solo:'#2fae5a', couple:'#8a4fd6', family:'#e08a2b',
  wait:'#e0453b', bypass:'#2f7fd6',
  tech:'#2f6fb0', fnb:'#e08a2b', culture:'#8a4fd6', trend:'#2f9e8f'
};
const CAT_COLOR = { Tech:T.tech, 'F&B':T.fnb, Culture:T.culture, Trend:T.trend };
const CAT_KO = { Tech:'테크', 'F&B':'푸드', Culture:'문화예술', Trend:'트렌드' };

function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function rnd(){ return Math.random(); }
function pick(a){ return a[Math.floor(rnd()*a.length)]; }
function seededRand(seed){ let s=seed%2147483647; if(s<=0)s+=2147483646;
  return ()=>{ s=(s*16807)%2147483647; return (s-1)/2147483646; }; }

/* ============================================================
   THERMAL-CAMERA COLOR MAP (iron palette)
   ============================================================ */
const THERMAL_STOPS = [
  [0.00,[9,10,38]],[0.18,[42,14,96]],[0.36,[122,20,140]],
  [0.54,[214,42,74]],[0.70,[246,116,20]],[0.86,[255,203,26]],[1.00,[255,255,238]]
];
function thermalRGB(v){
  v=clamp(v,0,1);
  for(let i=1;i<THERMAL_STOPS.length;i++){
    if(v<=THERMAL_STOPS[i][0]){
      const a=THERMAL_STOPS[i-1], b=THERMAL_STOPS[i];
      const t=(v-a[0])/((b[0]-a[0])||1);
      return [0,1,2].map(k=>Math.round(a[1][k]+(b[1][k]-a[1][k])*t));
    }
  }
  return THERMAL_STOPS[THERMAL_STOPS.length-1][1];
}
function thermalCss(v,al){ const c=thermalRGB(v); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+(al==null?1:al)+')'; }

}

        <div className="text-[8px] hair text-bp-sub mt-1">MADE BY DIJKSTRA · GRAND CONVENTION</div>

}
function LogoBig(){

    <div className="flex flex-col items-center gap-3">

}

/* ============================================================
   SHARED UI  (subtle gradients, no shadow)
   ============================================================ */
function Btn({ children, onClick, active, tone='default', className='', disabled }){
  let cls;
  if(tone==='solid')       cls='g-accent text-white border-bp-accent2 hover:brightness-110';
  else if(tone==='ghost')  cls='bg-transparent text-bp-sub border-bp-line hover:text-bp-ink hover:border-bp-ink';
  else if(tone==='danger') cls= active?'g-wait text-white border-bp-wait':'g-sub text-bp-wait border-bp-wait hover:brightness-105';
  else if(tone==='mint')   cls= active?'g-mint text-white border-bp-mint':'g-sub text-bp-ink border-bp-line hover:border-bp-mint';
  else cls= active ? 'g-accent text-white border-bp-accent2'
                   : 'g-sub text-bp-ink border-bp-line hover:border-bp-accent hover:text-bp-accent';
  return (
    <button onClick={onClick} disabled={disabled}
      className={"no-sh px-3 py-1.5 text-xs font-semibold border tracking-wide transition-all "
        +"disabled:opacity-40 disabled:cursor-not-allowed "+cls+" "+className}>
      {children}
    </button>
  );
}
function Tile({ label, value, unit, tone='ink', hint }){
  const c={ink:'text-bp-ink',accent:'text-bp-accent2',wait:'text-bp-wait',mint:'text-bp-mint',bypass:'text-bp-bypass'}[tone];
  return (
    <div className="g-tile g-panel border border-bp-line p-3 no-sh">
      <div className="text-[10px] text-bp-sub hair uppercase">{label}</div>
      <div className={"text-2xl font-bold font-mono "+c}>{value}<span className="text-sm ml-0.5">{unit}</span></div>
      {hint && <div className="text-[9px] text-bp-line mt-0.5">{hint}</div>}
    </div>
  );
}
function Bar({ pct, tone='accent', h='h-2' }){
  const c={accent:'g-accent',wait:'g-wait',mint:'g-mint',bypass:'bg-bp-bypass',trend:'bg-bp-trend'}[tone];
  return <div className={"w-full "+h+" g-sub border border-bp-line"}>
    <div className={c+" h-full transition-all duration-500"} style={{width:clamp(pct,0,100)+'%'}}/></div>;
}
function SectionTitle({ no, title, sub }){
  return (
    <div className="flex items-end gap-2 border-b border-bp-line pb-2">
      <span className="text-2xl font-bold font-mono text-bp-line">{no}</span>
      <div><div className="text-sm font-bold text-bp-ink">{title}</div>
      <div className="text-[9px] hair text-bp-sub uppercase">{sub}</div></div>
    </div>
  );
}
function Legend({c,t}){ return <div className="flex items-center gap-1.5"><span className="w-3 h-3 border border-white" style={{background:c}}/><span>{t}</span></div>; }
function Row({k,v}){ return <div className="flex justify-between"><span className="text-bp-line">{k}</span><span className="font-mono">{v}</span></div>; }
function TInfo({k,v,c}){ return (
  <div className="g-sub border border-bp-line px-2 py-1.5 no-sh">
    <div className="text-[9px] text-bp-sub hair">{k}</div>
    <div className="font-mono font-bold text-bp-ink" style={c?{color:c}:null}>{v}</div>
  </div>
);}
function Sparkline({ data, color=T.accent, w=200, h=42, fill }){
  if(!data || data.length<2) return <svg width="100%" height={h}/>;
  const max=Math.max(1,...data), min=Math.min(0,...data);
  const rng=(max-min)||1;
  const pts=data.map((v,i)=>{
    const x=i/(data.length-1)*w;
    const y=h-4-((v-min)/rng)*(h-8);
    return x.toFixed(1)+','+y.toFixed(1);
  }).join(' ');
  return (
    <svg viewBox={"0 0 "+w+" "+h} width="100%" height={h} preserveAspectRatio="none">
      {fill && <polygon points={"0,"+h+" "+pts+" "+w+","+h} fill={color} fillOpacity="0.12"/>}
      <polyline points={pts} fill="none" stroke={color} strokeWidth="1.8"/>
    </svg>
  );
}

/* ============================================================
   GRAND CONVENTION FLOOR  (single hall, 35 composite booths)
   ============================================================ */
const G=24, M=14, COLS=40, ROWS=28;
const VW = M*2 + COLS*G;   // 988
const VH = M*2 + ROWS*G;   // 700
const USABLE_BOTTOM = ROWS-6;   // booths only above the entrance apron
const TW=32, TH=22;             // thermal grid
const worldC = (c)=> M + c*G + G/2;
const cellIdx = (cx,cy)=> cx + cy*COLS;

/* polyomino templates — each is squares assembled into a distinctive shape */
const SHAPES = [
  [[0,0],[1,0],[2,0],[2,1]],                 // L
  [[0,0],[0,1],[0,2],[1,0]],                 // r
  [[0,0],[1,0],[1,1],[2,1]],                 // S
  [[0,1],[1,1],[1,0],[2,0]],                 // Z
  [[0,0],[1,0],[0,1],[1,1]],                 // O
  [[1,0],[0,1],[1,1],[2,1]],                 // T
  [[1,0],[0,1],[1,1],[2,1],[1,2]],           // plus
  [[0,0],[2,0],[0,1],[1,1],[2,1]],           // U
  [[0,0],[1,0],[0,1],[1,1],[0,2]],           // P
  [[0,0],[1,0],[2,0],[0,1],[1,1],[2,1]],     // 3x2 block
  [[0,0],[1,0],[2,0]],                       // I3
  [[0,0],[1,0],[1,1],[1,2],[2,2]],           // stair
  [[0,0],[0,1],[1,1],[2,1],[2,0]],           // arch
  [[0,0],[1,0],[2,0],[3,0],[0,1]],           // long-L
  [[0,0],[1,0],[2,0],[1,1],[1,2]],           // T-tall
];

const BOOTH_DEFS = [
  ['AUTO DRIVE','자율주행 데모','Tech',true],   ['ROBO ARM','산업 로보틱스','Tech',false],
  ['DRONE BAY','드론 배송관','Tech',false],      ['CHIP LAB','반도체 클린룸','Tech',false],
  ['XR STUDIO','확장현실 체험','Tech',true],     ['AI CORE','온디바이스 AI','Tech',false],
  ['QUANTUM','양자 컴퓨팅','Tech',false],        ['SMART GRID','스마트 전력','Tech',false],
  ['CLOUD EDGE','엣지 클라우드','Tech',false],   ['BIO TECH','바이오 헬스','Tech',false],
  ['SPACE LAB','우주 항공관','Tech',false],      ['NANO LAB','나노 소재','Tech',false],
  ['PASTA BOT','3D 로봇 키친','F&B',true],       ['BARISTA BOT','스마트 커피','F&B',false],
  ['VEGAN LAB','비건 랩','F&B',false],           ['DESSERT 3D','3D 디저트','F&B',false],
  ['CRAFT BREW','수제 음료','F&B',false],        ['STREET FOOD','스트리트 푸드','F&B',false],
  ['GLOBAL GOURMET','세계 미식관','F&B',true],   ['SPICE WORLD','향신료관','F&B',false],
  ['FOOD LOUNGE','식음 라운지','F&B',false],
  ['AETHER HALL','인터랙티브 홀','Culture',true],['PROJECTION','프로젝션 맵핑','Culture',false],
  ['SOUND DOME','사운드 아트','Culture',false],  ['LIGHT MAZE','라이트 미로','Culture',false],
  ['AR MURAL','AR 벽화','Culture',false],        ['VR CINEMA','VR 시네마','Culture',false],
  ['ART LOUNGE','미디어 쉼터','Culture',false],  ['MEDIA WALL','미디어 파사드','Culture',false],
  ['SMART PHONE','차세대 폰','Trend',true],      ['WEARABLE','착용형 기기','Trend',false],
  ['GAMING RIG','게이밍 아레나','Trend',true],   ['NFT GALLERY','NFT 갤러리','Trend',false],
  ['PHOTO ZONE','포토 존','Trend',false],        ['SMART HOME','스마트홈','Trend',false],
];

function buildConvention(){
  const rng = seededRand(20260706);
  const CX = Math.floor(COLS/2);
  const entrancePt = { x:worldC(CX),   y:worldC(ROWS-2) };
  const exitPt     = { x:worldC(CX+4), y:worldC(ROWS-2) };

  const block = new Uint8Array(COLS*ROWS);
  const occ = {}; // idx -> boothId
  const key = (x,y)=> x+','+y;
  const set = new Set();

  const inUsable = (x,y)=> x>=1 && x<=COLS-2 && y>=1 && y<=USABLE_BOTTOM;
  const fits = (cells)=>{
    for(const c of cells){
      if(!inUsable(c[0],c[1])) return false;
      for(let dx=-1;dx<=1;dx++) for(let dy=-1;dy<=1;dy++){
        if(set.has(key(c[0]+dx,c[1]+dy))) return false; // 1-cell aisle gap
      }
    }
    return true;
  };

  const booths=[];
  for(let i=0;i<BOOTH_DEFS.length;i++){
    let placed=null;
    for(let t=0;t<900 && !placed;t++){
      const shp = SHAPES[Math.floor(rng()*SHAPES.length)];
      const ox = 1+Math.floor(rng()*(COLS-4));
      const oy = 1+Math.floor(rng()*(USABLE_BOTTOM-1));
      const cells = shp.map(c=>[c[0]+ox,c[1]+oy]);
      if(fits(cells)) placed=cells;
    }
    if(!placed) continue;
    const [label,sub,cat,hot] = BOOTH_DEFS[i];
    const id='B'+String(booths.length+1).padStart(2,'0');
    placed.forEach(c=>{ set.add(key(c[0],c[1])); block[cellIdx(c[0],c[1])]=1; occ[cellIdx(c[0],c[1])]=id; });

    // outline edges + choose a gate facing the entrance
    const cset=new Set(placed.map(c=>key(c[0],c[1])));
    const edges=[]; // {side,cx,cy, gx1,gy1,gx2,gy2, nx,ny, mid, outCell}
    for(const [cx,cy] of placed){
      const push=(side,gx1,gy1,gx2,gy2,nx,ny)=>{
        const ocx=cx+nx, ocy=cy+ny;
        edges.push({ side, cx,cy, gx1,gy1,gx2,gy2, nx,ny,
          mid:{ x:M+((gx1+gx2)/2)*G, y:M+((gy1+gy2)/2)*G },
          outCell:{cx:ocx,cy:ocy},
          outFree: ocx>=0&&ocx<COLS&&ocy>=0&&ocy<ROWS && block[cellIdx(ocx,ocy)]===0 });
      };
      if(!cset.has(key(cx,cy-1))) push('top',    cx,cy,   cx+1,cy,   0,-1);
      if(!cset.has(key(cx,cy+1))) push('bottom', cx,cy+1, cx+1,cy+1, 0, 1);
      if(!cset.has(key(cx-1,cy))) push('left',   cx,cy,   cx,cy+1,  -1, 0);
      if(!cset.has(key(cx+1,cy))) push('right',  cx+1,cy, cx+1,cy+1, 1, 0);
    }
    const cands=edges.filter(e=>e.outFree);
    let gate=cands[0];
    let best=1e9;
    for(const e of cands){
      const d=Math.hypot(e.mid.x-entrancePt.x, e.mid.y-entrancePt.y);
      if(d<best){ best=d; gate=e; }
    }
    const counter = { x:worldC(gate.outCell.cx), y:worldC(gate.outCell.cy) };
    // centroid for label
    let sx=0,sy=0; placed.forEach(c=>{ sx+=worldC(c[0]); sy+=worldC(c[1]); });
    const center={ x:sx/placed.length, y:sy/placed.length };

    booths.push({
      id, label, sub, cat, hot, color:CAT_COLOR[cat],
      cells:placed, edges, gate, counter, center,
      normal:{x:gate.nx,y:gate.ny},
      cap: hot?6:9,
    });
  }

  const facilities=[
    { x:entrancePt.x, y:VH-M-9, label:'ENTRANCE', kind:'entry' },
    { x:exitPt.x,     y:VH-M-9, label:'EXIT',     kind:'exit' },
    { x:M+42,   y:M+16,  label:'INFO' },
    { x:VW-M-42,y:M+16,  label:'MEDIA' },
    { x:M+18,   y:VH/2,  label:'WC' },
    { x:VW-M-18,y:VH/2,  label:'WC' },
  ];
  return { booths, block, occ, entrancePt, exitPt, facilities };
}
const EXPO = buildConvention();

function cellBlockedAt(x,y){
  const cx=Math.floor((x-M)/G), cy=Math.floor((y-M)/G);
  if(cx<0||cx>=COLS||cy<0||cy>=ROWS) return false;
  return EXPO.block[cellIdx(cx,cy)]===1;
}
function randFreePoint(){
  for(let t=0;t<40;t++){
    const cx=1+Math.floor(rnd()*(COLS-2)), cy=1+Math.floor(rnd()*(ROWS-2));
    if(EXPO.block[cellIdx(cx,cy)]===0) return { x:worldC(cx), y:worldC(cy) };
  }
  return { x:worldC(2), y:worldC(2) };
}

/* ============================================================
   VISITORS
   ============================================================ */
const COMPANIONS = [
  { key:'solo', ko:'혼자', color:T.solo },
  { key:'couple', ko:'연인', color:T.couple },
  { key:'family', ko:'가족', color:T.family },
];
const PREFS = [
  { ko:'테크', cat:'Tech' }, { ko:'트렌디', cat:'Trend' },
  { ko:'F&B', cat:'F&B' }, { ko:'문화예술', cat:'Culture' },
];
let AGENT_SEQ = 1000;
function makeAgent(){
  const comp=pick(COMPANIONS), pref=pick(PREFS);
  const e=EXPO.entrancePt;
  return {
    id:'V'+(AGENT_SEQ++),
    x:e.x+(rnd()-0.5)*40, y:e.y+(rnd()-0.5)*24,
    vx:0, vy:0,
    comp:comp.key, color:comp.color, pref:pref.ko, prefCat:pref.cat,
    patience:Math.floor(45+rnd()*55), spd:0.8+rnd()*0.5,
    state:'enter', target:null,
    waitT:0, dwellT:0, dwellMax:0, joinOrder:0,
    servePos:null, roamPt:randFreePoint(),
    accuracy:0.6+rnd()*2.0, dist:0, dead:false,
    bubble:null, seekTimer:1+rnd()*4, stuck:0,
  };
}
function chooseBooth(a, booths){
  let total=0; const w=[];
  for(const b of booths){
    let x=1;
    if(b.cat===a.prefCat) x+=3;
    if(b.hot) x+=1.6;
    w.push(x); total+=x;
  }
  let r=rnd()*total;
  for(let i=0;i<booths.length;i++){ r-=w[i]; if(r<=0) return booths[i].id; }
  return booths[0].id;
}
function needText(a, booths){
  if(a.state==='enter') return '입장! 어디부터 가볼까';
  if(a.state==='exit')  return '오늘 재밌었다, 이만 퇴장';
  if(a.state==='queue'){
    const opt=['줄이 좀 기네요','얼마나 기다려야 하죠?','조금 지치네요','앞에 몇 명이지?'];
    return opt[a.id.charCodeAt(a.id.length-1)%opt.length];
  }
  if(a.state==='serve'){
    return a.prefCat==='F&B'?'오 이거 맛있다!':a.prefCat==='Culture'?'분위기 좋다':'와 신기하네요';
  }
  if(a.patience<32) return '다리 아파요, 쉬고 싶어';
  if(a.state==='bypass') return '덜 붐비는 곳으로 갈게요';
  if((a.state==='seek') && a.target){ const b=booths.find(x=>x.id===a.target); if(b) return b.label+' 가는 중'; }
  return ({Tech:'테크 부스 어디예요?',['F&B']:'뭐 좀 먹을까?',Culture:'전시 보러 가자',Trend:'요즘 핫한 곳!'})[a.prefCat];
}

/* ============================================================
   THERMAL RENDER HELPERS
   ============================================================ */
function drawThermalField(ctx, field, W, H, alpha){
  let peak=0.0001; for(let i=0;i<field.length;i++) if(field[i]>peak) peak=field[i];
  const cw=W/TW, ch=H/TH;
  ctx.clearRect(0,0,W,H);
  ctx.save(); ctx.filter='blur('+Math.max(4,W/70)+'px)';
  for(let j=0;j<TH;j++) for(let i=0;i<TW;i++){
    ctx.fillStyle=thermalCss(field[i+j*TW]/peak, alpha==null?1:alpha);
    ctx.fillRect(i*cw, j*ch, cw+1.2, ch+1.2);
  }
  ctx.restore();
}
function ThermalOverlay({ engine }){
  const ref=useRef();
  useEffect(()=>{
    const cv=ref.current, ctx=cv.getContext('2d'); let raf;
    const loop=()=>{
      if(engine.showThermal){ cv.style.opacity='0.6'; drawThermalField(ctx, engine.thermal, VW, VH, 1); }
      else cv.style.opacity='0';
      raf=requestAnimationFrame(loop);
    };
    loop(); return ()=>cancelAnimationFrame(raf);
  },[]);
  return <canvas ref={ref} width={VW} height={VH}
    className="absolute inset-0 w-full h-full pointer-events-none transition-opacity duration-300"
    style={{opacity:0}}/>;
}
function ThermalMini({ engine, h=120 }){
  const ref=useRef();
  useEffect(()=>{
    const cv=ref.current, ctx=cv.getContext('2d'); let raf;
    const loop=()=>{ drawThermalField(ctx, engine.thermal, cv.width, cv.height, 1); raf=requestAnimationFrame(loop); };
    loop(); return ()=>cancelAnimationFrame(raf);
  },[]);
  return <canvas ref={ref} width={320} height={Math.round(320*TH/TW)}
    className="w-full border border-bp-line" style={{height:h}}/>;
}

/* ============================================================

   ============================================================ */
const BoothLayer = React.memo(function BoothLayer({ booths, filter }){
  return (
    <g>
      <rect data-bg="1" x="0" y="0" width={VW} height={VH} fill="url(#bp)"/>
      <rect x={M-2} y={M-2} width={VW-2*(M-2)} height={VH-2*(M-2)} fill="none" stroke={T.line} strokeWidth="1.6"/>
      {/* main aisles (guides) */}
      <line x1={M} y1={VH/2} x2={VW-M} y2={VH/2} stroke={T.grid} strokeDasharray="4 7"/>
      <line x1={VW/2} y1={M} x2={VW/2} y2={VH-M} stroke={T.grid} strokeDasharray="4 7"/>

      {booths.map(b=>{
        const dim = filter!=='All' && b.cat!==filter;
        return (
          <g key={b.id} opacity={dim?0.22:1}>
            {/* filled composite cells */}
            {b.cells.map((c,i)=>(
              <rect key={i} x={M+c[0]*G} y={M+c[1]*G} width={G} height={G}
                    fill={b.color} fillOpacity="0.13"/>
            ))}
            {/* walls (outline) minus the gate opening */}
            {b.edges.map((e,i)=> e===b.gate ? null : (
              <line key={i} x1={M+e.gx1*G} y1={M+e.gy1*G} x2={M+e.gx2*G} y2={M+e.gy2*G}
                    stroke={T.wall} strokeWidth="2.6"/>
            ))}
            {/* gate opening (green flow) */}
            <line x1={M+b.gate.gx1*G} y1={M+b.gate.gy1*G} x2={M+b.gate.gx2*G} y2={M+b.gate.gy2*G}
                  stroke={T.entry} strokeWidth="3" className="dash-flow"/>
            {/* id chip at centroid */}
            <rect x={b.center.x-15} y={b.center.y-8} width="30" height="15" fill={b.color}/>
            <text x={b.center.x} y={b.center.y+3} textAnchor="middle" fontSize="9" fontWeight="800" fill="#fff" className="font-mono">{b.id}</text>
            {/* counter + name label (in the aisle) */}
            <rect x={b.counter.x-2} y={b.counter.y-2} width="4" height="4" fill={b.color}/>
            <text x={b.counter.x} y={b.counter.y - (b.normal.y<0?8:-14)} textAnchor="middle"
                  fontSize="7.5" fontWeight="700" fill={T.ink} className="hair">{b.label}{b.hot?' ★':''}</text>
          </g>
        );
      })}
    </g>
  );
});

function ExpoMap({ engine, tick, filter, onHover, onSelect, selectedId, playMode, avatarRef, onBgClick }){

  return (

        <defs>
          <pattern id="bp" width="22" height="22" patternUnits="userSpaceOnUse">

                  fill={f.kind==='entry'?'#dff3e6':f.kind==='exit'?'#fde3e1':T.silver} stroke={T.line} strokeWidth="1"/>

                  fill={f.kind==='entry'?T.entry:f.kind==='exit'?T.wait:T.accent2} className="hair">{f.label}</text>
          </g>
        ))}

        {/* tracked trail */}
        {selectedId && trail.length>1 && (
          <polyline fill="none" stroke={T.mint} strokeWidth="1.6" strokeOpacity="0.7"
                    points={trail.map(p=>p.x+','+p.y).join(' ')}/>
        )}

        {/* agents */}
        <g>
          {agents.map(a=>{
            const isSel=a.id===selectedId;
            let fill=a.color;
            if(a.state==='queue')fill=T.wait; else if(a.state==='bypass')fill=T.bypass;
            else if(a.state==='enter')fill=T.entry; else if(a.state==='exit')fill=T.sub;
            return (
              <g key={a.id}>
                {isSel && <circle cx={a.x} cy={a.y} r="9" fill="none" stroke={T.mint} strokeWidth="2"/>}
                <circle cx={a.x} cy={a.y} r={isSel?4.4:(a.state==='queue'?3.6:3.1)}
                  fill={fill} stroke={isSel?T.mint:'#fff'} strokeWidth={isSel?1.4:0.7}
                  onMouseEnter={(e)=>onHover(a,e)} onMouseMove={(e)=>onHover(a,e)}
                  onMouseLeave={()=>onHover(null)}
                  onClick={(e)=>{ e.stopPropagation(); onSelect(a.id); }} style={{cursor:'pointer'}}/>

        {/* speech bubbles */}
        <g style={{pointerEvents:'none'}}>
          {agents.filter(a=>a.bubble).map(a=>{
            const w=Math.min(160, 22+a.bubble.length*6.6);

                <text x={bx+w/2} y={by+11} textAnchor="middle" fontSize="8.5" fill={T.ink}>{a.bubble}</text>

function svgPoint(e){ const svg=e.currentTarget; const r=svg.getBoundingClientRect();

/* ============================================================
   LOADING SCREEN — animated thermal camera
   ============================================================ */
function Loader(){
  const ref=useRef();
  useEffect(()=>{
    const cv=ref.current, ctx=cv.getContext('2d'); let raf;
    const NW=48,NH=32, f=new Float32Array(NW*NH);
    for(let i=0;i<f.length;i++) f[i]=Math.random()*0.4;
    const cw=cv.width/NW, ch=cv.height/NH;
    const blobs=[]; for(let k=0;k<7;k++) blobs.push({x:Math.random()*NW,y:Math.random()*NH,vx:(Math.random()-0.5)*0.5,vy:(Math.random()-0.5)*0.5});
    const loop=()=>{
      for(let i=0;i<f.length;i++) f[i]*=0.9;
      for(const b of blobs){
        b.x+=b.vx; b.y+=b.vy;
        if(b.x<0||b.x>NW)b.vx*=-1; if(b.y<0||b.y>NH)b.vy*=-1;
        const bx=Math.floor(b.x),by=Math.floor(b.y);
        for(let dy=-4;dy<=4;dy++) for(let dx=-4;dx<=4;dx++){
          const xx=bx+dx,yy=by+dy; if(xx>=0&&xx<NW&&yy>=0&&yy<NH){ f[xx+yy*NW]+=Math.max(0,0.6-Math.hypot(dx,dy)*0.13); }
        }
      }
      for(let i=0;i<f.length;i++) f[i]+=Math.random()*0.06;
      let peak=0.001; for(let i=0;i<f.length;i++) if(f[i]>peak)peak=f[i];
      ctx.save(); ctx.filter='blur(7px)';
      for(let j=0;j<NH;j++) for(let i=0;i<NW;i++){ ctx.fillStyle=thermalCss(f[i+j*NW]/peak,1); ctx.fillRect(i*cw,j*ch,cw+1.5,ch+1.5); }
      ctx.restore();
      raf=requestAnimationFrame(loop);
    };
    loop(); return ()=>cancelAnimationFrame(raf);
  },[]);
  return (
    <div id="rf-loader" className="fixed inset-0 z-[999] flex flex-col items-center justify-center g-ink">
      <canvas ref={ref} width={640} height={420} className="absolute inset-0 w-full h-full" style={{opacity:.55}}/>
      <div className="relative z-10 flex flex-col items-center gap-5">
        <LogoBig/>
        <div className="text-white/80 text-[11px] hair font-mono">THERMAL SENSOR ARRAY · CALIBRATING…</div>
        <div className="w-60 h-1 bg-white/20 overflow-hidden"><div className="h-full g-mint loader-bar"/></div>
      </div>
    </div>
  );
}

  useEffect(()=>{

    for(let i=0;i<pop;i++){
      const a=makeAgent();

      E.agents.push(a);
    }
  },[]); // eslint-disable-line

  const pushToast=useCallback((msg,tone='accent')=>{
    const id=++toastId.current;
    setToasts(t=>[...t,{id,msg,tone}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),3400);
  },[]);
  const onHover=useCallback((a,e)=>{ if(!a){setHover(null);return;} setHover({a,x:e.clientX,y:e.clientY}); },[]);
  const onSelect=useCallback((id)=>{ setSelectedId(id); },[]);
  const onBgClick=useCallback((pt)=>{ if(playRef.current) avatarRef.current.target={...pt}; },[]);
  const focusBooth=useCallback((bid)=>{
    const E=engine.current; const b=E.booths.find(x=>x.id===bid); if(!b) return;
    // track a nearby visitor heading to / near this booth
    let best=null,bd=1e9;
    for(const a of E.agents){ const d=Math.hypot(a.x-b.counter.x,a.y-b.counter.y); if(d<bd){bd=d;best=a;} }
    if(best){ best.target=bid; best.state='seek'; setSelectedId(best.id); }
    pushToast(b.label+' 부스로 포커스합니다','mint');
  },[pushToast]);

  useEffect(()=>{
    const dn=(e)=>{ const k=e.key.toLowerCase(); if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){ keys.current[k]=true; if(playRef.current) e.preventDefault(); } };
    const up=(e)=>{ keys.current[e.key.toLowerCase()]=false; };
    window.addEventListener('keydown',dn); window.addEventListener('keyup',up);
    return ()=>{ window.removeEventListener('keydown',dn); window.removeEventListener('keyup',up); };
  },[]);

  // ===== simulation loop =====
  useEffect(()=>{
    let raf,last=0,statAcc=0,thermAcc=0;
    const step=(ts)=>{
      let dt=(ts-last)/1000; last=ts; if(dt>0.05)dt=0.05;
      const sdt=dt*speedRef.current;
      const E=engine.current, booths=E.booths, agents=E.agents;
      const bp=bypassRef.current, nudgeP=nudgeRef.current/100;
      const R=12, SEP=90, DES=52;

      // per-booth service accounting
      const served={}, queued={};
      booths.forEach(b=>{ served[b.id]=0; queued[b.id]=[]; });
      for(const a of agents){
        if(a.state==='serve'&&a.target) served[a.target]++;
        else if(a.state==='queue'&&a.target) queued[a.target].push(a);
      }
      const slots={};
      booths.forEach(b=>{ slots[b.id]=b.cap-served[b.id]; queued[b.id].sort((p,q)=>p.joinOrder-q.joinOrder); });
      booths.forEach(b=>{
        let s=slots[b.id];
        for(const a of queued[b.id]){
          if(s>0){ a.state='serve'; a.dwellT=0; a.dwellMax=(b.hot?9:6)+rnd()*6;
            a.servePos={x:b.counter.x+(rnd()-0.5)*18, y:b.counter.y+(rnd()-0.5)*18}; s--; servedAccum.current++; }
          else break;
        }
        slots[b.id]=s;
      });

      // steering
      for(const a of agents){
        const b=a.target?booths.find(x=>x.id===a.target):null;
        let wx,wy, ds=DES*a.spd;

        if(a.state==='enter'){
          wx=a.roamPt.x; wy=a.roamPt.y;
          if(Math.hypot(wx-a.x,wy-a.y)<26){ a.state='wander'; a.seekTimer=0.6+rnd()*3; }
        } else if(a.state==='wander'){
          a.seekTimer-=sdt;
          if(Math.hypot(a.roamPt.x-a.x,a.roamPt.y-a.y)<24) a.roamPt=randFreePoint();
          wx=a.roamPt.x; wy=a.roamPt.y; ds*=0.7;
          if(a.seekTimer<=0){ a.state='seek'; a.target=chooseBooth(a,booths); }
        } else if(a.state==='seek' || a.state==='bypass'){
          const c=b?b.counter:{x:VW/2,y:VH/2}; wx=c.x; wy=c.y;
          if(b){
            if(a.state==='seek' && bp && b.hot && queued[b.id].length>4 && rnd()<0.012*nudgeP*3){
              const alt=booths.filter(x=>x.cat===b.cat && !x.hot);
              if(alt.length){ a.target=pick(alt).id; a.state='bypass'; }
            }
            if(Math.hypot(wx-a.x,wy-a.y)<20){
              if(slots[b.id]>0){ a.state='serve'; a.dwellT=0; a.dwellMax=(b.hot?9:6)+rnd()*6; slots[b.id]--;
                a.servePos={x:b.counter.x+(rnd()-0.5)*18,y:b.counter.y+(rnd()-0.5)*18}; servedAccum.current++; }
              else { a.state='queue'; a.joinOrder=E.order++; a.waitT=0; }
            }
          }
        } else if(a.state==='queue'){
          a.waitT+=sdt;
          const idx=b&&queued[b.id]?queued[b.id].indexOf(a):0;
          const c=b?b.counter:{x:VW/2,y:VH/2};
          const nx=(b?b.normal.x:0), ny=(b?b.normal.y:1);
          wx=c.x + nx*(10+Math.max(0,idx)*14); wy=c.y + ny*(10+Math.max(0,idx)*14);
          ds*=0.5;
          if(a.waitT>a.patience*0.35){
            if(bp){ const alt=booths.filter(x=>x.cat===(b?b.cat:'Tech')&&!x.hot); if(alt.length){ a.target=pick(alt).id; a.state='bypass'; } else { a.state='wander'; a.target=null; a.seekTimer=1+rnd()*3; } }
            else { a.state='wander'; a.target=null; a.seekTimer=1+rnd()*3; }
            a.patience=clamp(a.patience-6,10,100);
          }
        } else if(a.state==='serve'){
          a.dwellT+=sdt;
          const sp=a.servePos||(b?b.counter:{x:VW/2,y:VH/2}); wx=sp.x; wy=sp.y; ds*=0.35;
          if(a.dwellT>=a.dwellMax){ a.state='leave'; a.roamPt=randFreePoint(); a.patience=clamp(a.patience-4,8,100); }
        } else if(a.state==='leave'){
          wx=a.roamPt.x; wy=a.roamPt.y;
          if(Math.hypot(wx-a.x,wy-a.y)<26){ a.state='wander'; a.target=null; a.seekTimer=0.8+rnd()*3.5; a.roamPt=randFreePoint(); }
        } else if(a.state==='exit'){
          wx=EXPO.exitPt.x; wy=EXPO.exitPt.y; ds*=1.1;
          if(Math.hypot(wx-a.x,wy-a.y)<22) a.dead=true;
        } else { wx=a.x; wy=a.y; }

        let dx=wx-a.x, dy=wy-a.y; const dd=Math.hypot(dx,dy)||1;
        let sx=(dx/dd)*ds, sy=(dy/dd)*ds;
        if(dd<6){ sx*=dd/6; sy*=dd/6; }
        a._sx=sx; a._sy=sy;
      }

      // separation (avoid overlap)
      for(let i=0;i<agents.length;i++){
        const a=agents[i]; let px=0,py=0;
        for(let j=0;j<agents.length;j++){
          if(i===j)continue; const o=agents[j];
          const dx=a.x-o.x, dy=a.y-o.y, d2=dx*dx+dy*dy;
          if(d2<R*R && d2>0.0001){ const d=Math.sqrt(d2), f=(R-d)/R; px+=(dx/d)*f; py+=(dy/d)*f; }
        }
        if(playRef.current){ const av=avatarRef.current; const dx=a.x-av.x,dy=a.y-av.y,d2=dx*dx+dy*dy;
          if(d2<(R+6)*(R+6)&&d2>0.01){ const d=Math.sqrt(d2), f=(R+6-d)/(R+6); px+=(dx/d)*f*1.4; py+=(dy/d)*f*1.4; } }
        a._px=px*SEP; a._py=py*SEP;
      }

      // integrate + wall collision (never enter booth cells)
      const maxV=DES*1.7;
      for(const a of agents){
        let vx=a._sx+a._px, vy=a._sy+a._py;
        const mag=Math.hypot(vx,vy); if(mag>maxV){ vx=vx/mag*maxV; vy=vy/mag*maxV; }
        let nx=clamp(a.x+vx*sdt, M+3, VW-M-3), ny=clamp(a.y+vy*sdt, M+3, VH-M-3);
        let fx=nx, fy=ny;
        if(cellBlockedAt(fx,fy)){
          if(!cellBlockedAt(nx,a.y)){ fx=nx; fy=a.y; }
          else if(!cellBlockedAt(a.x,ny)){ fx=a.x; fy=ny; }
          else { fx=a.x; fy=a.y; a.stuck++; if(a.stuck>40){ a.roamPt=randFreePoint(); a.stuck=0; if(a.state==='seek'){a.state='wander';a.target=null;} } }
        } else a.stuck=0;
        a.dist+=Math.hypot(fx-a.x,fy-a.y); a.vx=vx; a.vy=vy; a.x=fx; a.y=fy;
      }
      // remove agents that reached exit
      if(agents.some(a=>a.dead)) E.agents=agents.filter(a=>!a.dead);

      // avatar
      if(playRef.current){
        const av=avatarRef.current; let ax=0,ay=0;
        if(keys.current['w']||keys.current['arrowup'])ay-=1;
        if(keys.current['s']||keys.current['arrowdown'])ay+=1;
        if(keys.current['a']||keys.current['arrowleft'])ax-=1;
        if(keys.current['d']||keys.current['arrowright'])ax+=1;
        if(ax||ay){ av.target=null; const m=Math.hypot(ax,ay); ax/=m; ay/=m; }
        else if(av.target){ const dx=av.target.x-av.x,dy=av.target.y-av.y,d=Math.hypot(dx,dy); if(d>4){ax=dx/d;ay=dy/d;}else av.target=null; }
        const AV=140*speedRef.current;
        let nx=clamp(av.x+ax*AV*dt,14,VW-14), ny=clamp(av.y+ay*AV*dt,14,VH-14);
        if(!cellBlockedAt(nx,ny)){ av.x=nx; av.y=ny; }
        else if(!cellBlockedAt(nx,av.y)) av.x=nx;
        else if(!cellBlockedAt(av.x,ny)) av.y=ny;
        for(const b of E.booths){
          if(av.stamped[b.id])continue;
          if(Math.hypot(av.x-b.counter.x,av.y-b.counter.y)<30){
            av.stamped[b.id]=true; const n=Object.keys(av.stamped).length;
            setStamps(n); pushToast(b.label+' 스탬프 획득! ('+n+'/'+E.booths.length+')','mint');
          }
        }
      }

      // ===== thermal field (randomized) =====
      thermAcc+=dt;
      const th=E.thermal;
      for(let i=0;i<th.length;i++) th[i]*=0.90;
      const cwT=VW/TW, chT=VH/TH;
      for(const a of agents){
        const ix=clamp(Math.floor(a.x/cwT),0,TW-1), iy=clamp(Math.floor(a.y/chT),0,TH-1);
        th[ix+iy*TW]+=0.09;
        const w=(a.state==='queue'||a.state==='serve')?0.06:0.02;
        if(ix>0)th[ix-1+iy*TW]+=w; if(ix<TW-1)th[ix+1+iy*TW]+=w;
        if(iy>0)th[ix+(iy-1)*TW]+=w; if(iy<TH-1)th[ix+(iy+1)*TW]+=w;
      }
      for(let i=0;i<th.length;i++){ th[i]+= (rnd()-0.35)*0.03 + 0.02*Math.sin(ts*0.002+i*0.7); if(th[i]<0)th[i]=0; if(th[i]>2.5)th[i]=2.5; }

      // speech bubbles
      bubbleAcc.current+=dt;
      if(bubbleAcc.current>0.9){
        bubbleAcc.current=0;
        agents.forEach(a=>a.bubble=null);
        for(let k=0;k<6&&agents.length;k++){ const a=agents[Math.floor(rnd()*agents.length)]; a.bubble=needText(a,booths); }
        const sel=agents.find(a=>a.id===selRef.current); if(sel) sel.bubble=needText(sel,booths);
      }

      // trail
      const sel=agents.find(a=>a.id===selRef.current);
      trailAcc.current+=dt;
      if(sel){ if(trailAcc.current>0.12){ trailAcc.current=0; E.trail.push({x:sel.x,y:sel.y}); if(E.trail.length>70)E.trail.shift(); } }
      else if(E.trail.length) E.trail=[];

      // runtime occupancy
      const s2={},q2={}; booths.forEach(b=>{s2[b.id]=0;q2[b.id]=0;});
      for(const a of agents){ if(a.state==='serve'&&a.target)s2[a.target]++; else if(a.state==='queue'&&a.target)q2[a.target]++; }
      booths.forEach(b=>{ E.rt[b.id]={served:s2[b.id],queue:q2[b.id]}; });

      // ===== stats + population reconcile (entrance flow) =====
      statAcc+=dt;
      if(statAcc>0.5){
        const win=statAcc; statAcc=0;

        // reconcile population toward slider via entrance/exit
        const activeArr=E.agents.filter(a=>a.state!=='exit');
        const active=activeArr.length;
        const target=popRef.current;
        if(active<target){
          const add=Math.min(3, target-active);
          for(let i=0;i<add;i++) E.agents.push(makeAgent());
        } else if(active>target){
          let remove=Math.min(3, active-target);
          for(const a of activeArr){
            if(remove<=0)break;
            if(a.state==='wander'||a.state==='leave'||a.state==='seek'){ a.state='exit'; a.target=null; if(a.id===selRef.current)setSelectedId(null); remove--; }
          }
        }

        // thermal-derived congestion
        let peak=0.001,sum=0; for(let i=0;i<th.length;i++){ if(th[i]>peak)peak=th[i]; sum+=th[i]; }
        let hotCells=0; const hthr=0.6*peak;
        for(let i=0;i<th.length;i++) if(th[i]>hthr) hotCells++;
        const hotFrac=hotCells/th.length;
        const cong=clamp(18 + hotFrac*140 + (Math.sin(ts/4000)*2) - (bp?7:0), 6, 97);
        const hotspots=Math.round(hotCells/4);

        let L=0,servedTot=0; booths.forEach(b=>{ L+=q2[b.id]; servedTot+=s2[b.id]; });
        const total=E.agents.length;
        const lambda=clamp((bp?total/26*(1-0.28*nudgeP):total/26),1,30);
        const W=lambda>0?L/lambda:0;
        const throughput=servedAccum.current/win*60/ (total||1) * (total?1:1);
        const tp=servedAccum.current/win*60; servedAccum.current=0;
        const convert=total?clamp(servedTot/total*100,0,100):0;

        // category / companion breakdown (interest = serve+queue by cat, comp counts)
        const byCat={Tech:0,['F&B']:0,Culture:0,Trend:0}, byComp={solo:0,couple:0,family:0};
        for(const a of E.agents){
          byComp[a.comp]=(byComp[a.comp]||0)+1;
          if(a.target && (a.state==='serve'||a.state==='queue'||a.state==='seek')){
            const b=booths.find(x=>x.id===a.target); if(b) byCat[b.cat]=(byCat[b.cat]||0)+1;
          }
        }
        const top=[...booths].map(b=>({id:b.id,label:b.label,cat:b.cat,served:s2[b.id],queue:q2[b.id]}))
          .sort((p,q)=>(q.served+q.queue)-(p.served+p.queue)).slice(0,6);

        setStats({ total,cong,L,W,lambda,hotspots,throughput:tp,convert,byCat,byComp,top });

        E.hist.cong.push(cong); if(E.hist.cong.length>60)E.hist.cong.shift();
        E.hist.L.push(L); if(E.hist.L.length>60)E.hist.L.shift();

        if(bp){ roiRef.current.savedMin+=(0.15+rnd()*0.4)*nudgeP; roiRef.current.revenue+=Math.floor((1+rnd()*2)*nudgeRef.current*1.2); }
      }

      setTick(t=>(t+1)%1000000);
      raf=requestAnimationFrame(step);
    };
    raf=requestAnimationFrame(step);
    return ()=>cancelAnimationFrame(raf);
  },[]); // eslint-disable-line

  const selAgent=engine.current.agents.find(a=>a.id===selectedId)||null;
  const viewTabs=[{id:1,ko:'관제'},{id:2,ko:'가이드'},{id:3,ko:'B2B'},{id:4,ko:'분석'},{id:5,ko:'데이터'}];

  return (
    <div className="min-h-screen bg-bp-bg text-bp-ink blueprint-grid">
      {booting && <Loader/>}
      <header className="g-header border-b-2 border-bp-accent2 px-4 py-2.5 flex items-center justify-between sticky top-0 z-40 no-sh">
        <Logo/>
        <div className="flex items-center gap-3">
          <span className={"text-[10px] font-mono font-bold px-2 py-1 border "+(bypass?'text-bp-bypass border-bp-bypass':'text-bp-sub border-bp-line')}>BYPASS {bypass?'ON':'OFF'}</span>
          {thermalOn && <span className="text-[10px] font-mono font-bold px-2 py-1 border text-bp-wait border-bp-wait">THERMAL</span>}
          {playMode && <span className="text-[10px] font-mono font-bold px-2 py-1 border text-bp-mint border-bp-mint">PLAY</span>}
        </div>
      </header>

      <div className="flex flex-col lg:flex-row gap-3 p-3 max-w-[1680px] mx-auto">
        <div className="lg:w-[62%] shrink-0">
          <div className="g-panel border border-bp-line no-sh">
            <div className="flex items-center justify-between px-3 py-2 border-b border-bp-line flex-wrap gap-2">
              <span className="text-[11px] hair font-bold uppercase">Grand Convention · 단일 전시장 지도</span>
              <span className="text-[10px] font-mono text-bp-sub">{engine.current.booths.length} BOOTHS</span>
            </div>
            <div className="px-3 py-2 border-b border-bp-line flex items-center justify-between flex-wrap gap-2">
              <span className="text-[11px] font-bold text-bp-accent2">2026 GLOBAL INNOVATION EXPO · 통합 컨벤션 센터</span>
              <div className="flex items-center gap-3 flex-wrap">
                <label className="flex items-center gap-1.5 text-[10px] hair text-bp-sub">속도
                  <input type="range" min="0.25" max="3" step="0.25" value={speed} onChange={e=>setSpeed(parseFloat(e.target.value))} className="w-20"/>
                  <span className="font-mono font-bold text-bp-ink w-8">{speed}x</span></label>
                <label className="flex items-center gap-1.5 text-[10px] hair text-bp-sub">인원
                  <input type="range" min="30" max="160" step="5" value={pop} onChange={e=>setPop(parseInt(e.target.value))} className="w-24"/>
                  <span className="font-mono font-bold text-bp-ink w-8">{pop}</span></label>
                <Btn tone="mint" active={thermalOn} onClick={()=>setThermalOn(!thermalOn)}>열화상</Btn>
              </div>
            </div>
            <div className="px-3 pt-2 flex items-center gap-1 flex-wrap">
              <span className="text-[10px] hair text-bp-sub mr-1">필터</span>
              {['All','Tech','F&B','Culture','Trend'].map(c=><Btn key={c} active={filter===c} onClick={()=>setFilter(c)}>{c}</Btn>)}
            </div>
            <div className="aspect-[988/700] w-full p-2">
              <ExpoMap engine={engine.current} tick={tick} filter={filter} onHover={onHover}
                       onSelect={onSelect} selectedId={selectedId} playMode={playMode}
                       avatarRef={avatarRef} onBgClick={onBgClick}/>
            </div>
            <div className="px-3 py-2 border-t border-bp-line flex flex-wrap gap-x-4 gap-y-1 text-[10px] text-bp-sub">
              <Legend c={T.solo} t="혼자"/><Legend c={T.couple} t="연인"/><Legend c={T.family} t="가족"/>
              <Legend c={T.entry} t="입장"/><Legend c={T.wait} t="대기줄"/><Legend c={T.bypass} t="우회"/><Legend c={T.mint} t="추적/내 위치"/>
              <span className="text-bp-line">도트 클릭 = 개인 추적 · 인원 슬라이더 = 입구 입·퇴장 흐름</span>
            </div>
          </div>
        </div>

        <div className="flex-1 min-w-0">
          <TrackPanel agent={selAgent} booths={engine.current.booths} onClear={()=>setSelectedId(null)}/>
          <div className="grid grid-cols-5 gap-1 mb-3">
            {viewTabs.map(t=><Btn key={t.id} active={view===t.id} onClick={()=>setView(t.id)} className="py-2">{t.ko}</Btn>)}
          </div>
          <div className="g-panel border border-bp-line p-3 no-sh">
            {view===1 && <View1 stats={stats} booths={engine.current.booths} engine={engine.current}/>}
            {view===2 && <View2 pushToast={pushToast} bypass={bypass} playMode={playMode} setPlayMode={setPlayMode}
                                stamps={stamps} boothCount={engine.current.booths.length} focusBooth={focusBooth}/>}
            {view===3 && <View3 bypass={bypass} setBypass={setBypass} nudge={nudge} setNudge={setNudge}
                                stats={stats} roi={roiRef.current} predictive={predictive} setPredictive={setPredictive}/>}
            {view===4 && <View4 stats={stats} booths={engine.current.booths} engine={engine.current}/>}
            {view===5 && <View5 pushToast={pushToast} salesRef={salesRef}/>}
          </div>
        </div>
      </div>

      <Tooltip data={hover} booths={engine.current.booths}/>

      <div className="fixed bottom-4 right-4 z-50 space-y-2 w-72">
        {toasts.map(t=>(
          <div key={t.id} className={"toast-in border-l-4 g-ink text-white text-[11px] px-3 py-2 no-sh "
            +(t.tone==='mint'?'border-bp-mint':t.tone==='wait'?'border-bp-wait':'border-bp-accent')}>{t.msg}</div>
        ))}
      </div>

      <footer className="text-center text-[9px] text-bp-line py-4 hair">
        ROUTEFINDER · MADE BY DIJKSTRA · SINGLE GRAND CONVENTION · 35 COMPOSITE BOOTHS · WALL COLLISION · THERMAL CONGESTION · ENTRANCE FLOW
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

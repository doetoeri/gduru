const HALLS = makeHalls();

// gate world coordinate for a booth
function gatePoint(b) {
  const g = b.gate;
  if (g.side==='top')    return { x:b.x+b.w/2, y:b.y };
  if (g.side==='bottom') return { x:b.x+b.w/2, y:b.y+b.h };
  if (g.side==='left')   return { x:b.x,       y:b.y+b.h/2 };
  return { x:b.x+b.w,    y:b.y+b.h/2 }; // right
}
function boothCenter(b){ return { x:b.x+b.w/2, y:b.y+b.h/2 }; }

// axis-aligned wall segments for a booth, EXCLUDING the gate opening
function boothWalls(b) {
  const g = b.gate.side, open = 34;
  const segs = [];
  const cx=b.x+b.w/2, cy=b.y+b.h/2;
  // top
  if (g==='top') { segs.push([b.x,b.y,cx-open/2,b.y]); segs.push([cx+open/2,b.y,b.x+b.w,b.y]); }
  else segs.push([b.x,b.y,b.x+b.w,b.y]);
  // bottom
  if (g==='bottom'){ segs.push([b.x,b.y+b.h,cx-open/2,b.y+b.h]); segs.push([cx+open/2,b.y+b.h,b.x+b.w,b.y+b.h]); }
  else segs.push([b.x,b.y+b.h,b.x+b.w,b.y+b.h]);
  // left
  if (g==='left'){ segs.push([b.x,b.y,b.x,cy-open/2]); segs.push([b.x,cy+open/2,b.x,b.y+b.h]); }
  else segs.push([b.x,b.y,b.x,b.y+b.h]);
  // right
  if (g==='right'){ segs.push([b.x+b.w,b.y,b.x+b.w,cy-open/2]); segs.push([b.x+b.w,cy+open/2,b.x+b.w,b.y+b.h]); }
  else segs.push([b.x+b.w,b.y,b.x+b.w,b.y+b.h]);
  return segs;
}

// segment intersection test (for wall-avoidance)
function segHit(ax,ay,bx,by, cx,cy,dx,dy){
  const d=(bx-ax)*(dy-cy)-(by-ay)*(dx-cx);
  if (Math.abs(d)<1e-9) return false;
  const t=((cx-ax)*(dy-cy)-(cy-ay)*(dx-cx))/d;
  const u=((cx-ax)*(by-ay)-(cy-ay)*(bx-ax))/d;
  return t>=0&&t<=1&&u>=0&&u<=1;
}

/* ============================================================
   AGENT MODEL — 150 visitors
   ============================================================ */
const COMPANIONS = [
  { key:'solo',   ko:'혼자',  color:TOKENS.solo },
  { key:'couple', ko:'연인',  color:TOKENS.couple },
  { key:'family', ko:'가족',  color:TOKENS.family },
];
const PREFS = ['테크','트렌디','F&B','문화예술'];

function seededRand(seed){ let s=seed%2147483647; if(s<=0)s+=2147483646;
  return ()=>{ s=(s*16807)%2147483647; return (s-1)/2147483646; }; }

function spawnAgents(hallId){
  const hall = HALLS[hallId];
  const rnd = seededRand(hallId*7919 + 13);
  const agents = [];
  const hotspot = hall.booths.find(b=>b.hotspot);
  for(let i=0;i<150;i++){
    const comp = COMPANIONS[Math.floor(rnd()*3)];
    // seed positions in corridors (avoid inside booths roughly)
    let x = 40 + rnd()*(VW-80);
    let y = 40 + rnd()*(VH-80);
    const goHot = rnd() < 0.42;
    agents.push({
      id:'V'+String(1000+i),
      x, y, vx:0, vy:0,
      comp:comp.key, color:comp.color,
      pref: PREFS[Math.floor(rnd()*4)],
      patience: Math.floor(40+rnd()*60),
      state: goHot ? 'toHot':'roam',
      target: goHot ? hotspot.id : hall.booths[Math.floor(rnd()*hall.booths.length)].id,
      wait: 0, phase: 'toGate',
      accuracy: (rnd()*2.2+0.6), // indoor positioning error metric (m)
      speed: 0.9 + rnd()*0.7,
    });
  }
  return agents;
}

/* ============================================================
   MAIN SIMULATION MAP (left, fixed)
   ============================================================ */

  const agents = agentsRef.current;

        <pattern id="bp" width="22" height="22" patternUnits="userSpaceOnUse">

        </pattern>
      </defs>
      <rect x="0" y="0" width={VW} height={VH} fill="url(#bp)"/>
      <rect x="12" y="12" width={VW-24} height={VH-24} fill="none" stroke={TOKENS.line} strokeWidth="2"/>

      {/* atrium (non-enterable) */}
      {hall.atrium && (
        <g>
          <rect x={hall.atrium.x} y={hall.atrium.y} width={hall.atrium.w} height={hall.atrium.h}
                fill="#e4e9f1" stroke={TOKENS.line} strokeWidth="2" strokeDasharray="2 3"/>
          <line x1={hall.atrium.x} y1={hall.atrium.y} x2={hall.atrium.x+hall.atrium.w} y2={hall.atrium.y+hall.atrium.h} stroke={TOKENS.grid}/>
          <line x1={hall.atrium.x+hall.atrium.w} y1={hall.atrium.y} x2={hall.atrium.x} y2={hall.atrium.y+hall.atrium.h} stroke={TOKENS.grid}/>
          <text x={hall.atrium.x+hall.atrium.w/2} y={hall.atrium.y+hall.atrium.h/2-6} textAnchor="middle"
                fontSize="11" fontWeight="700" fill={TOKENS.sub} className="hair">CENTRAL ATRIUM</text>
          <text x={hall.atrium.x+hall.atrium.w/2} y={hall.atrium.y+hall.atrium.h/2+12} textAnchor="middle"
                fontSize="9" fill={TOKENS.line}>NO ENTRY · 진입 불가</text>
        </g>
      )}

      {/* booths */}
      {hall.booths.map(b=>{
        const g = gatePoint(b);
        return (
          <g key={b.id}>
            <rect x={b.x} y={b.y} width={b.w} height={b.h}
                  fill={b.hotspot ? 'rgba(224,69,59,0.06)' : (b.sink?'rgba(47,174,90,0.07)':'#ffffff')}
                  stroke="none"/>
            {boothWalls(b).map((s,i)=>(
              <line key={i} x1={s[0]} y1={s[1]} x2={s[2]} y2={s[3]} stroke={TOKENS.wall} strokeWidth="3"/>
            ))}
            {/* gate opening marker (green dashed ENTRY) */}
            <g>
              {b.gate.side==='top' || b.gate.side==='bottom'
                ? <line x1={g.x-17} y1={g.y} x2={g.x+17} y2={g.y} stroke={TOKENS.entry} strokeWidth="2.5" className="dash-flow"/>
                : <line x1={g.x} y1={g.y-17} x2={g.x} y2={g.y+17} stroke={TOKENS.entry} strokeWidth="2.5" className="dash-flow"/>}
              <text x={g.x + (b.gate.side==='left'?-6:b.gate.side==='right'?6:0)}
                    y={g.y + (b.gate.side==='top'?-6:b.gate.side==='bottom'?14:-6)}
                    textAnchor={b.gate.side==='left'?'end':b.gate.side==='right'?'start':'middle'}
                    fontSize="8" fontWeight="700" fill={TOKENS.entry} className="hair">ENTRY</text>
            </g>
            <text x={b.x+b.w/2} y={b.y+b.h/2-4} textAnchor="middle" fontSize="12" fontWeight="800" fill={TOKENS.ink} className="hair">{b.label}</text>
            <text x={b.x+b.w/2} y={b.y+b.h/2+12} textAnchor="middle" fontSize="9" fill={TOKENS.sub}>{b.sub}</text>
            {b.hotspot && (
              <text x={b.x+b.w/2} y={b.y+b.h/2+27} textAnchor="middle" fontSize="8" fontWeight="700"
                    fill={bypass?TOKENS.bypass:TOKENS.wait} className="hair">
                {bypass ? 'BYPASS ACTIVE' : 'HOTSPOT · 대기 유발'}
              </text>
            )}
          </g>
        );
      })}

      {/* facilities */}
      {hall.facilities.map((f,i)=>(
        <g key={i}>
          <rect x={f.x-16} y={f.y-11} width="32" height="22" fill={TOKENS.silver} stroke={TOKENS.line} strokeWidth="1.5"/>
          <text x={f.x} y={f.y+3} textAnchor="middle" fontSize="8" fontWeight="800" fill={TOKENS.accent2} className="hair">{f.label}</text>
        </g>
      ))}

      {/* ===== AGENT LAYER (last layer) ===== */}
      <g>
        {agents.map(a=>{
          let fill = a.color;
          if (a.state==='queue') fill = TOKENS.wait;
          else if (a.state==='bypass') fill = TOKENS.bypass;
          return (
            <circle key={a.id} cx={a.x} cy={a.y} r={a.state==='queue'||a.state==='bypass'?3.4:3}
              fill={fill} stroke="#ffffff" strokeWidth="0.7"
              onMouseEnter={(e)=>onHover(a,e)} onMouseMove={(e)=>onHover(a,e)}
              onMouseLeave={()=>onHover(null)} style={{cursor:'pointer'}}/>
          );
        })}
      </g>

      {/* user location mint pulse */}
      {userPulse && userPulse.hall===hallId && (
        <g transform={`translate(${userPulse.x},${userPulse.y})`}>
          <circle r="10" fill="none" stroke={TOKENS.mint} strokeWidth="2" className="pulse-ring"/>
          <circle r="6" fill={TOKENS.mint} stroke="#fff" strokeWidth="1.5"/>
          <circle r="2.4" fill="#04352c"/>
        </g>
      )}
    </svg>
  );
}

/* ============================================================
   TOOLTIP
   ============================================================ */
function AgentTooltip({ data }) {
  if(!data) return null;
  const { a, x, y } = data;
  const comp = COMPANIONS.find(c=>c.key===a.comp);
  const stateKo = a.state==='queue'?'혼잡 대기(RED)':a.state==='bypass'?'우회 수락(BLUE)':a.state==='inside'?'부스 관람':'이동 중';
  return (
    <div className="fixed z-50 pointer-events-none" style={{ left:x+14, top:y+14 }}>
      <div className="bg-bp-ink text-white text-[11px] w-56 border border-bp-accent shadow-xl">
        <div className="px-3 py-1.5 bg-bp-accent2 flex items-center justify-between">
          <span className="font-mono font-bold">{a.id}</span>
          <span className="hair" style={{color:comp.color}}>● {comp.ko}</span>
        </div>
        <div className="px-3 py-2 space-y-1">
          <Row k="관람 선호" v={a.pref}/>
          <Row k="인내심" v={`${a.patience} / 100`}/>
          <Row k="현재 상태" v={stateKo}/>
          <div className="mt-2 pt-2 border-t border-bp-line/40">
            <div className="text-bp-mint hair text-[9px] mb-1">실내 측위 · 센서 퓨전 보정</div>
            <Row k="측위 오차" v={`± ${a.accuracy.toFixed(2)} m`}/>
            <Row k="퓨전 신뢰도" v={`${Math.max(72,100-Math.round(a.accuracy*9))} %`}/>
            <Row k="RSSI/IMU" v="SYNCED"/>
          </div>
        </div>
      </div>
    </div>
  );
}
function Row({k,v}){ return (
  <div className="flex justify-between"><span className="text-bp-line">{k}</span><span className="font-mono">{v}</span></div>
);}

/* ============================================================
   SHARED KPI TILE
   ============================================================ */
function Tile({ label, value, unit, tone='ink', hint }) {
  const c = { ink:'text-bp-ink', accent:'text-bp-accent2', wait:'text-bp-wait', mint:'text-bp-mint', bypass:'text-bp-bypass' }[tone];
  return (
    <div className="bg-bp-panel border border-bp-line p-3">
      <div className="text-[10px] text-bp-sub hair uppercase">{label}</div>
      <div className={`text-2xl font-bold font-mono ${c} kpi-pop`} key={value}>{value}<span className="text-sm ml-0.5">{unit}</span></div>
      {hint && <div className="text-[9px] text-bp-line mt-0.5">{hint}</div>}
    </div>
  );
}

function Bar({ pct, tone='accent', h='h-2' }) {
  const c = { accent:'bg-bp-accent', wait:'bg-bp-wait', mint:'bg-bp-mint', bypass:'bg-bp-bypass', silver:'bg-bp-line' }[tone];
  return (
    <div className={`w-full ${h} bg-bp-silver border border-bp-line`}>
      <div className={`${c} h-full transition-all duration-500`} style={{ width:`${Math.max(0,Math.min(100,pct))}%` }}/>
    </div>
  );
}

/* ============================================================
   ROOT APP + SIMULATION LOOP
   ============================================================ */
function App() {
  const [hallId, setHallId] = useState(1);
  const [view, setView] = useState(1);
  const [bypass, setBypass] = useState(false);
  const [nudge, setNudge] = useState(65);
  const [predictive, setPredictive] = useState(false);
  const [hover, setHover] = useState(null);
  const [userPulse, setUserPulse] = useState(null);
  const [toasts, setToasts] = useState([]);
  const [tick, setTick] = useState(0);
  const [stats, setStats] = useState({ total:150, L:0, lambda:0, W:0, relief:0 });
  const [edge, setEdge] = useState(46);

  const agentsRef = useRef(spawnAgents(1));
  const roiRef = useRef({ savedMin:0, revenue:0 });
  const salesRef = useRef({ month: 4820000 });
  const bypassRef = useRef(bypass);
  const nudgeRef = useRef(nudge);
  const hallRef = useRef(hallId);
  const rngRef = useRef(seededRand(999));
  const toastId = useRef(0);

  useEffect(()=>{ bypassRef.current = bypass; }, [bypass]);
  useEffect(()=>{ nudgeRef.current = nudge; }, [nudge]);
  useEffect(()=>{ hallRef.current = hallId; agentsRef.current = spawnAgents(hallId); }, [hallId]);

  const pushToast = useCallback((msg, tone='accent')=>{
    const id = ++toastId.current;
    setToasts(t=>[...t, { id, msg, tone }]);
    setTimeout(()=> setToasts(t=>t.filter(x=>x.id!==id)), 3600);
  }, []);

  const onHover = useCallback((a, e)=>{
    if(!a){ setHover(null); return; }
    setHover({ a, x:e.clientX, y:e.clientY });
  }, []);

  // ===== physics + queue loop =====
  useEffect(()=>{
    let raf, last=0, statAcc=0;
    const step = (ts)=>{
      const dt = Math.min(40, ts-last || 16); last=ts;
      const hall = HALLS[hallRef.current];
      const agents = agentsRef.current;
      const rnd = rngRef.current;
      const hot = hall.booths.find(b=>b.hotspot);
      const alt = hall.booths.filter(b=>!b.hotspot && !b.sink);
      const bp = bypassRef.current;
      const nudgeP = nudgeRef.current/100;

      let queueCount=0, insideCount=0, bypassCount=0;

      for(const a of agents){
        const b = hall.booths.find(x=>x.id===a.target) || hall.booths[0];
        const gate = gatePoint(b);
        const center = boothCenter(b);

        // determine current waypoint
        let wx, wy;
        if (a.phase==='toGate') { wx=gate.x; wy=gate.y; }
        else if (a.phase==='inside') { wx=center.x; wy=center.y; }
        else { wx=gate.x; wy=gate.y; }

        // hotspot queueing: form a red queue near the gate
        const isHot = b.hotspot;
        if (isHot && a.phase==='toGate') {
          // bypass diversion decision
          if (bp && a.state!=='bypass') {
            if (rnd() < 0.02 * nudgeP * 3) {
              // accept nudge → reroute to symmetric marketing booth
              const nb = alt[Math.floor(rnd()*alt.length)];
              a.target = nb.id; a.state='bypass'; a.phase='toGate';
              continue;
            }
          }
        }

        const dx=wx-a.x, dy=wy-a.y;
        const dist=Math.hypot(dx,dy)||1;

        // arrival logic
        if (dist < 8) {
          if (a.phase==='toGate') {
            if (isHot && !bp) {
              // stuck in queue near gate
              a.state='queue';
              a.wait += dt/1000;
              // jitter within queue band outside the gate
              a.x = gate.x + (rnd()-0.5)*46;
              a.y = gate.y + (b.gate.side==='bottom'? 20+rnd()*40 : b.gate.side==='top'? -(20+rnd()*40) : (rnd()-0.5)*46);
              queueCount++;
              continue;
            } else {
              a.phase='inside';
            }
          } else if (a.phase==='inside') {
            insideCount++;
            a.wait += dt/2000;
            // dwell then leave to a new target (sink booths retain longer)
            const leaveP = b.sink ? 0.004 : 0.02;
            if (rnd() < leaveP) {
              a.phase='toGate'; a.state = 'roam';
              const pool = hall.booths;
              const goHot = !bp && rnd() < 0.4;
              a.target = goHot ? hot.id : pool[Math.floor(rnd()*pool.length)].id;
            }
            // gentle drift inside
            a.x += (center.x - a.x)*0.02 + (rnd()-0.5)*0.6;
            a.y += (center.y - a.y)*0.02 + (rnd()-0.5)*0.6;
            continue;
          }
        }

        // steering toward waypoint with wall avoidance
        let sx=dx/dist, sy=dy/dist;
        // avoid crossing any booth wall (except the one we're heading into via its gate)
        const nextX=a.x+sx*a.speed*2.2, nextY=a.y+sy*a.speed*2.2;
        let blocked=false;
        for(const ob of hall.booths){
          if (ob.id===b.id && a.phase!=='inside') continue; // allow approach to own gate
          for(const s of boothWalls(ob)){
            if (segHit(a.x,a.y,nextX,nextY, s[0],s[1],s[2],s[3])) { blocked=true; break; }
          }
          if (blocked) break;
        }
        if (blocked) {
          // deflect perpendicular
          const px=-sy, py=sx;
          sx=(sx+px)*0.5; sy=(sy+py)*0.5;
          const m=Math.hypot(sx,sy)||1; sx/=m; sy/=m;
        }
        a.state = a.state==='bypass'?'bypass':'roam';
        if (a.state==='bypass') bypassCount++;
        a.x += sx*a.speed*(dt/16)*2.0 + (rnd()-0.5)*0.5;
        a.y += sy*a.speed*(dt/16)*2.0 + (rnd()-0.5)*0.5;

        // keep in bounds
        a.x=Math.max(20,Math.min(VW-20,a.x));
        a.y=Math.max(20,Math.min(VH-20,a.y));
      }

      // ===== Little's Law statistics =====
      statAcc += dt;
      if (statAcc > 120) {
        statAcc = 0;
        // L = queue length; lambda scales down with bypass & nudge
        const baseLambda = 8.4;
        const lambda = bp ? baseLambda*(1 - 0.5*(nudgeRef.current/100)) : baseLambda;
        const L = queueCount;
        const W = lambda>0 ? L/lambda : 0;
        const relief = bp ? Math.min(100, 20 + nudgeRef.current*0.6) : 0;
        setStats({ total:agents.length, L, lambda, W, relief });

        // ROI accumulation (per tick, randomized)
        if (bp) {
          roiRef.current.savedMin += (0.4 + rnd()*1.2) * (nudgeRef.current/100) * 4;
          roiRef.current.revenue  += Math.floor((1 + rnd()*3) * nudgeRef.current * 12);
        }
        // organic monthly data sales drift
        salesRef.current.month += Math.floor(rnd()*2)*1500;

        // edge traffic bar
        const target = bp ? 34 + rnd()*10 : 80 + rnd()*16;
        setEdge(e=> e + (target-e)*0.15);

        setTick(t=>t+1);
      } else {
        setTick(t=>(t+1)); // drive re-render for agents
      }
      raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return ()=> cancelAnimationFrame(raf);
  }, []);

  const halls = [1,2,3,4];
  const viewTabs = [
    { id:1, ko:'혼잡도 대시보드' },
    { id:2, ko:'B2C 가이드 앱' },
    { id:3, ko:'B2B 관제판' },
    { id:4, ko:'데이터 마켓' },
  ];

  return (
    <div className="min-h-screen bg-bp-bg text-bp-ink blueprint-grid">
      {/* header */}
      <header className="bg-bp-panel border-b-2 border-bp-accent2 px-4 py-2.5 flex items-center justify-between sticky top-0 z-40">
        <div className="flex items-center gap-3">
          <Logo size={34}/>
          <div>
            <div className="text-lg font-bold hair leading-none">ROUTEFINDER</div>
            <div className="text-[9px] hair text-bp-sub uppercase">Expo Crowd Intelligence · Silver Blueprint Edition</div>
          </div>
        </div>
        <div className="flex items-center gap-3">
          <span className={`text-[10px] font-mono font-bold px-2 py-1 border ${bypass?'text-bp-bypass border-bp-bypass':'text-bp-wait border-bp-wait'}`}>
            BYPASS {bypass?'ON':'OFF'}
          </span>
          <span className="text-[10px] font-mono text-bp-sub hidden md:block">2026 · MICE TECH SaaS</span>
        </div>
      </header>

      <div className="flex flex-col lg:flex-row gap-3 p-3 max-w-[1500px] mx-auto">
        {/* ===== LEFT: fixed congestion map ===== */}
        <div className="lg:w-[58%] shrink-0">
          <div className="bg-bp-panel border border-bp-line">
            <div className="flex items-center justify-between px-3 py-2 border-b border-bp-line">
              <span className="text-[11px] hair font-bold uppercase">실시간 전시관 혼잡도 지도</span>
              <div className="flex gap-1">
                {halls.map(h=>(
                  <Btn key={h} active={hallId===h} onClick={()=>{ setHallId(h); }}>
                    {HALLS[h].code} · {h}관
                  </Btn>
                ))}
              </div>
            </div>
            <div className="px-3 py-2 border-b border-bp-line text-[11px] font-bold text-bp-accent2">{HALLS[hallId].name}</div>
            <div className="aspect-[760/560] w-full">
              <CongestionMap hallId={hallId} agentsRef={agentsRef} tick={tick}
                             onHover={onHover} userPulse={userPulse} bypass={bypass}/>
            </div>
            <div className="px-3 py-2 border-t border-bp-line flex flex-wrap gap-x-4 gap-y-1 text-[10px] text-bp-sub">
              <Legend c={TOKENS.solo} t="혼자"/><Legend c={TOKENS.couple} t="연인"/>
              <Legend c={TOKENS.family} t="가족"/><Legend c={TOKENS.wait} t="대기"/>
              <Legend c={TOKENS.bypass} t="우회"/><Legend c={TOKENS.mint} t="내 위치"/>
            </div>
          </div>
        </div>

        {/* ===== RIGHT: switchable views ===== */}
        <div className="flex-1 min-w-0">
          <div className="grid grid-cols-4 gap-1 mb-3">
            {viewTabs.map(t=>(
              <Btn key={t.id} active={view===t.id} onClick={()=>setView(t.id)} className="py-2">{t.ko}</Btn>
            ))}
          </div>
          <div className="bg-bp-panel border border-bp-line p-3">
            {view===1 && <View1Dashboard stats={stats} bypass={bypass} nudge={nudge} edge={edge}/>}
            {view===2 && <View2Guide setHallId={setHallId} setUserPulse={setUserPulse} pushToast={pushToast} bypass={bypass}/>}
            {view===3 && <View3Control bypass={bypass} setBypass={setBypass} nudge={nudge} setNudge={setNudge}
                                       stats={stats} roi={roiRef.current} predictive={predictive} setPredictive={setPredictive}/>}
            {view===4 && <View4Market pushToast={pushToast} salesRef={salesRef} tick={tick}/>}
          </div>
        </div>
      </div>

      <AgentTooltip data={hover}/>

      {/* toast stack */}
      <div className="fixed bottom-4 right-4 z-50 space-y-2 w-72">
        {toasts.map(t=>(
          <div key={t.id} className={`toast-in border-l-4 bg-bp-ink text-white text-[11px] px-3 py-2 shadow-xl
            ${t.tone==='mint'?'border-bp-mint':t.tone==='wait'?'border-bp-wait':'border-bp-accent'}`}>
            {t.msg}
          </div>
        ))}
      </div>

      <footer className="text-center text-[9px] text-bp-line py-4 hair">
        ROUTEFINDER · SINGLE-FILE BUILD · LITTLE&apos;S LAW ENGINE · FIGMA-BOUND SILVER BLUEPRINT THEME
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<script>
  /* Inline JSX compilation (classic runtime → React.createElement, no ESM imports) */
  (function () {
    var src = document.getElementById('app-src').textContent;
    try {
      var out = Babel.transform(src, {
        presets: [['react', { runtime: 'classic' }]],
        filename: 'routefinder.jsx'
      }).code;
      var s = document.createElement('script');
      s.textContent = out;
      document.body.appendChild(s);
    } catch (err) {
      document.getElementById('root').innerHTML =
        '<pre style="padding:16px;color:#e0453b;font-family:monospace">Build error: ' +
        String(err && err.message ? err.message : err) + '</pre>';
    }
  })();
</script>

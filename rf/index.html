<script type="text/plain" id="app-src">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ============================================================
   DESIGN TOKENS
   ============================================================ */
const T = {
  bg:'#eef1f5', panel:'#f7f9fc', silver:'#dfe4ec', grid:'#c8d2df',
  ink:'#1f2733', sub:'#5b6675', line:'#9aa7b8', wall:'#3a4657',
  accent:'#2f6fb0', accent2:'#1b4e82', mint:'#12d3b0', entry:'#2fae5a',
  solo:'#2fae5a', couple:'#8a4fd6', family:'#e08a2b',
  wait:'#e0453b', bypass:'#2f7fd6',
  tech:'#2f6fb0', fnb:'#e08a2b', culture:'#8a4fd6', trend:'#2f9e8f'
};
const CAT_COLOR = { Tech:T.tech, 'F&B':T.fnb, Culture:T.culture, Trend:T.trend };
const CAT_KO = { Tech:'테크', 'F&B':'푸드', Culture:'문화예술', Trend:'트렌드' };
const CATS = ['Tech','F&B','Culture','Trend'];

function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function rnd(){ return Math.random(); }
function pick(a){ return a[Math.floor(rnd()*a.length)]; }
function seededRand(seed){ let s=seed%2147483647; if(s<=0)s+=2147483646;
  return ()=>{ s=(s*16807)%2147483647; return (s-1)/2147483646; }; }

/* ============================================================
   THERMAL-CAMERA COLOR MAP (iron palette)
   ============================================================ */
const THERMAL_STOPS = [
  [0.00,[9,10,38]],[0.18,[42,14,96]],[0.36,[122,20,140]],
  [0.54,[214,42,74]],[0.70,[246,116,20]],[0.86,[255,203,26]],[1.00,[255,255,238]]
];
function thermalRGB(v){
  v=clamp(v,0,1);
  for(let i=1;i<THERMAL_STOPS.length;i++){
    if(v<=THERMAL_STOPS[i][0]){
      const a=THERMAL_STOPS[i-1], b=THERMAL_STOPS[i];
      const t=(v-a[0])/((b[0]-a[0])||1);
      return [0,1,2].map(k=>Math.round(a[1][k]+(b[1][k]-a[1][k])*t));
    }
  }
  return THERMAL_STOPS[THERMAL_STOPS.length-1][1];
}
function thermalCss(v,al){ const c=thermalRGB(v); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+(al==null?1:al)+')'; }

/* ============================================================
   LOGO
   ============================================================ */
function RouteMark({ s=40 }){

        <path d="M17 25 L31 25" stroke={T.line} strokeWidth="1.6" strokeDasharray="2 2"/>
        <rect x="19.5" y="20.5" width="9" height="9" fill={T.mint} stroke={T.ink} strokeWidth="1.6"/>
        <circle cx="24" cy="25" r="1.7" fill={T.ink}/>

}
function Logo(){

      <RouteMark s={40}/>
      <div className="leading-none">

        <div className="text-[8px] hair text-bp-sub mt-1">MADE BY DIJKSTRA · GRAND CONVENTION</div>

}
function LogoBig(){

    <div className="flex flex-col items-center gap-3">
      <RouteMark s={68}/>
      <div className="rf-word text-4xl text-white">RouteFinder</div>
      <div className="text-[9px] hair text-white/60">MADE BY DIJKSTRA</div>
    </div>

}

/* ============================================================
   SHARED UI  (subtle gradients, no shadow)
   ============================================================ */
function Btn({ children, onClick, active, tone='default', className='', disabled }){
  let cls;
  if(tone==='solid')       cls='g-accent text-white border-bp-accent2 hover:brightness-110';
  else if(tone==='ghost')  cls='bg-transparent text-bp-sub border-bp-line hover:text-bp-ink hover:border-bp-ink';
  else if(tone==='danger') cls= active?'g-wait text-white border-bp-wait':'g-sub text-bp-wait border-bp-wait hover:brightness-105';
  else if(tone==='mint')   cls= active?'g-mint text-white border-bp-mint':'g-sub text-bp-ink border-bp-line hover:border-bp-mint';
  else cls= active ? 'g-accent text-white border-bp-accent2'
                   : 'g-sub text-bp-ink border-bp-line hover:border-bp-accent hover:text-bp-accent';
  return (
    <button onClick={onClick} disabled={disabled}
      className={"no-sh px-3 py-1.5 text-xs font-semibold border tracking-wide transition-all "
        +"disabled:opacity-40 disabled:cursor-not-allowed "+cls+" "+className}>
      {children}
    </button>
  );
}
function Tile({ label, value, unit, tone='ink', hint }){
  const c={ink:'text-bp-ink',accent:'text-bp-accent2',wait:'text-bp-wait',mint:'text-bp-mint',bypass:'text-bp-bypass'}[tone];
  return (
    <div className="g-tile g-panel border border-bp-line p-3 no-sh">
      <div className="text-[10px] text-bp-sub hair uppercase">{label}</div>
      <div className={"text-2xl font-bold font-mono "+c}>{value}<span className="text-sm ml-0.5">{unit}</span></div>
      {hint && <div className="text-[9px] text-bp-line mt-0.5">{hint}</div>}
    </div>
  );
}
function Bar({ pct, tone='accent', h='h-2' }){
  const c={accent:'g-accent',wait:'g-wait',mint:'g-mint',bypass:'bg-bp-bypass',trend:'bg-bp-trend'}[tone];
  return <div className={"w-full "+h+" g-sub border border-bp-line"}>
    <div className={c+" h-full transition-all duration-500"} style={{width:clamp(pct,0,100)+'%'}}/></div>;
}
function SectionTitle({ no, title, sub }){
  return (
    <div className="flex items-end gap-2 border-b border-bp-line pb-2">
      <span className="text-2xl font-bold font-mono text-bp-line">{no}</span>
      <div><div className="text-sm font-bold text-bp-ink">{title}</div>
      <div className="text-[9px] hair text-bp-sub uppercase">{sub}</div></div>
    </div>
  );
}
function Legend({c,t}){ return <div className="flex items-center gap-1.5"><span className="w-3 h-3 border border-white" style={{background:c}}/><span>{t}</span></div>; }
function Row({k,v}){ return <div className="flex justify-between"><span className="text-bp-line">{k}</span><span className="font-mono">{v}</span></div>; }
function TInfo({k,v,c}){ return (
  <div className="g-sub border border-bp-line px-2 py-1.5 no-sh">
    <div className="text-[9px] text-bp-sub hair">{k}</div>
    <div className="font-mono font-bold text-bp-ink" style={c?{color:c}:null}>{v}</div>
  </div>
);}
function Sparkline({ data, color=T.accent, w=200, h=42, fill }){
  if(!data || data.length<2) return <svg width="100%" height={h}/>;
  const max=Math.max(1,...data), min=Math.min(0,...data);
  const rng=(max-min)||1;
  const pts=data.map((v,i)=>{
    const x=i/(data.length-1)*w;
    const y=h-4-((v-min)/rng)*(h-8);
    return x.toFixed(1)+','+y.toFixed(1);
  }).join(' ');
  return (
    <svg viewBox={"0 0 "+w+" "+h} width="100%" height={h} preserveAspectRatio="none">
      {fill && <polygon points={"0,"+h+" "+pts+" "+w+","+h} fill={color} fillOpacity="0.12"/>}
      <polyline points={pts} fill="none" stroke={color} strokeWidth="1.8"/>
    </svg>
  );
}

/* ============================================================
   GRAND CONVENTION FLOOR  (mutable booths + BFS flow-field pathing)
   ============================================================ */
const G=24, M=14, COLS=40, ROWS=28;
const VW = M*2 + COLS*G;   // 988
const VH = M*2 + ROWS*G;   // 700
const USABLE_BOTTOM = ROWS-5;   // booths above the entrance apron (rows 1..23)
const TW=32, TH=22;             // thermal grid
const worldC = (c)=> M + c*G + G/2;
const cellIdx = (cx,cy)=> cx + cy*COLS;
const INF = 65535;

const BOOTH_DEFS = [
  ['AUTO DRIVE','자율주행 데모','Tech',true],   ['ROBO ARM','산업 로보틱스','Tech',false],
  ['DRONE BAY','드론 배송관','Tech',false],      ['CHIP LAB','반도체 클린룸','Tech',false],
  ['XR STUDIO','확장현실 체험','Tech',true],     ['AI CORE','온디바이스 AI','Tech',false],
  ['QUANTUM','양자 컴퓨팅','Tech',false],        ['SMART GRID','스마트 전력','Tech',false],
  ['CLOUD EDGE','엣지 클라우드','Tech',false],   ['BIO TECH','바이오 헬스','Tech',false],
  ['SPACE LAB','우주 항공관','Tech',false],      ['NANO LAB','나노 소재','Tech',false],
  ['SENSOR HUB','스마트 센서','Tech',false],     ['SECURITY','사이버 보안','Tech',false],
  ['PASTA BOT','3D 로봇 키친','F&B',true],       ['BARISTA BOT','스마트 커피','F&B',false],
  ['VEGAN LAB','비건 랩','F&B',false],           ['DESSERT 3D','3D 디저트','F&B',false],
  ['CRAFT BREW','수제 음료','F&B',false],        ['STREET FOOD','스트리트 푸드','F&B',true],
  ['GLOBAL GOURMET','세계 미식관','F&B',true],   ['SPICE WORLD','향신료관','F&B',false],
  ['FOOD LOUNGE','식음 라운지','F&B',false],      ['NOODLE BAR','스마트 면류','F&B',false],
  ['AETHER HALL','인터랙티브 홀','Culture',true],['PROJECTION','프로젝션 맵핑','Culture',false],
  ['SOUND DOME','사운드 아트','Culture',false],  ['LIGHT MAZE','라이트 미로','Culture',false],
  ['AR MURAL','AR 벽화','Culture',false],        ['VR CINEMA','VR 시네마','Culture',true],
  ['ART LOUNGE','미디어 쉼터','Culture',false],  ['MEDIA WALL','미디어 파사드','Culture',false],
  ['SMART PHONE','차세대 폰','Trend',true],      ['WEARABLE','착용형 기기','Trend',false],
  ['GAMING RIG','게이밍 아레나','Trend',true],   ['NFT GALLERY','NFT 갤러리','Trend',false],
  ['PHOTO ZONE','포토 존','Trend',true],         ['SMART HOME','스마트홈','Trend',false],
  ['E-MOBILITY','도심 모빌리티','Trend',false],  ['CREATOR','크리에이터관','Trend',false],
];

/* ---- mutable global layout state ---- */
let BOOTHS = [];
let BLOCK  = new Uint8Array(COLS*ROWS);
let OCC    = {};                 // cellIdx -> boothId
let BOOTH_MAP = {};
let FIELD_CACHE = new Map();     // counterCellIdx -> Uint16Array distance field
let BOOTH_SEQ = 0;

const CX = Math.floor(COLS/2);
const ENTRANCE = { x:worldC(CX-1),   y:worldC(ROWS-2) };
const EXIT     = { x:worldC(CX+3),   y:worldC(ROWS-2) };
const ENTRANCE_CELL = cellIdx(CX-1, ROWS-2);
const EXIT_CELL     = cellIdx(CX+3, ROWS-2);
let FACILITIES = [];

/* dense band packer — expo aisles that jam (1-cell aisles + central 2-col aisle) */
function buildInitialBooths(){
  const rng = seededRand(20260707);
  const defs = BOOTH_DEFS;
  const booths=[]; let di=0;
  const bandHs=[3,3,2,3,3,2,3];
  let y=1, bi=0;
  while(di<defs.length && y+1 < USABLE_BOTTOM){
    const bandH=bandHs[bi%bandHs.length]; bi++;
    if(y+bandH-1>USABLE_BOTTOM) break;
    let x=1;
    while(x<COLS-1 && di<defs.length){
      if(x===CX-1||x===CX){ x=CX+1; continue; }       // central 2-col main aisle
      let w=2+Math.floor(rng()*3);                     // 2..4
      if(x<CX-1 && x+w>CX-1) w=CX-1-x;                 // don't cross the central aisle
      if(w<2){ x=CX+1; continue; }
      if(x+w>COLS-1) w=COLS-1-x;
      if(w<2) break;
      const cells=[];
      for(let cy=y;cy<y+bandH;cy++) for(let cx=x;cx<x+w;cx++) cells.push([cx,cy]);
      const [label,sub,cat,hot]=defs[di++];
      booths.push({ id:'B'+String(booths.length+1).padStart(2,'0'), label, sub, cat, hot, cells });
      x += w + 1;                                      // 1-col aisle between booths
    }
    y += bandH + 1;                                    // 1-row aisle between bands
  }
  return booths;
}

/* recompute walls / gate / counter / label anchor for one booth using current BLOCK */
function finalizeBooth(b){
  const placed=b.cells;
  const cset=new Set(placed.map(c=>c[0]+','+c[1]));
  const key=(x,y)=>x+','+y;
  const edges=[];
  for(const [cx,cy] of placed){
    const push=(side,gx1,gy1,gx2,gy2,nx,ny)=>{
      const ocx=cx+nx, ocy=cy+ny;
      const free = ocx>=0&&ocx<COLS&&ocy>=0&&ocy<ROWS && BLOCK[cellIdx(ocx,ocy)]===0;
      edges.push({ side, gx1,gy1,gx2,gy2, nx,ny,
        mid:{ x:M+((gx1+gx2)/2)*G, y:M+((gy1+gy2)/2)*G },
        outCell:{cx:ocx,cy:ocy}, outFree:free });
    };
    if(!cset.has(key(cx,cy-1))) push('top',    cx,cy,   cx+1,cy,   0,-1);
    if(!cset.has(key(cx,cy+1))) push('bottom', cx,cy+1, cx+1,cy+1, 0, 1);
    if(!cset.has(key(cx-1,cy))) push('left',   cx,cy,   cx,cy+1,  -1, 0);
    if(!cset.has(key(cx+1,cy))) push('right',  cx+1,cy, cx+1,cy+1, 1, 0);
  }
  const cands=edges.filter(e=>e.outFree);
  let gate=null, best=1e9;
  for(const e of cands){
    const d=Math.hypot(e.mid.x-ENTRANCE.x, e.mid.y-ENTRANCE.y);
    if(d<best){ best=d; gate=e; }
  }
  let sx=0,sy=0; placed.forEach(c=>{ sx+=worldC(c[0]); sy+=worldC(c[1]); });
  const center={ x:sx/placed.length, y:sy/placed.length };

  let counterCell, normal;
  if(gate){
    counterCell = cellIdx(gate.outCell.cx, gate.outCell.cy);
    normal = { x:gate.nx, y:gate.ny };
  } else {
    // fully enclosed — find nearest free cell to centroid
    const ccx=Math.round((center.x-M-G/2)/G), ccy=Math.round((center.y-M-G/2)/G);
    let bd=1e9, bc=ENTRANCE_CELL;
    for(let cy=0;cy<ROWS;cy++) for(let cx=0;cx<COLS;cx++){
      if(BLOCK[cellIdx(cx,cy)]===0){ const d=(cx-ccx)*(cx-ccx)+(cy-ccy)*(cy-ccy); if(d<bd){bd=d;bc=cellIdx(cx,cy);} }
    }
    counterCell=bc; normal={x:0,y:-1};
  }
  const cx2=counterCell%COLS, cy2=Math.floor(counterCell/COLS);
  b.edges=edges; b.gate=gate; b.center=center; b.normal=normal;
  b.counterCell=counterCell; b.counter={ x:worldC(cx2), y:worldC(cy2) };
  b.color=CAT_COLOR[b.cat];
  const baseCap=clamp(Math.round(placed.length*0.8)+3, 5, 14);
  b.cap = b.hot ? Math.max(4, baseCap-4) : baseCap;   // hot booths bottleneck → queues
}

function rebuild(){
  BLOCK = new Uint8Array(COLS*ROWS);
  for(const b of BOOTHS) for(const c of b.cells) BLOCK[cellIdx(c[0],c[1])]=1;
  OCC={}; BOOTH_MAP={};
  for(const b of BOOTHS){
    for(const c of b.cells) OCC[cellIdx(c[0],c[1])]=b.id;
    BOOTH_MAP[b.id]=b;
  }
  for(const b of BOOTHS) finalizeBooth(b);
  FIELD_CACHE = new Map();
}
function initLayout(){
  BOOTHS = buildInitialBooths();
  BOOTH_SEQ = BOOTHS.length;
  FACILITIES = [
    { x:ENTRANCE.x, y:VH-M-9, label:'ENTRANCE', kind:'entry' },
    { x:EXIT.x,     y:VH-M-9, label:'EXIT',     kind:'exit' },
    { x:M+42,   y:M+16,  label:'INFO' },
    { x:VW-M-42,y:M+16,  label:'MEDIA' },
    { x:M+18,   y:VH/2,  label:'WC' },
    { x:VW-M-18,y:VH/2,  label:'WC' },
  ];
  rebuild();
}
initLayout();

/* BFS distance field over free cells from a start cell (4-connected) */
function computeField(startIdx){
  const D = new Uint16Array(COLS*ROWS); D.fill(INF);
  if(BLOCK[startIdx]===1) return D;
  D[startIdx]=0;
  const q=new Int32Array(COLS*ROWS); q[0]=startIdx; let head=0, tail=1;
  while(head<tail){
    const cur=q[head++]; const cx=cur%COLS, cy=(cur/COLS)|0; const nd=D[cur]+1;
    if(cx>0){ const n=cur-1;    if(BLOCK[n]===0 && D[n]>nd){ D[n]=nd; q[tail++]=n; } }
    if(cx<COLS-1){ const n=cur+1; if(BLOCK[n]===0 && D[n]>nd){ D[n]=nd; q[tail++]=n; } }
    if(cy>0){ const n=cur-COLS; if(BLOCK[n]===0 && D[n]>nd){ D[n]=nd; q[tail++]=n; } }
    if(cy<ROWS-1){ const n=cur+COLS; if(BLOCK[n]===0 && D[n]>nd){ D[n]=nd; q[tail++]=n; } }
  }
  return D;
}
function getField(cellIdxKey){
  let f=FIELD_CACHE.get(cellIdxKey);
  if(!f){ f=computeField(cellIdxKey); FIELD_CACHE.set(cellIdxKey,f); }
  return f;
}
/* steer toward the lowest-distance neighbour cell (routes around walls) */
function steerField(D, x, y){
  const cx=clamp(Math.floor((x-M)/G),0,COLS-1), cy=clamp(Math.floor((y-M)/G),0,ROWS-1);
  const cur=cx+cy*COLS; const dc=D[cur];
  let bx=cx, by=cy, bd=dc, found=false;
  const free=(nx,ny)=> nx>=0&&nx<COLS&&ny>=0&&ny<ROWS&&BLOCK[nx+ny*COLS]===0;
  const tryc=(nx,ny)=>{ if(!free(nx,ny))return; const nd=D[nx+ny*COLS]; if(nd<bd){ bd=nd; bx=nx; by=ny; found=true; } };
  tryc(cx-1,cy); tryc(cx+1,cy); tryc(cx,cy-1); tryc(cx,cy+1);
  if(free(cx-1,cy)&&free(cx,cy-1)) tryc(cx-1,cy-1);
  if(free(cx+1,cy)&&free(cx,cy-1)) tryc(cx+1,cy-1);
  if(free(cx-1,cy)&&free(cx,cy+1)) tryc(cx-1,cy+1);
  if(free(cx+1,cy)&&free(cx,cy+1)) tryc(cx+1,cy+1);
  if(!found) return null;
  return { x:worldC(bx), y:worldC(by) };
}
function cellBlockedAt(x,y){
  const cx=Math.floor((x-M)/G), cy=Math.floor((y-M)/G);
  if(cx<0||cx>=COLS||cy<0||cy>=ROWS) return false;
  return BLOCK[cellIdx(cx,cy)]===1;
}
function randFreePoint(){
  for(let t=0;t<50;t++){
    const cx=1+Math.floor(rnd()*(COLS-2)), cy=1+Math.floor(rnd()*(ROWS-2));
    if(BLOCK[cellIdx(cx,cy)]===0) return { x:worldC(cx), y:worldC(cy) };
  }
  return { x:ENTRANCE.x, y:ENTRANCE.y };
}
function randomBoothId(){ return BOOTHS.length?BOOTHS[Math.floor(rnd()*BOOTHS.length)].id:null; }

/* ---- layout mutations (editor) ---- */
function boothAtCell(cx,cy){ if(cx<0||cx>=COLS||cy<0||cy>=ROWS)return null; return OCC[cellIdx(cx,cy)]||null; }
function fitsCells(cells, ignoreId){
  for(const c of cells){
    const [cx,cy]=c;
    if(cx<1||cx>COLS-2||cy<1||cy>USABLE_BOTTOM) return false;
    const id=OCC[cellIdx(cx,cy)];
    if(BLOCK[cellIdx(cx,cy)]===1 && id!==ignoreId) return false;
  }
  return true;
}
function rectCells(cx,cy,w,h){ const c=[]; for(let y=cy;y<cy+h;y++) for(let x=cx;x<cx+w;x++) c.push([x,y]); return c; }
function addBooth(cells,label,cat,hot){
  BOOTH_SEQ++;
  BOOTHS.push({ id:'B'+String(BOOTH_SEQ).padStart(2,'0'), label:label||('BOOTH '+BOOTH_SEQ), sub:'사용자 추가 부스', cat, hot:!!hot, cells });
  rebuild();
}
function removeBooth(id){ BOOTHS = BOOTHS.filter(b=>b.id!==id); rebuild(); }
function relocateBooth(id, cells){ const b=BOOTH_MAP[id]; if(b){ b.cells=cells; rebuild(); } }
function updateBooth(id, patch){ const b=BOOTH_MAP[id]; if(b){ Object.assign(b, patch); rebuild(); } }

const COMPANIONS = [
  { key:'solo', ko:'혼자', color:T.solo },
  { key:'couple', ko:'연인', color:T.couple },
  { key:'family', ko:'가족', color:T.family },
];
const PREFS = [
  { ko:'테크', cat:'Tech' }, { ko:'트렌디', cat:'Trend' },
  { ko:'F&B', cat:'F&B' }, { ko:'문화예술', cat:'Culture' },
];
let AGENT_SEQ = 1000;
const HALL_Y = M + USABLE_BOTTOM*G;   // agents above this are "inside" the hall
function makeAgent(seed){
  const comp=pick(COMPANIONS), pref=pick(PREFS);
  const spawnX = ENTRANCE.x + (rnd()-0.5)*90;
  return {
    id:'V'+(AGENT_SEQ++),
    x:clamp(spawnX, M+6, VW-M-6), y:ENTRANCE.y+(rnd()-0.4)*30,
    vx:0, vy:0,
    comp:comp.key, color:comp.color, pref:pref.ko, prefCat:pref.cat,
    patience:Math.floor(45+rnd()*55), spd:0.85+rnd()*0.5,
    state: seed?'wander':'enter', target:null, roamBooth:randomBoothId(),
    waitT:0, dwellT:0, dwellMax:0, joinOrder:0,
    servePos:null, accuracy:0.6+rnd()*2.0, dist:0, dead:false,
    bubble:null, seekTimer:0.6+rnd()*3, stuck:0,
  };
}
function chooseBooth(a){
  const booths=BOOTHS; if(!booths.length) return null;
  let total=0; const w=[];
  for(const b of booths){
    let x=1;
    if(b.cat===a.prefCat) x+=3;
    if(b.hot) x+=1.8;
    w.push(x); total+=x;
  }
  let r=rnd()*total;
  for(let i=0;i<booths.length;i++){ r-=w[i]; if(r<=0) return booths[i].id; }
  return booths[0].id;
}
function needText(a){
  if(a.state==='enter') return '입장! 어디부터 가볼까';
  if(a.state==='exit')  return '오늘 재밌었다, 이만 퇴장';
  if(a.state==='queue'){
    const opt=['줄이 좀 기네요','얼마나 기다려야 하죠?','조금 지치네요','앞에 몇 명이지?','통로가 꽉 찼어요'];
    return opt[a.id.charCodeAt(a.id.length-1)%opt.length];
  }
  if(a.state==='serve'){
    return a.prefCat==='F&B'?'오 이거 맛있다!':a.prefCat==='Culture'?'분위기 좋다':'와 신기하네요';
  }
  if(a.patience<32) return '다리 아파요, 쉬고 싶어';
  if(a.state==='bypass') return '덜 붐비는 곳으로 갈게요';
  if((a.state==='seek') && a.target){ const b=BOOTH_MAP[a.target]; if(b) return b.label+' 가는 중'; }
  return ({Tech:'테크 부스 어디예요?',['F&B']:'뭐 좀 먹을까?',Culture:'전시 보러 가자',Trend:'요즘 핫한 곳!'})[a.prefCat];
}

/* ============================================================
   THERMAL RENDER HELPERS
   ============================================================ */
function drawThermalField(ctx, field, W, H, alpha){
  let peak=0.0001; for(let i=0;i<field.length;i++) if(field[i]>peak) peak=field[i];
  const cw=W/TW, ch=H/TH;
  ctx.clearRect(0,0,W,H);
  ctx.save(); ctx.filter='blur('+Math.max(4,W/70)+'px)';
  for(let j=0;j<TH;j++) for(let i=0;i<TW;i++){
    ctx.fillStyle=thermalCss(field[i+j*TW]/peak, alpha==null?1:alpha);
    ctx.fillRect(i*cw, j*ch, cw+1.2, ch+1.2);
  }
  ctx.restore();
}
function ThermalOverlay({ engine }){
  const ref=useRef();
  useEffect(()=>{
    const cv=ref.current, ctx=cv.getContext('2d'); let raf;
    const loop=()=>{
      if(engine.showThermal){ cv.style.opacity='0.6'; drawThermalField(ctx, engine.thermal, VW, VH, 1); }
      else cv.style.opacity='0';
      raf=requestAnimationFrame(loop);
    };
    loop(); return ()=>cancelAnimationFrame(raf);
  },[]);
  return <canvas ref={ref} width={VW} height={VH}
    className="absolute inset-0 w-full h-full pointer-events-none transition-opacity duration-300"
    style={{opacity:0}}/>;
}
function ThermalMini({ engine, h=120 }){
  const ref=useRef();
  useEffect(()=>{
    const cv=ref.current, ctx=cv.getContext('2d'); let raf;
    const loop=()=>{ drawThermalField(ctx, engine.thermal, cv.width, cv.height, 1); raf=requestAnimationFrame(loop); };
    loop(); return ()=>cancelAnimationFrame(raf);
  },[]);
  return <canvas ref={ref} width={320} height={Math.round(320*TH/TW)}
    className="w-full border border-bp-line" style={{height:h}}/>;
}

/* ============================================================
   AGENT CANVAS — all live entities drawn here (no per-frame React)
   ============================================================ */
function AgentCanvas({ engine, avatarRef, uiRef, onHover, onClick }){
  const ref=useRef();
  useEffect(()=>{
    const cv=ref.current, ctx=cv.getContext('2d'); let raf;
    const draw=()=>{
      ctx.clearRect(0,0,VW,VH);
      const E=engine.current, ui=uiRef.current;
      const filter=ui.filter, sel=ui.selectedId;

      // occupancy pills near counters
      ctx.font='700 8px ui-monospace, monospace'; ctx.textAlign='center';
      for(const b of E.booths){
        if(filter!=='All' && b.cat!==filter) continue;
        const occ=E.rt[b.id]||{served:0,queue:0};
        const px=b.counter.x+18, py=b.counter.y;
        const busy=occ.queue>4;
        ctx.fillStyle='#fff'; ctx.fillRect(px-15,py-7,30,13);
        ctx.strokeStyle=busy?T.wait:T.line; ctx.lineWidth=0.8; ctx.strokeRect(px-15,py-7,30,13);
        ctx.fillStyle=busy?T.wait:T.accent2; ctx.fillText(occ.served+'/'+occ.queue, px, py+3);
      }

      // trail of tracked agent
      if(sel && E.trail.length>1){
        ctx.beginPath(); ctx.moveTo(E.trail[0].x,E.trail[0].y);
        for(let i=1;i<E.trail.length;i++) ctx.lineTo(E.trail[i].x,E.trail[i].y);
        ctx.strokeStyle='rgba(18,211,176,0.65)'; ctx.lineWidth=1.6; ctx.stroke();
      }

      // agents
      for(const a of E.agents){
        let fill=a.color;
        if(a.state==='queue')fill=T.wait; else if(a.state==='bypass')fill=T.bypass;
        else if(a.state==='enter')fill=T.entry; else if(a.state==='exit')fill=T.sub;
        const isSel=a.id===sel;
        const r=isSel?4.4:(a.state==='queue'?3.6:3.0);
        ctx.beginPath(); ctx.arc(a.x,a.y,r,0,6.2832);
        ctx.fillStyle=fill; ctx.fill();
        ctx.lineWidth=isSel?1.4:0.7; ctx.strokeStyle=isSel?T.mint:'#fff'; ctx.stroke();
        if(isSel){ ctx.beginPath(); ctx.arc(a.x,a.y,9,0,6.2832); ctx.strokeStyle=T.mint; ctx.lineWidth=2; ctx.stroke(); }
      }

      // speech bubbles
      ctx.font='8.5px Inter, sans-serif';
      for(const a of E.agents){
        if(!a.bubble) continue;
        const w=Math.min(160, 22+a.bubble.length*6.6);
        const bx=clamp(a.x-w/2,4,VW-w-4), by=clamp(a.y-24,4,VH-20);
        const s2=a.id===sel;
        ctx.fillStyle='#fff'; ctx.fillRect(bx,by,w,15);
        ctx.strokeStyle=s2?T.mint:T.line; ctx.lineWidth=s2?1.4:0.8; ctx.strokeRect(bx,by,w,15);
        ctx.fillStyle=T.ink; ctx.textAlign='center'; ctx.fillText(a.bubble, bx+w/2, by+11);
      }

      // avatar (play mode)
      if(ui.playMode){
        const av=avatarRef.current;
        ctx.fillStyle=T.mint; ctx.strokeStyle=T.ink; ctx.lineWidth=1.6;
        ctx.fillRect(av.x-6,av.y-6,12,12); ctx.strokeRect(av.x-6,av.y-6,12,12);
        ctx.beginPath(); ctx.arc(av.x,av.y,12,0,6.2832); ctx.strokeStyle='rgba(18,211,176,0.6)'; ctx.lineWidth=2; ctx.stroke();
        ctx.fillStyle=T.ink; ctx.font='800 9px Inter'; ctx.textAlign='center'; ctx.fillText('YOU',av.x,av.y-14);
      }

      // edit-mode placement / move preview + selection
      if(ui.editMode){
        const hc=ui.hoverCell;
        const previewCells=(anchor)=>{
          if(ui.pendingAdd){ const [w,h]=ui.pendingAdd.size; return rectCells(anchor.cx,anchor.cy,w,h); }
          if(ui.moveId){ const b=BOOTH_MAP[ui.moveId]; if(!b)return null;
            let mnx=1e9,mny=1e9; b.cells.forEach(c=>{ if(c[0]<mnx)mnx=c[0]; if(c[1]<mny)mny=c[1]; });
            return b.cells.map(c=>[c[0]-mnx+anchor.cx, c[1]-mny+anchor.cy]); }
          return null;
        };
        if(hc && (ui.pendingAdd||ui.moveId)){
          const cells=previewCells(hc);
          if(cells){
            const ok=fitsCells(cells, ui.moveId||null);
            ctx.fillStyle=ok?'rgba(18,211,176,0.35)':'rgba(224,69,59,0.35)';
            ctx.strokeStyle=ok?T.mint:T.wait; ctx.lineWidth=1;
            for(const c of cells){ ctx.fillRect(M+c[0]*G,M+c[1]*G,G,G); ctx.strokeRect(M+c[0]*G,M+c[1]*G,G,G); }
          }
        }
      }

      raf=requestAnimationFrame(draw);
    };
    draw(); return ()=>cancelAnimationFrame(raf);
  },[]);

  const toPt=(e)=>{ const cv=ref.current, r=cv.getBoundingClientRect();
    return { x:(e.clientX-r.left)/r.width*VW, y:(e.clientY-r.top)/r.height*VH }; };
  const nearestAgent=(pt)=>{ const E=engine.current; let best=null,bd=64; // 8px^2 radius
    for(const a of E.agents){ const dx=a.x-pt.x,dy=a.y-pt.y,d=dx*dx+dy*dy; if(d<bd){bd=d;best=a;} } return best; };

  return <canvas ref={ref} width={VW} height={VH}
    className="absolute inset-0 w-full h-full block select-none"
    style={{cursor: uiRef.current.editMode?'crosshair':'pointer'}}
    onMouseMove={(e)=>{ const pt=toPt(e);
      const cx=Math.floor((pt.x-M)/G), cy=Math.floor((pt.y-M)/G);
      uiRef.current.hoverCell={cx,cy};
      if(!uiRef.current.editMode){ const a=nearestAgent(pt); if(a) onHover(a,e.clientX,e.clientY); else onHover(null); }
    }}
    onMouseLeave={()=>{ uiRef.current.hoverCell=null; onHover(null); }}
    onClick={(e)=>{ const pt=toPt(e); const cx=Math.floor((pt.x-M)/G), cy=Math.floor((pt.y-M)/G);
      onClick({ worldPt:pt, cell:{cx,cy}, agent:nearestAgent(pt) }); }}/>;
}

/* ============================================================
   LOADING SCREEN — animated thermal camera
   ============================================================ */
function Loader(){
  const ref=useRef();
  useEffect(()=>{
    const cv=ref.current, ctx=cv.getContext('2d'); let raf;
    const NW=48,NH=32, f=new Float32Array(NW*NH);
    for(let i=0;i<f.length;i++) f[i]=Math.random()*0.4;
    const cw=cv.width/NW, ch=cv.height/NH;
    const blobs=[]; for(let k=0;k<7;k++) blobs.push({x:Math.random()*NW,y:Math.random()*NH,vx:(Math.random()-0.5)*0.5,vy:(Math.random()-0.5)*0.5});
    const loop=()=>{
      for(let i=0;i<f.length;i++) f[i]*=0.9;
      for(const b of blobs){
        b.x+=b.vx; b.y+=b.vy;
        if(b.x<0||b.x>NW)b.vx*=-1; if(b.y<0||b.y>NH)b.vy*=-1;
        const bx=Math.floor(b.x),by=Math.floor(b.y);
        for(let dy=-4;dy<=4;dy++) for(let dx=-4;dx<=4;dx++){
          const xx=bx+dx,yy=by+dy; if(xx>=0&&xx<NW&&yy>=0&&yy<NH){ f[xx+yy*NW]+=Math.max(0,0.6-Math.hypot(dx,dy)*0.13); }
        }
      }
      for(let i=0;i<f.length;i++) f[i]+=Math.random()*0.06;
      let peak=0.001; for(let i=0;i<f.length;i++) if(f[i]>peak)peak=f[i];
      ctx.save(); ctx.filter='blur(7px)';
      for(let j=0;j<NH;j++) for(let i=0;i<NW;i++){ ctx.fillStyle=thermalCss(f[i+j*NW]/peak,1); ctx.fillRect(i*cw,j*ch,cw+1.5,ch+1.5); }
      ctx.restore();
      raf=requestAnimationFrame(loop);
    };
    loop(); return ()=>cancelAnimationFrame(raf);
  },[]);
  return (
    <div id="rf-loader" className="fixed inset-0 z-[999] flex flex-col items-center justify-center g-ink">
      <canvas ref={ref} width={640} height={420} className="absolute inset-0 w-full h-full" style={{opacity:.55}}/>
      <div className="relative z-10 flex flex-col items-center gap-5">
        <LogoBig/>
        <div className="text-white/80 text-[11px] hair font-mono">THERMAL SENSOR ARRAY · CALIBRATING…</div>
        <div className="w-60 h-1 bg-white/20 overflow-hidden"><div className="h-full g-mint loader-bar"/></div>
      </div>
    </div>
  );
}

            setMoveId(null); setLayoutVersion(v=>v+1); pushToast(id+' 부스를 이동했습니다','accent'); }
          else pushToast('이동 불가 · 겹치거나 범위를 벗어남','wait'); }
        return;
      }
      const bid=boothAtCell(cell.cx,cell.cy);
      setEditSelId(bid||null);

  },[pushToast]);

  // keyboard for play mode
  useEffect(()=>{
    const dn=(e)=>{ const k=e.key.toLowerCase(); if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){ keys.current[k]=true; if(playRef.current) e.preventDefault(); } };
    const up=(e)=>{ keys.current[e.key.toLowerCase()]=false; };
    window.addEventListener('keydown',dn); window.addEventListener('keyup',up);
    return ()=>{ window.removeEventListener('keydown',dn); window.removeEventListener('keyup',up); };
  },[]);

  // ===== simulation loop =====
  useEffect(()=>{
    let raf,last=0,statAcc=0,thermAcc=0;
    const step=(ts)=>{
      let dt=(ts-last)/1000; last=ts; if(dt>0.05)dt=0.05;
      const sdt=dt*speedRef.current;
      const E=engine.current, booths=E.booths, agents=E.agents;
      const bp=bypassRef.current, nudgeP=nudgeRef.current/100;
      const R=12, SEP=90, DES=52;

      // per-booth service accounting
      const served={}, queued={};
      booths.forEach(b=>{ served[b.id]=0; queued[b.id]=[]; });
      for(const a of agents){
        if(a.target && !BOOTH_MAP[a.target]){ a.target=null; if(a.state==='seek'||a.state==='queue'||a.state==='serve'||a.state==='bypass'){ a.state='wander'; a.seekTimer=0.6+rnd()*2; } }
        if(a.state==='serve'&&a.target) served[a.target]++;
        else if(a.state==='queue'&&a.target && queued[a.target]) queued[a.target].push(a);
      }
      const slots={};
      booths.forEach(b=>{ slots[b.id]=b.cap-served[b.id]; queued[b.id].sort((p,q)=>p.joinOrder-q.joinOrder); });
      booths.forEach(b=>{
        let s=slots[b.id];
        for(const a of queued[b.id]){
          if(s>0){ a.state='serve'; a.dwellT=0; a.dwellMax=(b.hot?9:6)+rnd()*6;
            a.servePos={x:b.counter.x+(rnd()-0.5)*18, y:b.counter.y+(rnd()-0.5)*18}; s--; servedAccum.current++; }
          else break;
        }
        slots[b.id]=s;
      });

      // steering (flow-field pathing)
      for(const a of agents){
        const b=a.target?BOOTH_MAP[a.target]:null;
        let ds=DES*a.spd;
        let exact=null, fieldCell=null;

        if(a.state==='enter'){
          if(!a.roamBooth||!BOOTH_MAP[a.roamBooth]) a.roamBooth=randomBoothId();
          const rb=BOOTH_MAP[a.roamBooth];
          if(rb){ exact=rb.counter; fieldCell=rb.counterCell; } else { exact=ENTRANCE; }
          if(a.y < HALL_Y){ a.state='seek'; a.target=chooseBooth(a); }
        } else if(a.state==='wander'){
          a.seekTimer-=sdt; ds*=0.75;
          if(!a.roamBooth||!BOOTH_MAP[a.roamBooth]) a.roamBooth=randomBoothId();
          const rb=BOOTH_MAP[a.roamBooth];
          if(rb){ exact=rb.counter; fieldCell=rb.counterCell;
            if(Math.hypot(rb.counter.x-a.x, rb.counter.y-a.y)<32) a.roamBooth=randomBoothId(); }
          else exact={x:VW/2,y:VH/2};
          if(a.seekTimer<=0){ a.state='seek'; a.target=chooseBooth(a); }
        } else if(a.state==='seek' || a.state==='bypass'){
          if(b){
            exact=b.counter; fieldCell=b.counterCell;
            if(a.state==='seek' && bp && b.hot && queued[b.id].length>4 && rnd()<0.014*nudgeP*3){
              const alt=booths.filter(x=>x.cat===b.cat && !x.hot);
              if(alt.length){ a.target=pick(alt).id; a.state='bypass'; }
            }
            if(Math.hypot(b.counter.x-a.x,b.counter.y-a.y)<20){
              if(slots[b.id]>0){ a.state='serve'; a.dwellT=0; a.dwellMax=(b.hot?9:6)+rnd()*6; slots[b.id]--;
                a.servePos={x:b.counter.x+(rnd()-0.5)*18,y:b.counter.y+(rnd()-0.5)*18}; servedAccum.current++; }
              else { a.state='queue'; a.joinOrder=E.order++; a.waitT=0; }
            }
          } else { a.state='wander'; a.seekTimer=0.6+rnd()*2; exact={x:a.x,y:a.y}; }
        } else if(a.state==='queue'){
          a.waitT+=sdt; ds*=0.5;
          const idx=b&&queued[b.id]?queued[b.id].indexOf(a):0;
          const c=b?b.counter:{x:VW/2,y:VH/2};
          const nx=(b?b.normal.x:0), ny=(b?b.normal.y:1);
          exact={ x:c.x + nx*(10+Math.max(0,idx)*13), y:c.y + ny*(10+Math.max(0,idx)*13) };
          if(b && Math.hypot(exact.x-a.x,exact.y-a.y)>G*1.5) fieldCell=b.counterCell;
          if(a.waitT>a.patience*0.35){
            if(bp){ const alt=booths.filter(x=>x.cat===(b?b.cat:'Tech')&&!x.hot); if(alt.length){ a.target=pick(alt).id; a.state='bypass'; } else { a.state='wander'; a.target=null; a.seekTimer=1+rnd()*3; } }
            else { a.state='wander'; a.target=null; a.seekTimer=1+rnd()*3; }
            a.patience=clamp(a.patience-6,10,100);
          }
        } else if(a.state==='serve'){
          a.dwellT+=sdt; ds*=0.35;
          exact=a.servePos||(b?b.counter:{x:VW/2,y:VH/2});
          if(a.dwellT>=a.dwellMax){ a.state='leave'; a.roamBooth=randomBoothId(); a.patience=clamp(a.patience-4,8,100); }
        } else if(a.state==='leave'){
          if(!a.roamBooth||!BOOTH_MAP[a.roamBooth]) a.roamBooth=randomBoothId();
          const rb=BOOTH_MAP[a.roamBooth];
          if(rb){ exact=rb.counter; fieldCell=rb.counterCell;
            if(Math.hypot(rb.counter.x-a.x,rb.counter.y-a.y)<30){ a.state='wander'; a.target=null; a.seekTimer=0.8+rnd()*3; } }
          else { a.state='wander'; a.target=null; exact={x:a.x,y:a.y}; }
        } else if(a.state==='exit'){
          exact=EXIT; fieldCell=EXIT_CELL; ds*=1.1;
          if(Math.hypot(EXIT.x-a.x,EXIT.y-a.y)<22) a.dead=true;
        } else { exact={x:a.x,y:a.y}; }

        // resolve waypoint (field vs direct)

      for(let i=0;i<agents.length;i++){ const a=agents[i]; const k=bkey(a.x,a.y); let arr=buckets.get(k); if(!arr){arr=[];buckets.set(k,arr);} arr.push(i); }
      const av=avatarRef.current, playing=playRef.current;
      for(let i=0;i<agents.length;i++){
        const a=agents[i]; let px=0,py=0;
        const gx=Math.floor(a.x/BS), gy=Math.floor(a.y/BS);
        for(let ox=-1;ox<=1;ox++) for(let oy=-1;oy<=1;oy++){
          const arr=buckets.get((gx+ox)+'_'+(gy+oy)); if(!arr) continue;
          for(const j of arr){ if(i===j) continue; const o=agents[j];
            const dx=a.x-o.x, dy=a.y-o.y, d2=dx*dx+dy*dy;
            if(d2<R*R && d2>0.0001){ const d=Math.sqrt(d2), f=(R-d)/R; px+=(dx/d)*f; py+=(dy/d)*f; } }

          if(d2<(R+6)*(R+6)&&d2>0.01){ const d=Math.sqrt(d2), f=(R+6-d)/(R+6); px+=(dx/d)*f*1.4; py+=(dy/d)*f*1.4; } }

      }

      const maxV=DES*1.7;
      for(const a of agents){
        let vx=a._sx+a._px, vy=a._sy+a._py;
        const mag=Math.hypot(vx,vy); if(mag>maxV){ vx=vx/mag*maxV; vy=vy/mag*maxV; }
        let nx=clamp(a.x+vx*sdt, M+3, VW-M-3), ny=clamp(a.y+vy*sdt, M+3, VH-M-3);
        let fx=nx, fy=ny;
        if(cellBlockedAt(fx,fy)){
          if(!cellBlockedAt(nx,a.y)){ fx=nx; fy=a.y; }
          else if(!cellBlockedAt(a.x,ny)){ fx=a.x; fy=ny; }
          else { fx=a.x; fy=a.y; a.stuck++;
            if(a.stuck>26){ a.stuck=0; a.roamBooth=randomBoothId();
              if(a.state==='seek'||a.state==='bypass'){ a.state='wander'; a.target=null; a.seekTimer=0.5+rnd()*2; }
              // nudge toward a free neighbour cell to unstick
              const dirs=[[G,0],[-G,0],[0,G],[0,-G]];
              for(const d of dirs){ if(!cellBlockedAt(a.x+d[0],a.y+d[1])){ fx=a.x+d[0]*0.4; fy=a.y+d[1]*0.4; break; } }
            }
          }

      if(playing){
        let ax=0,ay=0;
        if(keys.current['w']||keys.current['arrowup'])ay-=1;
        if(keys.current['s']||keys.current['arrowdown'])ay+=1;
        if(keys.current['a']||keys.current['arrowleft'])ax-=1;
        if(keys.current['d']||keys.current['arrowright'])ax+=1;
        if(ax||ay){ av.target=null; const m=Math.hypot(ax,ay); ax/=m; ay/=m; }
        else if(av.target){ const dx=av.target.x-av.x,dy=av.target.y-av.y,d=Math.hypot(dx,dy); if(d>4){ax=dx/d;ay=dy/d;}else av.target=null; }
        const AV=140*speedRef.current;
        let nx=clamp(av.x+ax*AV*dt,14,VW-14), ny=clamp(av.y+ay*AV*dt,14,VH-14);
        if(!cellBlockedAt(nx,ny)){ av.x=nx; av.y=ny; }
        else if(!cellBlockedAt(nx,av.y)) av.x=nx;
        else if(!cellBlockedAt(av.x,ny)) av.y=ny;
        for(const b of E.booths){
          if(av.stamped[b.id])continue;

            av.stamped[b.id]=true; const n=Object.keys(av.stamped).length;

          }
        }
      }

      // ===== thermal field (randomized) =====
      thermAcc+=dt;
      const th=E.thermal;
      for(let i=0;i<th.length;i++) th[i]*=0.90;
      const cwT=VW/TW, chT=VH/TH;
      for(const a of agents){
        const ix=clamp(Math.floor(a.x/cwT),0,TW-1), iy=clamp(Math.floor(a.y/chT),0,TH-1);
        th[ix+iy*TW]+=0.09;
        const w=(a.state==='queue'||a.state==='serve')?0.06:0.02;
        if(ix>0)th[ix-1+iy*TW]+=w; if(ix<TW-1)th[ix+1+iy*TW]+=w;
        if(iy>0)th[ix+(iy-1)*TW]+=w; if(iy<TH-1)th[ix+(iy+1)*TW]+=w;
      }
      for(let i=0;i<th.length;i++){ th[i]+= (rnd()-0.35)*0.03 + 0.02*Math.sin(ts*0.002+i*0.7); if(th[i]<0)th[i]=0; if(th[i]>2.5)th[i]=2.5; }

      const rt={}; booths.forEach(b=>{ rt[b.id]={served:s2[b.id],queue:q2[b.id]}; }); E.rt=rt;

        if(active<target){
          const add=Math.min(6, target-active);
          for(let i=0;i<add;i++) E.agents.push(makeAgent(false));
        } else if(active>target){
          let remove=Math.min(5, active-target);
          for(const a of activeArr){
            if(remove<=0)break;
            if(a.state==='wander'||a.state==='leave'||a.state==='seek'){ a.state='exit'; a.target=null; if(a.id===selRef.current)setSelectedId(null); remove--; }
          }
        }

        let hotCells=0; const hthr=0.6*peak;
        for(let i=0;i<th.length;i++) if(th[i]>hthr) hotCells++;
        const hotFrac=hotCells/th.length;
        const cong=clamp(18 + hotFrac*140 + (Math.sin(ts/4000)*2) - (bp?7:0), 6, 97);
        const hotspots=Math.round(hotCells/4);

        let L=0,servedTot=0; booths.forEach(b=>{ L+=q2[b.id]; servedTot+=s2[b.id]; });
        const total=E.agents.length;
        const lambda=clamp((bp?total/26*(1-0.28*nudgeP):total/26),1,40);
        const W=lambda>0?L/lambda:0;
        const tp=servedAccum.current/win*60; servedAccum.current=0;
        const convert=total?clamp(servedTot/total*100,0,100):0;

        const byCat={Tech:0,['F&B']:0,Culture:0,Trend:0}, byComp={solo:0,couple:0,family:0};
        for(const a of E.agents){
          byComp[a.comp]=(byComp[a.comp]||0)+1;
          if(a.target && (a.state==='serve'||a.state==='queue'||a.state==='seek')){
            const b=BOOTH_MAP[a.target]; if(b) byCat[b.cat]=(byCat[b.cat]||0)+1;
          }
        }
        const top=[...booths].map(b=>({id:b.id,label:b.label,cat:b.cat,served:s2[b.id],queue:q2[b.id]}))
          .sort((p,q)=>(q.served+q.queue)-(p.served+p.queue)).slice(0,6);

        setStats({ total,cong,L,W,lambda,hotspots,throughput:tp,convert,byCat,byComp,top });

        E.hist.cong.push(cong); if(E.hist.cong.length>60)E.hist.cong.shift();
        E.hist.L.push(L); if(E.hist.L.length>60)E.hist.L.shift();

        if(bp){ roiRef.current.savedMin+=(0.15+rnd()*0.4)*nudgeP; roiRef.current.revenue+=Math.floor((1+rnd()*2)*nudgeRef.current*1.2); }
      }

      raf=requestAnimationFrame(step);
    };
    raf=requestAnimationFrame(step);
    return ()=>cancelAnimationFrame(raf);
  },[]); // eslint-disable-line

  const selAgent=engine.current.agents.find(a=>a.id===selectedId)||null;

      <header className="g-header border-b-2 border-bp-accent2 px-4 py-2.5 flex items-center justify-between sticky top-0 z-40 no-sh">

          {thermalOn && <span className="text-[10px] font-mono font-bold px-2 py-1 border text-bp-wait border-bp-wait">THERMAL</span>}
          {playMode && <span className="text-[10px] font-mono font-bold px-2 py-1 border text-bp-mint border-bp-mint">PLAY</span>}
        </div>
      </header>

        <div className="lg:w-[62%] shrink-0">
          <div className="g-panel border border-bp-line no-sh">
            <div className="flex items-center justify-between px-3 py-2 border-b border-bp-line flex-wrap gap-2">

            {view===1 && <View1 stats={stats} booths={engine.current.booths} engine={engine.current}/>}
            {view===2 && <View2 pushToast={pushToast} bypass={bypass} playMode={playMode} setPlayMode={setPlayMode}
                                stamps={stamps} boothCount={engine.current.booths.length} focusBooth={focusBooth}/>}
            {view===3 && <View3 bypass={bypass} setBypass={setBypass} nudge={nudge} setNudge={setNudge}
                                stats={stats} roi={roiRef.current} predictive={predictive} setPredictive={setPredictive}/>}
            {view===4 && <View4 stats={stats} booths={engine.current.booths} engine={engine.current}/>}
            {view===5 && <View5 pushToast={pushToast} salesRef={salesRef}/>}
            {view===6 && <View6 editMode={editMode} setEditMode={setEditMode} pendingAdd={pendingAdd} setPendingAdd={setPendingAdd}
                                moveId={moveId} setMoveId={setMoveId} editSelId={editSelId} setEditSelId={setEditSelId}
                                onAddArm={armAdd} onDelete={doDelete} onRename={doRename} onCat={doCat} onHot={doHot}
                                onResetLayout={resetLayout} boothCount={engine.current.booths.length} layoutVersion={layoutVersion}/>}
          </div>
        </div>
      </div>

      <Tooltip data={hover}/>

      <div className="fixed bottom-4 right-4 z-50 space-y-2 w-72">
        {toasts.map(t=>(
          <div key={t.id} className={"toast-in border-l-4 g-ink text-white text-[11px] px-3 py-2 no-sh "
            +(t.tone==='mint'?'border-bp-mint':t.tone==='wait'?'border-bp-wait':'border-bp-accent')}>{t.msg}</div>
        ))}
      </div>

      <footer className="text-center text-[9px] text-bp-line py-4 hair">
        ROUTEFINDER · MADE BY DIJKSTRA · DENSE EXPO FLOOR · FLOW-FIELD PATHFINDING · SPATIAL-HASH CROWD · CANVAS RENDER · EDITABLE BOOTHS
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<script>
  (function () {
    var src = document.getElementById('app-src').textContent;
    try {
      var out = Babel.transform(src, {
        presets: [['react', { runtime:'classic' }]], filename:'routefinder.jsx'
      }).code;
      var s = document.createElement('script');
      s.textContent = out;
      document.body.appendChild(s);
    } catch (err) {
      document.getElementById('root').innerHTML =
        '<pre style="padding:16px;color:#e0453b;font-family:monospace">Build error: ' +
        String(err && err.message ? err.message : err) + '</pre>';
    }
  })();
</script>
</body>
</html>

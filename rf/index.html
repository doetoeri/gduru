<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RouteFinder — Large Expo Crowd Simulator</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      colors: { bp: {
        bg:'#eef1f5', panel:'#f7f9fc', silver:'#dfe4ec', grid:'#c8d2df',
        ink:'#1f2733', sub:'#5b6675', line:'#9aa7b8',
        accent:'#2f6fb0', accent2:'#1b4e82', mint:'#12d3b0',
        solo:'#2fae5a', couple:'#8a4fd6', family:'#e08a2b',
        wait:'#e0453b', bypass:'#2f7fd6',
        tech:'#2f6fb0', fnb:'#e08a2b', culture:'#8a4fd6', trend:'#2f9e8f'
      }},
      fontFamily: { mono:['ui-monospace','SFMono-Regular','Menlo','monospace'] }
    }}
  }
</script>
<style>
  * { border-radius: 0 !important; }
  html, body { background:#eef1f5; }
  .hair { letter-spacing:.1em; }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-thumb { background:#9aa7b8; }
  ::-webkit-scrollbar-track { background:#dfe4ec; }
  .blueprint-grid { background-image:
     linear-gradient(rgba(150,167,190,.16) 1px,transparent 1px),
     linear-gradient(90deg,rgba(150,167,190,.16) 1px,transparent 1px);
     background-size:22px 22px; }
  .toast-in { animation: ti .3s cubic-bezier(.2,.9,.3,1); }
  @keyframes ti { from{transform:translateY(12px);opacity:0} to{transform:translateY(0);opacity:1} }
  .pulse-ring { transform-origin:center; animation: pr 1.6s ease-out infinite; }
  @keyframes pr { 0%{transform:scale(.4);opacity:.85} 100%{transform:scale(2.3);opacity:0} }
  input[type=range]{ accent-color:#1b4e82; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/plain" id="app-src">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ============================================================
   DESIGN TOKENS + LOGO + BUTTON  (Figma-bound Silver Blueprint)
   ============================================================ */
const T = {
  bg:'#eef1f5', panel:'#f7f9fc', silver:'#dfe4ec', grid:'#c8d2df',
  ink:'#1f2733', sub:'#5b6675', line:'#9aa7b8',
  accent:'#2f6fb0', accent2:'#1b4e82', mint:'#12d3b0',
  solo:'#2fae5a', couple:'#8a4fd6', family:'#e08a2b',
  wait:'#e0453b', bypass:'#2f7fd6',
  tech:'#2f6fb0', fnb:'#e08a2b', culture:'#8a4fd6', trend:'#2f9e8f'
};
const CAT_COLOR = { Tech:T.tech, 'F&B':T.fnb, Culture:T.culture, Trend:T.trend };

function Logo({ size=32 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 48 48" aria-label="RouteFinder">
      <rect x="2" y="2" width="44" height="44" fill="#f7f9fc" stroke={T.accent2} strokeWidth="2"/>
      <path d="M13 34 L24 10 L35 34" stroke={T.accent} strokeWidth="2.4" fill="none"/>
      <path d="M18 24 L30 24" stroke={T.line} strokeWidth="1.4" strokeDasharray="2 2"/>
      <rect x="20" y="20" width="8" height="8" fill={T.mint} stroke={T.ink} strokeWidth="1.4"/>
      <rect x="22.5" y="22.5" width="3" height="3" fill={T.ink}/>
    </svg>
  );
}

function Btn({ children, onClick, active, tone='default', className='', disabled }) {
  const tones = {
    default: active ? 'bg-bp-accent2 text-white border-bp-accent2'
      : 'bg-bp-panel text-bp-ink border-bp-line hover:border-bp-accent hover:text-bp-accent',
    solid:'bg-bp-accent2 text-white border-bp-accent2 hover:bg-bp-accent',
    ghost:'bg-transparent text-bp-sub border-bp-line hover:text-bp-ink hover:border-bp-ink',
    danger:'bg-white text-bp-wait border-bp-wait hover:bg-bp-wait hover:text-white'
  };
  return (
    <button onClick={onClick} disabled={disabled}
      className={`px-3 py-1.5 text-xs font-semibold border tracking-wide transition-colors
        disabled:opacity-40 disabled:cursor-not-allowed ${tones[tone]} ${className}`}>
      {children}
    </button>
  );
}

/* ============================================================
   LARGE EXPO — 4 halls x 10 booths = 40 booths (open floor, no walls)
   ============================================================ */
const VW = 900, VH = 620;

const HALL_META = {
  1: { code:'A', name:'제1전시관 · 미래 모빌리티 & 로보틱스',
    booths:[
      ['AUTO DRIVE','자율주행 데모','Tech',true],['ROBO ARM','산업 로봇','Tech',false],
      ['DRONE BAY','드론 배송','Tech',false],['EV CHARGE','초고속 충전','Tech',false],
      ['HYDROGEN','수소 모빌리티','Tech',false],['SMART TIRE','스마트 타이어','Trend',false],
      ['AI COCKPIT','AI 콕핏','Tech',true],['MOBILITY CAFE','모빌리티 카페','F&B',false],
      ['TEST TRACK','시승 트랙','Trend',false],['ECO REST','에코 쉼터','Culture',false] ] },
  2: { code:'B', name:'제2전시관 · IT 디바이스 & 스마트 혁신',
    booths:[
      ['SMART PHONE','차세대 폰','Trend',true],['WEARABLE','착용형 기기','Trend',false],
      ['XR STUDIO','확장현실','Tech',true],['CHIP LAB','반도체','Tech',false],
      ['AI CORNER','온디바이스 AI','Tech',false],['SMART HOME','스마트홈','Trend',false],
      ['GAMING RIG','게이밍','Trend',false],['DEV TOOLS','개발 도구','Tech',false],
      ['TECH CAFE','테크 카페','F&B',false],['CHILL ZONE','휴식 존','Culture',false] ] },
  3: { code:'C', name:'제3전시관 · 푸드테크 & 글로벌 고메',
    booths:[
      ['PASTA BOT','3D 로봇 키친','F&B',true],['BARISTA BOT','스마트 커피','F&B',false],
      ['GLOBAL GOURMET','세계 미식','F&B',true],['VEGAN LAB','비건 랩','F&B',false],
      ['DESSERT 3D','3D 디저트','F&B',false],['CRAFT BREW','수제 음료','F&B',false],
      ['STREET FOOD','스트리트 푸드','F&B',false],['SPICE WORLD','향신료관','Trend',false],
      ['FOOD LOUNGE','식음 라운지','Culture',false],['TASTE TECH','미각 테크','Tech',false] ] },
  4: { code:'D', name:'제4전시관 · 미디어아트 & 크리에이티브',
    booths:[
      ['AETHER HALL','인터랙티브 홀','Culture',true],['PROJECTION','프로젝션 맵핑','Culture',false],
      ['SOUND DOME','사운드 아트','Culture',true],['NFT GALLERY','NFT 갤러리','Trend',false],
      ['LIGHT MAZE','라이트 미로','Culture',false],['AR MURAL','AR 벽화','Tech',false],
      ['PHOTO ZONE','포토 존','Trend',false],['VR CINEMA','VR 시네마','Tech',false],
      ['ART CAFE','아트 카페','F&B',false],['ART LOUNGE','미디어 쉼터','Culture',false] ] },
};

// build positioned booths for a hall (5 columns x 2 rows)
function buildBooths(hallId) {
  const meta = HALL_META[hallId];
  const BW=145, BH=170, X0=30, Y0=70, GX=170, GY=290;
  return meta.booths.map((b,i)=>{
    const col=i%5, row=Math.floor(i/5);
    const x=X0+col*GX, y=Y0+row*GY;
    return {
      id:'h'+hallId+'b'+i, x, y, w:BW, h:BH,
      label:b[0], sub:b[1], cat:b[2], hot:b[3],
      cap: b[3]?5:8,
      counter:{ x:x+BW/2, y:y+BH+6 },  // service point (queue forms below)
      color: CAT_COLOR[b[2]],
    };
  });
}

const FACILITIES = [
  {x:VW/2,y:26,label:'ENTRY'},{x:VW/2,y:VH-16,label:'EXIT'},
  {x:24,y:VH/2,label:'WC'},{x:VW-24,y:VH/2,label:'E/V'},
  {x:24,y:26,label:'INFO'},{x:VW-24,y:26,label:'MEDIA'},
];

/* ============================================================
   VISITORS
   ============================================================ */
const COMPANIONS = [
  { key:'solo', ko:'혼자', color:T.solo },
  { key:'couple', ko:'연인', color:T.couple },
  { key:'family', ko:'가족', color:T.family },
];
const PREFS = [
  { ko:'테크', cat:'Tech' }, { ko:'트렌디', cat:'Trend' },
  { ko:'F&B', cat:'F&B' }, { ko:'문화예술', cat:'Culture' },
];

function rnd(){ return Math.random(); }
function pick(arr){ return arr[Math.floor(rnd()*arr.length)]; }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }

function spawnAgents(n) {
  const arr=[];
  for(let i=0;i<n;i++){
    const comp=pick(COMPANIONS), pref=pick(PREFS);
    arr.push({
      id:'V'+String(1000+i),
      x:60+rnd()*(VW-120), y:60+rnd()*(VH-120),
      vx:0, vy:0,
      comp:comp.key, color:comp.color, pref:pref.ko, prefCat:pref.cat,
      patience:Math.floor(45+rnd()*55),
      spd:0.8+rnd()*0.5,
      state:'wander', target:null,
      waitT:0, dwellT:0, dwellMax:0, joinOrder:0,
      servePos:null, roamPt:{x:60+rnd()*(VW-120),y:60+rnd()*(VH-120)},
      accuracy:0.6+rnd()*2.0, dist:0,
      bubble:null, seekTimer:1+rnd()*4,
    });
  }
  return arr;
}

/* need / speech-bubble text */
function needText(a, booths) {
  if(a.state==='queue'){
    const opt=['줄이 좀 기네요','얼마나 기다려야 하죠?','조금 지치네요','앞에 몇 명이지?'];
    return opt[a.id.charCodeAt(4)%opt.length];
  }
  if(a.state==='serve'){
    return a.prefCat==='F&B' ? '오 이거 맛있다!'
      : a.prefCat==='Culture' ? '분위기 좋다'
      : '와 신기하네요';
  }
  if(a.patience<32) return '다리 아파요, 쉬고 싶어';
  if(a.state==='seek' && a.target){
    const b=booths.find(x=>x.id===a.target);
    if(b) return b.label+' 가는 중';
  }
  return ({ 'Tech':'테크 부스 어디예요?', 'F&B':'뭐 좀 먹을까?',
            'Culture':'전시 보러 가자', 'Trend':'요즘 핫한 곳!' })[a.prefCat];
}

/* pick a booth to visit, weighted by preference + popularity */
function chooseBooth(a, booths){
  let total=0; const w=[];
  for(const b of booths){
    let x=1;
    if(b.cat===a.prefCat) x+=3;
    if(b.hot) x+=1.6;
    w.push(x); total+=x;
  }
  let r=rnd()*total;
  for(let i=0;i<booths.length;i++){ r-=w[i]; if(r<=0) return booths[i].id; }
  return booths[0].id;
}

/* ============================================================
   EXPO MAP  (SVG)
   ============================================================ */
function ExpoMap({ hallId, engine, tick, onHover, onSelect, selectedId,
                   playMode, avatarRef, onBgClick, filter }) {
  const booths = engine.booths;
  const agents = engine.agents;
  const av = avatarRef.current;
  const trail = engine.trail;

  return (
    <svg viewBox={`0 0 ${VW} ${VH}`} className="w-full h-full block select-none"
         style={{ background:T.bg }}
         onClick={(e)=>{
           if(e.target.tagName==='svg' || e.target.getAttribute('data-bg')){
             const pt=svgPoint(e); onBgClick(pt);
           }
         }}>
      <defs>
        <pattern id="bp" width="22" height="22" patternUnits="userSpaceOnUse">
          <path d="M22 0 L0 0 0 22" fill="none" stroke={T.grid} strokeWidth=".8" opacity=".6"/>
        </pattern>
      </defs>
      <rect data-bg="1" x="0" y="0" width={VW} height={VH} fill="url(#bp)"/>
      <rect data-bg="1" x="12" y="12" width={VW-24} height={VH-24} fill="none" stroke={T.line} strokeWidth="1.5"/>

      {/* aisles (guide lines, not walls) */}
      <line x1="12" y1={VH/2} x2={VW-12} y2={VH/2} stroke={T.grid} strokeDasharray="4 6"/>
      <line x1={VW/2} y1="12" x2={VW/2} y2={VH-12} stroke={T.grid} strokeDasharray="4 6"/>

      {/* booths (open display zones — no walls) */}
      {booths.map(b=>{
        const dim = filter!=='All' && b.cat!==filter;
        const occ = engine.rt[b.id] || { served:0, queue:0 };
        const load = clamp((occ.served+occ.queue)/(b.cap+6),0,1);
        return (
          <g key={b.id} opacity={dim?0.28:1}>
            <rect x={b.x} y={b.y} width={b.w} height={b.h}
                  fill={b.color} fillOpacity={0.06 + load*0.16}
                  stroke={b.color} strokeWidth="1.5" strokeOpacity="0.7"/>
            {/* category tag */}
            <rect x={b.x} y={b.y} width="40" height="14" fill={b.color}/>
            <text x={b.x+20} y={b.y+10} textAnchor="middle" fontSize="8" fontWeight="700" fill="#fff" className="hair">{b.cat}</text>
            <text x={b.x+b.w/2} y={b.y+b.h/2-4} textAnchor="middle" fontSize="12" fontWeight="800" fill={T.ink} className="hair">{b.label}</text>
            <text x={b.x+b.w/2} y={b.y+b.h/2+11} textAnchor="middle" fontSize="8.5" fill={T.sub}>{b.sub}</text>
            {b.hot && (
              <text x={b.x+b.w/2} y={b.y+b.h/2+25} textAnchor="middle" fontSize="8" fontWeight="700"
                    fill={occ.queue>4?T.wait:T.sub} className="hair">
                {occ.queue>4?'대기 발생':'인기 부스'}
              </text>
            )}
            {/* service counter marker */}
            <rect x={b.counter.x-16} y={b.y+b.h-3} width="32" height="6" fill={b.color}/>
            {/* live occupancy pill */}
            <g>
              <rect x={b.x+b.w-38} y={b.y+2} width="36" height="14" fill="#fff" stroke={T.line} strokeWidth="0.8"/>
              <text x={b.x+b.w-20} y={b.y+12} textAnchor="middle" fontSize="8" fontWeight="700"
                    fill={occ.queue>4?T.wait:T.accent2} className="font-mono">{occ.served}/{occ.queue}</text>
            </g>
          </g>
        );
      })}

      {/* facilities (labels only, no barriers) */}
      {FACILITIES.map((f,i)=>(
        <g key={i}>
          <rect x={f.x-17} y={f.y-9} width="34" height="18" fill={T.silver} stroke={T.line} strokeWidth="1"/>
          <text x={f.x} y={f.y+3} textAnchor="middle" fontSize="8" fontWeight="800" fill={T.accent2} className="hair">{f.label}</text>
        </g>
      ))}

      {/* tracked trail */}
      {selectedId && trail.length>1 && (
        <polyline fill="none" stroke={T.mint} strokeWidth="1.6" strokeOpacity="0.7"
                  points={trail.map(p=>`${p.x},${p.y}`).join(' ')} />
      )}

      {/* AGENTS */}
      <g>
        {agents.map(a=>{
          const isSel = a.id===selectedId;
          let fill=a.color;
          if(a.state==='queue') fill=T.wait;
          else if(a.state==='bypass') fill=T.bypass;
          return (
            <g key={a.id}>
              {isSel && <circle cx={a.x} cy={a.y} r="9" fill="none" stroke={T.mint} strokeWidth="2"/>}
              <circle cx={a.x} cy={a.y} r={isSel?4.4:(a.state==='queue'?3.6:3.2)}
                fill={fill} stroke={isSel?T.mint:'#fff'} strokeWidth={isSel?1.4:0.7}
                onMouseEnter={(e)=>onHover(a,e)} onMouseMove={(e)=>onHover(a,e)}
                onMouseLeave={()=>onHover(null)}
                onClick={(e)=>{ e.stopPropagation(); onSelect(a.id); }}
                style={{cursor:'pointer'}}/>
            </g>
          );
        })}
      </g>

      {/* SPEECH BUBBLES (limited set + tracked) */}
      <g style={{pointerEvents:'none'}}>
        {agents.filter(a=>a.bubble).map(a=>{
          const w = Math.min(150, 22 + a.bubble.length*6.6);
          let bx=a.x-w/2, by=a.y-24;
          bx=clamp(bx,4,VW-w-4); by=clamp(by,4,VH-20);
          const sel=a.id===selectedId;
          return (
            <g key={'b'+a.id}>
              <rect x={bx} y={by} width={w} height="15" fill="#fff"
                    stroke={sel?T.mint:T.line} strokeWidth={sel?1.4:0.8}/>
              <rect x={a.x-3} y={by+13} width="6" height="5" fill="#fff" stroke={sel?T.mint:T.line} strokeWidth="0.6"/>
              <text x={bx+w/2} y={by+11} textAnchor="middle" fontSize="8.5" fill={T.ink}>{a.bubble}</text>
            </g>
          );
        })}
      </g>

      {/* PLAY AVATAR */}
      {playMode && av && (
        <g transform={`translate(${av.x},${av.y})`}>
          <circle r="12" fill="none" stroke={T.mint} strokeWidth="2" className="pulse-ring"/>
          <rect x="-6" y="-6" width="12" height="12" fill={T.mint} stroke={T.ink} strokeWidth="1.6"/>
          <text x="0" y="-12" textAnchor="middle" fontSize="9" fontWeight="800" fill={T.ink} className="hair">YOU</text>
        </g>
      )}
    </svg>
  );
}

function svgPoint(e){
  const svg=e.currentTarget;
  const r=svg.getBoundingClientRect();
  return { x:(e.clientX-r.left)/r.width*VW, y:(e.clientY-r.top)/r.height*VH };
}

/* ============================================================
   HOVER TOOLTIP
   ============================================================ */
function Tooltip({ data, booths }) {
  if(!data) return null;
  const { a,x,y }=data;
  const comp=COMPANIONS.find(c=>c.key===a.comp);
  const st={ wander:'이동 중', seek:'부스로 이동', queue:'대기줄', serve:'관람 중', bypass:'우회 이동', leave:'퇴장 중' }[a.state]||a.state;
  const tb=booths.find(b=>b.id===a.target);
  return (
    <div className="fixed z-50 pointer-events-none" style={{ left:x+14, top:y+14 }}>
      <div className="bg-bp-ink text-white text-[11px] w-52 border border-bp-accent shadow-xl">
        <div className="px-2.5 py-1.5 bg-bp-accent2 flex justify-between">
          <span className="font-mono font-bold">{a.id}</span>
          <span style={{color:comp.color}}>● {comp.ko}</span>
        </div>
        <div className="px-2.5 py-2 space-y-1">
          <Row k="선호" v={a.pref}/>
          <Row k="상태" v={st}/>
          {tb && <Row k="목적 부스" v={tb.label}/>}
          <Row k="인내심" v={`${Math.round(a.patience)}/100`}/>
          <div className="mt-1.5 pt-1.5 border-t border-white/20">
            <Row k="측위 오차" v={`± ${a.accuracy.toFixed(2)} m`}/>
          </div>
          <div className="text-[9px] text-bp-mint mt-1">클릭하면 이 관람객을 추적합니다</div>
        </div>
      </div>
    </div>
  );
}
function Row({k,v}){ return <div className="flex justify-between"><span className="text-bp-line">{k}</span><span className="font-mono">{v}</span></div>; }

/* ============================================================
   TRACKING PANEL
   ============================================================ */
function TrackPanel({ agent, booths, onClear }) {
  if(!agent) return null;
  const comp=COMPANIONS.find(c=>c.key===agent.comp);
  const tb=booths.find(b=>b.id===agent.target);
  const st={ wander:'자유 이동', seek:'부스로 이동', queue:'대기줄 대기', serve:'부스 관람', bypass:'우회 이동', leave:'퇴장 중' }[agent.state]||agent.state;
  return (
    <div className="bg-white border-2 border-bp-mint mb-3">
      <div className="flex items-center justify-between px-3 py-2 bg-bp-mint/15 border-b border-bp-mint">
        <span className="text-[11px] hair font-bold text-bp-ink">개인 추적 · {agent.id}</span>
        <button onClick={onClear} className="text-[10px] hair font-bold text-bp-sub hover:text-bp-wait border border-bp-line px-2 py-0.5">해제</button>
      </div>
      <div className="p-3 grid grid-cols-2 gap-2 text-[11px]">
        <TInfo k="동반 유형" v={comp.ko} c={comp.color}/>
        <TInfo k="관람 선호" v={agent.pref}/>
        <TInfo k="현재 상태" v={st}/>
        <TInfo k="목적 부스" v={tb?tb.label:'-'}/>
        <TInfo k="대기 시간" v={`${agent.waitT.toFixed(1)} s`}/>
        <TInfo k="관람 시간" v={`${agent.dwellT.toFixed(1)} s`}/>
        <TInfo k="이동 거리" v={`${Math.round(agent.dist)} px`}/>
        <TInfo k="측위 오차" v={`± ${agent.accuracy.toFixed(2)} m`}/>
      </div>
      <div className="px-3 pb-3">

/* ============================================================
   ROOT APP
   ============================================================ */
function App() {
  const [hallId,setHallId]=useState(1);
  const [view,setView]=useState(1);
  const [bypass,setBypass]=useState(false);
  const [nudge,setNudge]=useState(60);
  const [predictive,setPredictive]=useState(false);
  const [hover,setHover]=useState(null);
  const [selectedId,setSelectedId]=useState(null);
  const [toasts,setToasts]=useState([]);
  const [tick,setTick]=useState(0);
  const [stats,setStats]=useState({ total:0,cong:40,L:0,W:0,lambda:0,edge:45 });
  const [speed,setSpeed]=useState(1);
  const [pop,setPop]=useState(110);
  const [playMode,setPlayMode]=useState(false);
  const [filter,setFilter]=useState('All');
  const [stamps,setStamps]=useState(0);

  // engine holds mutable simulation state (no re-render on mutation)
  const engine=useRef({ agents:[], booths:[], rt:{}, trail:[], order:0 });
  const avatarRef=useRef({ x:VW/2, y:VH-60, vx:0, vy:0, target:null, stamped:{} });
  const keys=useRef({});
  const roiRef=useRef({ savedMin:0, revenue:0 });
  const salesRef=useRef({ month:4820000 });
  const speedRef=useRef(speed), bypassRef=useRef(bypass), nudgeRef=useRef(nudge), playRef=useRef(playMode), selRef=useRef(selectedId);
  const toastId=useRef(0), bubbleAcc=useRef(0), trailAcc=useRef(0);

  useEffect(()=>{speedRef.current=speed;},[speed]);
  useEffect(()=>{bypassRef.current=bypass;},[bypass]);
  useEffect(()=>{nudgeRef.current=nudge;},[nudge]);
  useEffect(()=>{playRef.current=playMode;},[playMode]);
  useEffect(()=>{selRef.current=selectedId;},[selectedId]);

  // (re)build hall
  const rebuild=useCallback((hid,n)=>{
    engine.current.booths=buildBooths(hid);
    engine.current.agents=spawnAgents(n);
    engine.current.rt={}; engine.current.trail=[]; engine.current.order=0;
    engine.current.booths.forEach(b=>engine.current.rt[b.id]={served:0,queue:0});
    avatarRef.current={ x:VW/2, y:VH-60, vx:0, vy:0, target:null, stamped:{} };
    setStamps(0); setSelectedId(null);
  },[]);

  useEffect(()=>{ rebuild(hallId,pop); /* eslint-disable-next-line */ },[hallId]);
  useEffect(()=>{ rebuild(hallId,pop); /* eslint-disable-next-line */ },[pop]);

  const pushToast=useCallback((msg,tone='accent')=>{
    const id=++toastId.current;
    setToasts(t=>[...t,{id,msg,tone}]);
    setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),3400);
  },[]);
  const onHover=useCallback((a,e)=>{ if(!a){setHover(null);return;} setHover({a,x:e.clientX,y:e.clientY}); },[]);
  const onSelect=useCallback((id)=>{ setSelectedId(id); if(view!==1&&view!==2){} },[view]);
  const onBgClick=useCallback((pt)=>{ if(playRef.current){ avatarRef.current.target={...pt}; } },[]);

  // keyboard for play mode
  useEffect(()=>{
    const dn=(e)=>{ const k=e.key.toLowerCase(); if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){ keys.current[k]=true; if(playRef.current) e.preventDefault(); } };
    const up=(e)=>{ keys.current[e.key.toLowerCase()]=false; };
    window.addEventListener('keydown',dn); window.addEventListener('keyup',up);
    return ()=>{ window.removeEventListener('keydown',dn); window.removeEventListener('keyup',up); };
  },[]);

  // ===== simulation loop =====
  useEffect(()=>{
    let raf, last=0, statAcc=0;
    const step=(ts)=>{
      let dt=(ts-last)/1000; last=ts; if(dt>0.05)dt=0.05;
      const sdt=dt*speedRef.current;
      const E=engine.current, booths=E.booths, agents=E.agents;
      const bp=bypassRef.current, nudgeP=nudgeRef.current/100;
      const R=12, SEP=90, DES=52; // sep radius, sep weight, desired speed px/s

      // recompute per-booth served / queued
      const served={}, queued={};
      booths.forEach(b=>{ served[b.id]=0; queued[b.id]=[]; });
      for(const a of agents){
        if(a.state==='serve'&&a.target) served[a.target]++;
        else if(a.state==='queue'&&a.target) queued[a.target].push(a);
      }
      const slots={};
      booths.forEach(b=>{ slots[b.id]=b.cap-served[b.id]; queued[b.id].sort((p,q)=>p.joinOrder-q.joinOrder); });
      // promote fronts of queues into service
      let arrivalsThisFrame=0;
      booths.forEach(b=>{
        let s=slots[b.id];
        for(const a of queued[b.id]){
          if(s>0){ a.state='serve'; a.dwellT=0; a.dwellMax=(b.hot?9:6)+rnd()*6; a.servePos={x:b.x+16+rnd()*(b.w-32),y:b.y+22+rnd()*(b.h-44)}; s--; arrivalsThisFrame++; }
          else break;
        }
        slots[b.id]=s;
      });

      // main per-agent update
      for(const a of agents){
        const b = a.target ? booths.find(x=>x.id===a.target) : null;
        // choose waypoint by state
        let wx,wy, ds=DES*a.spd;
        if(a.state==='wander'){
          a.seekTimer-=sdt;
          const dx=a.roamPt.x-a.x, dy=a.roamPt.y-a.y;
          if(Math.hypot(dx,dy)<24){ a.roamPt={x:40+rnd()*(VW-80),y:40+rnd()*(VH-80)}; }
          wx=a.roamPt.x; wy=a.roamPt.y; ds*=0.7;
          if(a.seekTimer<=0){ a.state='seek'; a.target=chooseBooth(a,booths); }
        } else if(a.state==='seek'){
          const c=b?b.counter:{x:VW/2,y:VH/2}; wx=c.x; wy=c.y;
          if(b){
            // bypass: if heading to a hot booth with a long queue, maybe divert
            if(bp && b.hot && queued[b.id].length>4 && a.state!=='bypass'){
              if(rnd() < 0.012*nudgeP*3){
                const alt=booths.filter(x=>x.cat===b.cat && !x.hot);
                if(alt.length){ a.target=pick(alt).id; a.state='bypass'; }
              }
            }
            if(Math.hypot(wx-a.x,wy-a.y)<20){
              if(slots[b.id]>0){ a.state='serve'; a.dwellT=0; a.dwellMax=(b.hot?9:6)+rnd()*6; slots[b.id]--; a.servePos={x:b.x+16+rnd()*(b.w-32),y:b.y+22+rnd()*(b.h-44)}; arrivalsThisFrame++; }
              else { a.state='queue'; a.joinOrder=E.order++; a.waitT=0; }
            }
          }
        } else if(a.state==='bypass'){
          const c=b?b.counter:{x:VW/2,y:VH/2}; wx=c.x; wy=c.y;
          if(b && Math.hypot(wx-a.x,wy-a.y)<20){
            if(slots[b.id]>0){ a.state='serve'; a.dwellT=0; a.dwellMax=(b.hot?9:6)+rnd()*6; slots[b.id]--; a.servePos={x:b.x+16+rnd()*(b.w-32),y:b.y+22+rnd()*(b.h-44)}; }
            else { a.state='queue'; a.joinOrder=E.order++; a.waitT=0; }
          }
        } else if(a.state==='queue'){
          a.waitT+=sdt;
          const idx=queued[b?b.id:'']? queued[b.id].indexOf(a):0;
          const c=b?b.counter:{x:VW/2,y:VH/2};
          wx=c.x + ((idx%2)?1:-1)*Math.ceil(idx/2)*0; // single-file line
          wx=c.x; wy=c.y + 12 + Math.max(0,idx)*15;
          ds*=0.5;
          // patience: leave the queue if waited too long
          if(a.waitT > a.patience*0.35){
            if(bp){ const alt=booths.filter(x=>x.cat===(b?b.cat:'Tech') && !x.hot); if(alt.length){ a.target=pick(alt).id; a.state='bypass'; } else { a.state='wander'; a.target=null; a.seekTimer=1+rnd()*3; } }
            else { a.state='wander'; a.target=null; a.seekTimer=1+rnd()*3; }
            a.patience=clamp(a.patience-6,10,100);
          }
        } else if(a.state==='serve'){
          a.dwellT+=sdt;
          const sp=a.servePos||(b?b.counter:{x:VW/2,y:VH/2}); wx=sp.x; wy=sp.y; ds*=0.35;
          if(a.dwellT>=a.dwellMax){ a.state='leave'; a.leavePt={x:40+rnd()*(VW-80),y:40+rnd()*(VH-80)}; a.patience=clamp(a.patience-4,8,100); }
        } else if(a.state==='leave'){
          const lp=a.leavePt||{x:VW/2,y:VH/2}; wx=lp.x; wy=lp.y;
          if(Math.hypot(wx-a.x,wy-a.y)<26){ a.state='wander'; a.target=null; a.seekTimer=0.8+rnd()*3.5; a.roamPt={x:40+rnd()*(VW-80),y:40+rnd()*(VH-80)}; }
        }

        // steering toward waypoint
        let dx=wx-a.x, dy=wy-a.y; const dd=Math.hypot(dx,dy)||1;
        let sx=(dx/dd)*ds, sy=(dy/dd)*ds;
        if(dd<6){ sx*=dd/6; sy*=dd/6; }
        a._sx=sx; a._sy=sy;
      }

      // separation pass (no overlap) — O(n^2), n~110
      for(let i=0;i<agents.length;i++){
        const a=agents[i]; let px=0,py=0;
        for(let j=0;j<agents.length;j++){
          if(i===j)continue; const o=agents[j];
          const dx=a.x-o.x, dy=a.y-o.y; const d2=dx*dx+dy*dy;
          if(d2<R*R && d2>0.0001){ const d=Math.sqrt(d2); const f=(R-d)/R; px+=(dx/d)*f; py+=(dy/d)*f; }
        }
        // avatar pushes crowd a bit
        if(playRef.current){ const av=avatarRef.current; const dx=a.x-av.x,dy=a.y-av.y,d2=dx*dx+dy*dy; if(d2<(R+6)*(R+6)&&d2>0.01){ const d=Math.sqrt(d2); const f=(R+6-d)/(R+6); px+=(dx/d)*f*1.4; py+=(dy/d)*f*1.4; } }
        a._px=px*SEP; a._py=py*SEP;
      }

      // integrate
      for(const a of agents){
        let vx=a._sx + a._px, vy=a._sy + a._py;
        const mag=Math.hypot(vx,vy); const maxV=DES*1.7;
        if(mag>maxV){ vx=vx/mag*maxV; vy=vy/mag*maxV; }
        const nx=clamp(a.x+vx*sdt,16,VW-16), ny=clamp(a.y+vy*sdt,16,VH-16);
        a.dist+=Math.hypot(nx-a.x,ny-a.y);
        a.x=nx; a.y=ny; a.vx=vx; a.vy=vy;
      }

      // avatar (play mode)
      if(playRef.current){
        const av=avatarRef.current; let ax=0,ay=0;
        if(keys.current['w']||keys.current['arrowup'])ay-=1;
        if(keys.current['s']||keys.current['arrowdown'])ay+=1;
        if(keys.current['a']||keys.current['arrowleft'])ax-=1;
        if(keys.current['d']||keys.current['arrowright'])ax+=1;
        if(ax||ay){ av.target=null; const m=Math.hypot(ax,ay); ax/=m; ay/=m; }
        else if(av.target){ const dx=av.target.x-av.x,dy=av.target.y-av.y,d=Math.hypot(dx,dy); if(d>4){ax=dx/d;ay=dy/d;}else av.target=null; }
        const AV=140*speedRef.current;
        av.x=clamp(av.x+ax*AV*dt,14,VW-14); av.y=clamp(av.y+ay*AV*dt,14,VH-14);
        // stamp rally
        for(const b of booths){
          if(av.stamped[b.id])continue;
          if(Math.hypot(av.x-b.counter.x, av.y-b.counter.y)<34){
            av.stamped[b.id]=true; const n=Object.keys(av.stamped).length;
            setStamps(n); pushToast(`${b.label} 스탬프 획득! (${n}/${booths.length})`,'mint');
          }
        }
      }

      // speech bubbles: refresh a small rotating set (+tracked)
      bubbleAcc.current+=dt;
      if(bubbleAcc.current>0.9){
        bubbleAcc.current=0;
        agents.forEach(a=>a.bubble=null);
        const talkers=[];
        for(let k=0;k<6 && agents.length;k++) talkers.push(agents[Math.floor(rnd()*agents.length)]);
        talkers.forEach(a=>{ a.bubble=needText(a,booths); });
        const sel=agents.find(a=>a.id===selRef.current); if(sel) sel.bubble=needText(sel,booths);
      }

      // tracked trail
      const sel=agents.find(a=>a.id===selRef.current);
      trailAcc.current+=dt;
      if(sel){ if(trailAcc.current>0.12){ trailAcc.current=0; E.trail.push({x:sel.x,y:sel.y}); if(E.trail.length>70)E.trail.shift(); } }
      else if(E.trail.length){ E.trail=[]; }

      // update runtime occupancy for rendering
      booths.forEach(b=>{ E.rt[b.id]={served:served[b.id]+ (slots[b.id]<b.cap? (b.cap-slots[b.id]-served[b.id]):0), queue:queued[b.id].length}; });
      // simpler served: recount
      const s2={},q2={};
      booths.forEach(b=>{s2[b.id]=0;q2[b.id]=0;});
      for(const a of agents){ if(a.state==='serve'&&a.target)s2[a.target]++; else if(a.state==='queue'&&a.target)q2[a.target]++; }
      booths.forEach(b=>{ E.rt[b.id]={served:s2[b.id],queue:q2[b.id]}; });

      // stats
      statAcc+=dt;
      if(statAcc>0.25){
        statAcc=0;
        let L=0,servedTot=0; booths.forEach(b=>{ L+=q2[b.id]; servedTot+=s2[b.id]; });
        const total=agents.length;
        const lambda = clamp((bp? total/26*(1-0.28*nudgeP) : total/26), 1, 30);
        const W = lambda>0 ? L/lambda : 0;
        const cong = clamp(30 + (L+servedTot)/total*70 - (bp?8:0) + (Math.sin(ts/4000)*2), 25, 82);
        const edge = clamp(cong*0.85 + (bp?-4:2) + Math.sin(ts/2500)*4, 20, 92);
        setStats({ total, cong, L, W, lambda, edge });
        if(bp){ roiRef.current.savedMin += (0.15+rnd()*0.4)*nudgeP; roiRef.current.revenue += Math.floor((1+rnd()*2)*nudgeRef.current*1.2); }
      }

      setTick(t=>(t+1)%1000000);
      raf=requestAnimationFrame(step);
    };
    raf=requestAnimationFrame(step);
    return ()=>cancelAnimationFrame(raf);
  },[]); // eslint-disable-line

  const selAgent = engine.current.agents.find(a=>a.id===selectedId)||null;
  const viewTabs=[{id:1,ko:'관제 대시보드'},{id:2,ko:'가이드/플레이'},{id:3,ko:'B2B 관제판'},{id:4,ko:'데이터 마켓'}];

  return (
    <div className="min-h-screen bg-bp-bg text-bp-ink blueprint-grid">
      <header className="bg-bp-panel border-b-2 border-bp-accent2 px-4 py-2.5 flex items-center justify-between sticky top-0 z-40">
        <div className="flex items-center gap-3">
          <Logo size={32}/>
          <div><div className="text-lg font-bold hair leading-none">ROUTEFINDER</div>
          <div className="text-[9px] hair text-bp-sub uppercase">Large Expo Crowd Simulator · 4 Halls · 40 Booths</div></div>
        </div>
        <div className="flex items-center gap-3">
          <span className={`text-[10px] font-mono font-bold px-2 py-1 border ${bypass?'text-bp-bypass border-bp-bypass':'text-bp-sub border-bp-line'}`}>BYPASS {bypass?'ON':'OFF'}</span>
          {playMode && <span className="text-[10px] font-mono font-bold px-2 py-1 border text-bp-mint border-bp-mint">PLAY MODE</span>}
        </div>
      </header>

      <div className="flex flex-col lg:flex-row gap-3 p-3 max-w-[1600px] mx-auto">
        {/* LEFT: map */}
        <div className="lg:w-[60%] shrink-0">
          <div className="bg-bp-panel border border-bp-line">
            <div className="flex items-center justify-between px-3 py-2 border-b border-bp-line flex-wrap gap-2">
              <span className="text-[11px] hair font-bold uppercase">실시간 전시관 지도</span>
              <div className="flex gap-1">{[1,2,3,4].map(h=><Btn key={h} active={hallId===h} onClick={()=>setHallId(h)}>{HALL_META[h].code} · {h}관</Btn>)}</div>
            </div>
            <div className="px-3 py-2 border-b border-bp-line flex items-center justify-between flex-wrap gap-2">
              <span className="text-[11px] font-bold text-bp-accent2">{HALL_META[hallId].name}</span>
              <div className="flex items-center gap-3 flex-wrap">
                <label className="flex items-center gap-1.5 text-[10px] hair text-bp-sub">속도
                  <input type="range" min="0.25" max="3" step="0.25" value={speed} onChange={e=>setSpeed(parseFloat(e.target.value))} className="w-24"/>
                  <span className="font-mono font-bold text-bp-ink w-8">{speed}x</span></label>
                <label className="flex items-center gap-1.5 text-[10px] hair text-bp-sub">인원
                  <input type="range" min="40" max="150" step="10" value={pop} onChange={e=>setPop(parseInt(e.target.value))} className="w-24"/>
                  <span className="font-mono font-bold text-bp-ink w-8">{pop}</span></label>
                <div className="flex gap-1">{['All','F&B','Tech','Culture'].map(c=><Btn key={c} active={filter===c} onClick={()=>setFilter(c)}>{c}</Btn>)}</div>
              </div>
            </div>
            <div className="aspect-[900/620] w-full">
              <ExpoMap hallId={hallId} engine={engine.current} tick={tick} onHover={onHover}
                       onSelect={onSelect} selectedId={selectedId} playMode={playMode}
                       avatarRef={avatarRef} onBgClick={onBgClick} filter={filter}/>
            </div>
            <div className="px-3 py-2 border-t border-bp-line flex flex-wrap gap-x-4 gap-y-1 text-[10px] text-bp-sub">
              <Legend c={T.solo} t="혼자"/><Legend c={T.couple} t="연인"/><Legend c={T.family} t="가족"/>
              <Legend c={T.wait} t="대기줄"/><Legend c={T.bypass} t="우회"/><Legend c={T.mint} t="추적/내 위치"/>
              <span className="text-bp-line">도트 클릭 = 개인 추적 · 지도 클릭 = 플레이 이동</span>
            </div>
          </div>
        </div>

        {/* RIGHT */}
        <div className="flex-1 min-w-0">
          <TrackPanel agent={selAgent} booths={engine.current.booths} onClear={()=>setSelectedId(null)}/>
          <div className="grid grid-cols-4 gap-1 mb-3">
            {viewTabs.map(t=><Btn key={t.id} active={view===t.id} onClick={()=>setView(t.id)} className="py-2">{t.ko}</Btn>)}
          </div>
          <div className="bg-bp-panel border border-bp-line p-3">
            {view===1 && <View1 stats={stats} booths={engine.current.booths} engine={engine.current}/>}
            {view===2 && <View2 setHallId={setHallId} pushToast={pushToast} bypass={bypass}
                                playMode={playMode} setPlayMode={setPlayMode} stamps={stamps} boothCount={engine.current.booths.length||10}/>}
            {view===3 && <View3 bypass={bypass} setBypass={setBypass} nudge={nudge} setNudge={setNudge}
                                stats={stats} roi={roiRef.current} predictive={predictive} setPredictive={setPredictive}/>}
            {view===4 && <View4 pushToast={pushToast} salesRef={salesRef}/>}
          </div>
        </div>
      </div>

      <Tooltip data={hover} booths={engine.current.booths}/>

      <div className="fixed bottom-4 right-4 z-50 space-y-2 w-72">
        {toasts.map(t=>(
          <div key={t.id} className={`toast-in border-l-4 bg-bp-ink text-white text-[11px] px-3 py-2 shadow-xl
            ${t.tone==='mint'?'border-bp-mint':t.tone==='wait'?'border-bp-wait':'border-bp-accent'}`}>{t.msg}</div>
        ))}
      </div>

      <footer className="text-center text-[9px] text-bp-line py-4 hair">
        ROUTEFINDER · SINGLE-FILE · 40 BOOTHS · CROWD SEPARATION · QUEUE &amp; DWELL · PERSONAL TRACKING · PLAY MODE
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>

<script>
  /* Inline JSX compilation — classic runtime (React.createElement), no ESM imports */
  (function () {
    var src = document.getElementById('app-src').textContent;
    try {
      var out = Babel.transform(src, {
        presets: [['react', { runtime:'classic' }]], filename:'routefinder.jsx'
      }).code;
      var s = document.createElement('script');
      s.textContent = out;
      document.body.appendChild(s);
    } catch (err) {
      document.getElementById('root').innerHTML =
        '<pre style="padding:16px;color:#e0453b;font-family:monospace">Build error: ' +
        String(err && err.message ? err.message : err) + '</pre>';
    }
  })();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹 보조 모니터</title>
    <style>
        body {
            margin: 0; background-color: #111; color: #fff;
            font-family: sans-serif; height: 100vh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }
        #container { text-align: center; max-width: 400px; padding: 20px; background: #222; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        button {
            padding: 15px 30px; font-size: 18px; margin: 12px 0;
            border: none; border-radius: 8px; cursor: pointer;
            color: white; width: 100%; font-weight: bold;
            transition: background 0.2s;
        }
        #tabletBtn { background-color: #28a745; }
        #tabletBtn:hover { background-color: #218838; }
        #chromebookBtn { background-color: #007bff; }
        #chromebookBtn:hover { background-color: #0056b3; }
        #statusMessage { margin-top: 15px; color: #ffc107; font-size: 14px; }
        video { width: 100vw; height: 100vh; object-fit: contain; display: none; background: #000; }
    </style>
    <!-- 연결을 도와주는 안전한 라이브러리 로드 -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div id="container">
        <h2>🖥️ 웹 보조 모니터</h2>
        <p><strong>1단계:</strong> 태블릿에서 먼저 누르세요.</p>
        <button id="tabletBtn">📱 태블릿 (화면 받기)</button>
        
        <p style="margin-top: 25px;"><strong>2단계:</strong> 크롬북에서 누르세요.</p>
        <button id="chromebookBtn">💻 크롬북 (화면 보내기)</button>

        <div id="statusMessage">현재 대기 중...</div>
    </div>

    <video id="remoteVideo" autoplay playsinline controls></video>

    <script>
        // 무작위 연결 주소 생성 방지용 고유 ID 고정
        const ROOM_ID = 'chromebook-tablet-dual-monitor-screen';
        const videoElement = document.getElementById('remoteVideo');
        const container = document.getElementById('container');
        const statusMessage = document.getElementById('statusMessage');

        // 📱 태블릿 (화면 수신측) 로직
        document.getElementById('tabletBtn').addEventListener('click', () => {
            statusMessage.innerText = "태블릿 서버 연결 중...";
            const peer = new Peer(ROOM_ID);
            
            peer.on('open', (id) => {
                statusMessage.innerHTML = "✅ 태블릿 대기 모드 작동 중!<br>이제 <strong>크롬북</strong>에서 보내기 버튼을 누르세요.";
                document.getElementById('tabletBtn').style.opacity = "0.5";
            });

            // 크롬북에서 신호(영상 스트림)가 들어오면 수신
            peer.on('call', (call) => {
                statusMessage.innerText = "연결 성공! 화면을 가져옵니다.";
                call.answer(); 
                call.on('stream', (remoteStream) => {
                    container.style.display = 'none';
                    videoElement.style.display = 'block';
                    videoElement.srcObject = remoteStream;
                });
            });

            peer.on('error', (err) => {
                alert("태블릿 오류 발생: " + err.type + "\n이미 태블릿 버튼이 눌려있을 수 있습니다. 새로고침 후 다시 하세요.");
            });
        });

        // 💻 크롬북 (화면 송신측) 로직
        document.getElementById('chromebookBtn').addEventListener('click', () => {
            statusMessage.innerText = "크롬북 연결 준비 중...";
            // 송신자는 랜덤 ID로 생성해 중복 회피
            const peer = new Peer();

            peer.on('open', async (id) => {
                try {
                    statusMessage.innerText = "화면 공유 권한 요청 중...";
                    // 크롬북 전체 화면 캡처 권한창 띄우기
                    const stream = await navigator.mediaDevices.getDisplayMedia({
                        video: { width: { ideal: 1920 }, height: { ideal: 1080 } },
                        audio: false
                    });
                    
                    statusMessage.innerText = "태블릿으로 화면 전송 중입니다!";
                    
                    // 지정된 태블릿 ID로 화면 연결 쏘기
                    peer.call(ROOM_ID, stream);
                    
                } catch (err) {
                    alert("화면 가져오기 실패: " + err.message + "\n권한을 허용해야 합니다.");
                    statusMessage.innerText = "연결 실패";
                }
            });

            peer.on('error', (err) => {
                alert("크롬북 연결 오류: " + err.type);
            });
        });
    </script>
</body>
</html>

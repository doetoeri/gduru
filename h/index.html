<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로컬 웹 보조 모니터 (서버 없음)</title>
    <style>
        body {
            margin: 0; background-color: #111; color: #fff;
            font-family: sans-serif; height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        #container { text-align: center; max-width: 450px; padding: 25px; background: #222; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        textarea { width: 90%; height: 100px; margin: 10px 0; background: #333; color: #fff; border: 1px solid #555; border-radius: 6px; padding: 8px; font-family: monospace; font-size: 11px; word-break: break-all; }
        button { padding: 13px 20px; font-size: 16px; margin: 8px 0; border: none; border-radius: 8px; cursor: pointer; color: white; width: 100%; font-weight: bold; }
        #tabletBtn { background-color: #28a745; }
        #chromebookBtn { background-color: #007bff; }
        #connectBtn { background-color: #ffc107; color: #111; }
        #status { margin-top: 15px; color: #ffc107; font-size: 13px; line-height: 1.4; }
        video { width: 100vw; height: 100vh; object-fit: contain; display: none; background: #000; }
    </style>
</head>
<body>

    <div id="container">
        <h2>🖥️ 로컬 웹 보조 모니터</h2>
        <div id="status">원하는 모드를 선택하세요.</div>
        
        <button id="tabletBtn">📱 1. 태블릿 모드 (화면 받기)</button>
        <button id="chromebookBtn">💻 2. 크롬북 모드 (화면 보내기)</button>

        <!-- 신호 교환을 위한 텍스트 상자 영역 -->
        <div id="sdpArea" style="display:none; margin-top:15px;">
            <p id="stepTitle" style="font-weight:bold; color:#00ff00;"></p>
            <textarea id="myCode" readonly placeholder="여기에 연결 코드가 생성됩니다."></textarea>
            <p style="margin: 5px 0;">👇 상대방의 코드를 아래에 붙여넣으세요 👇</p>
            <textarea id="targetCode" placeholder="상대방 기기의 코드를 복사해서 여기에 붙여넣으세요."></textarea>
            <button id="connectBtn">연결 코드 등록하기</button>
        </div>
    </div>

    <video id="remoteVideo" autoplay playsinline controls></video>

    <script>
        let pc = new RTCPeerConnection({ iceServers: [] }); // 외부 서버 없이 로컬 연결
        const videoElement = document.getElementById('remoteVideo');
        const container = document.getElementById('container');
        const status = document.getElementById('status');
        const sdpArea = document.getElementById('sdpArea');
        const myCode = document.getElementById('myCode');
        const targetCode = document.getElementById('targetCode');
        const stepTitle = document.getElementById('stepTitle');
        let isChromebook = false;

        // 📱 태블릿 모드 시작
        document.getElementById('tabletBtn').addEventListener('click', async () => {
            isChromebook = false;
            document.getElementById('tabletBtn').style.display = 'none';
            document.getElementById('chromebookBtn').style.display = 'none';
            sdpArea.style.display = 'block';
            stepTitle.innerText = "태블릿 준비 단계 (2단계 진행)";
            status.innerText = "크롬북이 줄 '초대 코드'를 아래에 붙여넣고 버튼을 누르세요.";

            // 영상 신호 수신 대기 설정
            pc.ontrack = (event) => {
                container.style.display = 'none';
                videoElement.style.display = 'block';
                videoElement.srcObject = event.streams[0];
            };
        });

        // 💻 크롬북 모드 시작
        document.getElementById('chromebookBtn').addEventListener('click', async () => {
            isChromebook = true;
            document.getElementById('tabletBtn').style.display = 'none';
            document.getElementById('chromebookBtn').style.display = 'none';
            sdpArea.style.display = 'block';
            stepTitle.innerText = "크롬북 준비 단계 (1단계 진행)";
            status.innerText = "화면 권한 허용 후, 생성된 '초대 코드'를 태블릿에 전달하세요.";

            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
                stream.getTracks().forEach(track => pc.addTrack(track, stream));

                // 연결 제안(Offer) 생성
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                // 연결 주소가 확정될 때까지 아주 잠시 대기 후 코드 출력
                pc.onicecandidate = (e) => {
                    if (!e.candidate) {
                        myCode.value = btoa(JSON.stringify(pc.localDescription));
                        myCode.select();
                        status.innerText = "위 상자의 코드를 복사해서 [태블릿]의 아래 칸에 붙여넣으세요.";
                    }
                };
            } catch (err) {
                alert("화면 공유 실패: " + err.message);
            }
        });

        // 코드 교환 및 연결 완료 버튼 클릭 시
        document.getElementById('connectBtn').addEventListener('click', async () => {
            const input = targetCode.value.trim();
            if (!input) return alert("코드가 비어있습니다!");

            try {
                const remoteDesc = new RTCSessionDescription(JSON.parse(atob(input)));
                await pc.setRemoteDescription(remoteDesc);

                // 태블릿일 경우, 응답(Answer) 코드를 생성해서 크롬북에 돌려줘야 함
                if (!isChromebook) {
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    
                    pc.onicecandidate = (e) => {
                        if (!e.candidate) {
                            myCode.value = btoa(JSON.stringify(pc.localDescription));
                            myCode.select();
                            stepTitle.innerText = "태블릿 준비 단계 (3단계 진행)";
                            status.innerText = "새로 생성된 위의 '수락 코드'를 복사해서 [크롬북] 아래 칸에 붙여넣으세요.";
                            targetCode.value = "";
                        }
                    };
                } else {
                    status.innerText = "연결이 완료되었습니다! 화면이 켜집니다.";
                }
            } catch (err) {
                alert("연결 코드 오류! 코드가 정확히 복사되었는지 확인하세요.");
            }
        });
    </script>
</body>
</html>

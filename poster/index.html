

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pressroom / Poster Lab</title>
<style>
:root{--room:#fcfcfa;--surface:#f7f5ef;--paper:#f3eee3;--ink:#111;--muted:#62666d;--rule:#cbd0d8;--soft:#e4e6e8;--blue:#2457ff;--pink:#ef2b7a;--cyan:#16bceb;--yellow:#f4d52d}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--room);color:var(--ink);font-family:"Arial Narrow",Arial,sans-serif}button,input,select{font:inherit}.app{min-height:100vh;padding:18px 22px 12px;display:grid;grid-template-rows:56px minmax(560px,1fr) 94px 22px;gap:10px;background:radial-gradient(circle at 54% 40%,#fff 0,#fcfcfa 52%,#eef0ec 100%)}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #777;padding:0 8px}h1{margin:0;font-size:clamp(20px,1.7vw,27px);letter-spacing:-.045em}.meta{display:flex;gap:22px;align-items:center;font:11px monospace;letter-spacing:.12em}.meta i{width:1px;height:22px;background:#888}.workspace{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(305px,340px);gap:14px}.table{position:relative;min-height:560px;overflow:hidden;border:1px solid #bfc4cb;background:radial-gradient(circle at 53% 43%,#fff 0,#fcfcf8 53%,#eef0ea 100%);box-shadow:inset 0 1px #fff,0 6px 24px #353b440f}.ruler{position:absolute;z-index:6;border:1px solid #adb6c05e;background-color:#ffffff8c;box-shadow:inset 0 1px #fff,0 2px 5px #323c4617;font:8px monospace;color:#5f6268}.top{left:38px;right:0;top:0;height:32px;display:flex;justify-content:space-around;padding-top:4px;background-image:repeating-linear-gradient(90deg,transparent 0 3px,#49505a57 3px 4px,transparent 4px 8px);background-size:auto 10px;background-position:left bottom;background-repeat:repeat-x}.left{left:0;top:32px;bottom:0;width:38px;display:flex;flex-direction:column;align-items:center;justify-content:space-around;background-image:repeating-linear-gradient(180deg,transparent 0 3px,#49505a57 3px 4px,transparent 4px 8px);background-size:10px auto;background-position:right top;background-repeat:repeat-y}.drop{position:absolute;inset:32px 0 40px 38px;display:grid;place-items:center;transition:.12s}.drop.drag{box-shadow:inset 0 0 0 2px var(--blue),inset 0 0 70px #2457ff14}.upload{position:absolute;z-index:9;top:42px;left:42px;width:140px;padding:0;border:0;background:none;color:var(--blue);text-align:left;cursor:pointer}.target{position:relative;display:block;width:56px;height:56px;margin-left:10px}.target i{position:absolute;width:13px;height:13px}.target i:nth-child(1){left:0;top:0;border-left:1px solid;border-top:1px solid}.target i:nth-child(2){right:0;top:0;border-right:1px solid;border-top:1px solid}.target i:nth-child(3){left:0;bottom:0;border-left:1px solid;border-bottom:1px solid}.target i:nth-child(4){right:0;bottom:0;border-right:1px solid;border-bottom:1px solid}.target b{position:absolute;inset:0;display:grid;place-items:center;font:300 25px Arial}.upload strong{display:block;margin-top:12px;font:10px/1.55 monospace;letter-spacing:.08em}.upload em{display:block;margin-top:6px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#696d73;font:8px monospace}.sheet{position:relative;z-index:4;height:min(64vh,550px);max-height:calc(100% - 42px);aspect-ratio:3/4;background:var(--paper);overflow:hidden;border:1px solid #5549371f;transform:rotate(-.35deg);transform-origin:center;box-shadow:0 22px 50px #1c191433,0 4px 8px #1c19141c;transition:transform .18s,box-shadow .18s;touch-action:none}.sheet canvas{width:100%;height:100%;display:block}.tag{position:absolute;right:9px;top:9px;padding:4px 6px;background:#ffffffd6;border:1px solid #1114;font:8px monospace;letter-spacing:.08em}.tag.compare{left:9px;right:auto;background:var(--blue);color:#fff}.reg{position:absolute;z-index:5;width:26px;height:26px;border:1px solid var(--pink);border-radius:50%}.reg:before,.reg:after{content:"";position:absolute;background:var(--pink)}.reg:before{left:-6px;top:12px;width:36px;height:1px}.reg:after{left:12px;top:-6px;width:1px;height:36px}.reg.a{left:8px;top:39%}.reg.b{right:10%;top:47%}.strip{position:absolute;z-index:7;left:38px;right:0;bottom:0;height:40px;display:flex;align-items:center;justify-content:center;border:1px solid #97a1ae5e;background:#ffffff91}.strip span{height:10px;width:56px}.gray{width:170px!important;margin-right:58px;background:linear-gradient(90deg,#111,#555,#aaa,#fff)}.c{background:var(--cyan)}.m{background:var(--pink)}.y{background:var(--yellow);width:92px!important}.k{background:#111;width:118px!important}.panel{display:flex;flex-direction:column;min-height:0;overflow:auto;border:1px solid #97a1ae6b;border-radius:5px;background:#ffffffa3;box-shadow:0 10px 30px #353b4412,inset 0 1px #fff}.panel-title{flex:0 0 50px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--soft)}.panel-title h2{margin:0;font-size:16px}.paper{flex:0 0 60px;display:grid;grid-template-columns:73px 1fr;align-items:center;padding:0 20px;border-bottom:1px solid var(--soft);font-size:13px}.paper select{min-width:0;height:32px;border:1px solid #d5d8dd;border-radius:3px;background:#ffffff85;font-size:11px}.control{flex:0 0 68px;padding:10px 20px 8px;border-bottom:1px solid var(--soft)}.control-head{display:flex;justify-content:space-between;align-items:center}.control-head label{font-size:13px}.control output{min-width:46px;height:25px;display:grid;place-items:center;border:1px solid #d8dbe0;border-radius:3px;font:9px monospace}.slider{position:relative;height:24px;margin-top:3px}.slider input{position:relative;z-index:2;width:100%;height:20px;margin:0;accent-color:#111;cursor:ew-resize}.ticks{position:absolute;left:5px;right:5px;bottom:0;height:5px;background:repeating-linear-gradient(90deg,#d4d7db 0 1px,transparent 1px 10%)}.foot{margin-top:auto;padding:10px 20px;color:var(--muted);font:8px monospace;letter-spacing:.1em}.rail{display:grid;grid-template-columns:minmax(0,1fr) minmax(305px,340px);gap:14px}.presets{display:grid;grid-template-columns:92px 1fr;align-items:center;border:1px solid var(--soft);padding:8px 10px}.label{padding-left:4px;font:9px monospace;letter-spacing:.12em}.label small{display:block;margin-top:8px;color:var(--blue);font-size:7px}.list{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.preset{position:relative;min-width:0;height:72px;display:grid;grid-template-columns:34px 1fr;grid-template-rows:1fr 1fr;column-gap:9px;text-align:left;border:1px solid #d7dadf;border-radius:5px;background:#ffffff8c;padding:7px 9px;cursor:pointer}.preset.active{border:2px solid var(--blue);padding:6px 8px}.preset .swatch{grid-row:1/3;border:1px solid #1111}.preset strong{align-self:end;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.preset small{font:6px monospace;color:#747980}.preset b{position:absolute;right:4px;top:4px;width:14px;height:14px;border-radius:50%;background:var(--blue);color:white;display:grid;place-items:center;font-size:9px}.preset:nth-child(1) .swatch{background:repeating-linear-gradient(6deg,#ece5d8 0 2px,#f5f0e6 2px 5px)}.preset:nth-child(2) .swatch{background:radial-gradient(circle at 2px 2px,#ef2b7a 0 1px,transparent 1.2px),radial-gradient(circle at 5px 5px,#2457ff 0 1px,#efe9de 1.2px);background-size:7px 7px}.preset:nth-child(3) .swatch{background:repeating-linear-gradient(#d8ccb1 0 2px,#e8dec9 2px 3px)}.preset:nth-child(4) .swatch{background:linear-gradient(90deg,transparent 48%,#3c30282e 50%,transparent 53%),linear-gradient(#eee8db 49%,#bdb19c 50%,#f7f2e8 52%)}.export{position:relative;border:1px solid var(--soft);padding:8px}.export>button{width:100%;height:100%;border:0;border-radius:4px;background:linear-gradient(#2457ff,#164bee);color:white;font:18px monospace;letter-spacing:.08em;cursor:pointer}.export>button:disabled{background:none;color:#a2a6ad;border:1px solid #d6d9de}.menu{position:absolute;z-index:20;right:8px;bottom:calc(100% + 8px);width:calc(100% - 16px);padding:9px;border:1px solid #b9bec6;border-radius:5px;background:#fffffff2;box-shadow:0 16px 36px #1e222821}.menu p{font:8px monospace;color:#666}.menu button{width:100%;padding:9px 7px;border:0;border-top:1px solid #eceef0;background:none;text-align:left;font-size:11px;cursor:pointer}.menu button:hover{background:#f1f4ff;color:var(--blue)}.privacy{display:flex;align-items:center;justify-content:flex-end;gap:7px;color:#777;font:8px monospace;letter-spacing:.08em}.dot{width:6px;height:6px;border-radius:50%;background:#aaa}.privacy.on .dot{background:#16a65b}.toast{position:fixed;z-index:30;left:50%;bottom:22px;transform:translateX(-50%);padding:10px 14px;background:#111;color:#fff;border:0;font:10px monospace}.hidden{display:none!important}
@media(max-width:1100px){.app{padding:12px;grid-template-rows:52px auto auto 22px}.workspace,.rail{grid-template-columns:1fr}.table{min-height:620px}.panel{display:grid;grid-template-columns:repeat(2,1fr);overflow:visible}.panel-title{grid-column:1/-1}.export{height:72px}}
@media(max-width:700px){.app{padding:8px}.meta span:first-child,.meta i{display:none}.table{min-height:520px}.sheet{height:min(53vh,420px);max-width:67vw}.upload{top:22px;left:18px;transform:scale(.8);transform-origin:left top}.panel{grid-template-columns:1fr}.panel-title{grid-column:auto}.presets{grid-template-columns:1fr}.label{display:flex;justify-content:space-between;padding:0 0 7px}.label small{margin:0}.list{grid-template-columns:repeat(2,1fr)}.gray{display:none}.rail{height:auto}}
</style>
</head>
<body>
<main class="app">
<header><h1>PRESSROOM / POSTER LAB</h1><div class="meta"><span>PROJECT 01</span><i></i><span id="zoomLabel">100%</span></div></header>
<div class="workspace">
<section class="table">
<div class="ruler top"><span>0</span><span>100</span><span>200</span><span>300</span><span>400</span><span>500</span><span>600</span></div>
<div class="ruler left"><span>0</span><span>100</span><span>200</span><span>300</span><span>400</span><span>500</span></div>
<div class="drop" id="drop">
<button class="upload" id="upload"><span class="target"><i></i><i></i><i></i><i></i><b>+</b></span><strong id="uploadText">DROP POSTER<br>OR BROWSE</strong><em id="fileName"></em></button>
<div class="reg a"></div><div class="reg b"></div>
<div class="sheet" id="sheet"><canvas id="canvas"></canvas><span class="tag" id="tag">DEMO PROOF</span><span class="tag compare hidden" id="compareTag">CLEAN ORIGINAL</span></div>
</div>
<div class="strip"><span class="gray"></span><span class="c"></span><span class="m"></span><span class="c"></span><span class="m"></span><span class="y"></span><span class="k"></span></div>
</section>
<aside class="panel">
<div class="panel-title"><h2>PRINT CHARACTER</h2><span>☷</span></div>
<div class="paper"><label for="paper">Paper</label><select id="paper"><option value="natural">Uncoated Natural 120gsm</option><option value="silk">Coated Silk 170gsm</option><option value="news">Newsprint 48gsm</option><option value="cotton">Cotton Rag 250gsm</option></select></div>
<div id="controls"></div><div class="foot">LOCAL PROCESSING · SRGB OUTPUT</div>
</aside>
</div>
<footer class="rail">
<section class="presets"><div class="label">PRESETS<small id="calibration">CALIBRATED</small></div><div class="list" id="presets"></div></section>
<div class="export"><button id="export" disabled>EXPORT PNG</button><div class="menu hidden" id="menu"><p>OUTPUT SIZE</p><button data-scale="1">1× · Poster only</button><button data-scale="2">2× · Poster only</button><button data-scale="2" data-studio="1">2× · Studio shadow</button></div></div>
</footer>
<div class="privacy" id="privacy"><span class="dot"></span>IMAGE STAYS IN YOUR BROWSER · HOLD C TO COMPARE</div>
<input class="hidden" id="file" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml">
<button class="toast hidden" id="toast"></button>
</main>
<script>
const $=s=>document.querySelector(s);
const presets=[
 {id:"offset",name:"Fresh Offset",note:"CLEAN / 170 GSM",v:{ink:18,half:22,reg:14,band:8,fold:4,light:68,shadow:35}},
 {id:"riso",name:"Risograph",note:"GRAIN / 2 COLOR",v:{ink:46,half:62,reg:56,band:26,fold:7,light:62,shadow:31}},
 {id:"news",name:"Newsprint",note:"COARSE / 48 GSM",v:{ink:58,half:48,reg:28,band:42,fold:18,light:56,shadow:28}},
 {id:"fold",name:"Folded Proof",note:"CREASE / HANDLED",v:{ink:27,half:32,reg:22,band:15,fold:74,light:72,shadow:58}}
];
let fx={...presets[0].v},active="offset",img=null,demo=null,zoom=100,clean=false,filename="";
const labels={ink:"Ink spread",half:"Halftone",reg:"Registration",band:"Banding",fold:"Folds",light:"Light",shadow:"Shadow"};
function noise(x,y,s=13){let v=Math.sin(x*12.9898+y*78.233+s*37.719)*43758.5453;return v-Math.floor(v)}
function makeDemo(){let c=document.createElement("canvas");c.width=900;c.height=1200;let x=c.getContext("2d");x.fillStyle="#f0eadc";x.fillRect(0,0,900,1200);x.fillStyle="#1658ef";x.beginPath();x.arc(290,285,230,Math.PI*.5,Math.PI*1.5);x.lineTo(290,515);x.fill();x.fillStyle="#111";x.fillRect(470,50,130,430);x.fillRect(315,425,320,430);x.fillStyle="#e92373";x.beginPath();x.arc(190,710,165,0,Math.PI*2);x.fill();x.fillRect(565,430,105,585);x.fillStyle="#1658ef";for(const y of [585,860]){x.beginPath();x.arc(680,y,145,-Math.PI*.5,Math.PI*.5);x.lineTo(680,y-145);x.fill()}x.fillStyle="#111";x.font="700 28px Arial";x.fillText("PRINT / MATTER",54,1120);x.font="16px monospace";x.fillText("PHYSICAL PROOF  —  01",55,1155);return c}
function drawFiber(x,w,h,a){x.save();x.globalCompositeOperation="multiply";let n=Math.floor(w*h/1500);for(let i=0;i<n;i++){let px=noise(i,3)*w,py=noise(i,7)*h,len=2+noise(i,11)*8;x.strokeStyle=`rgba(76,64,45,${.018+a*.00042})`;x.lineWidth=.35+noise(i,19)*.55;x.beginPath();x.moveTo(px,py);x.quadraticCurveTo(px+len*.45,py+1.8,px+len,py+noise(i,23)*2-1);x.stroke()}x.restore()}
function render(out,src,sw,sh,scale=1){let max=scale>1?3000:1100,s=Math.min(max/Math.max(sw,sh),1)*scale,w=Math.max(320,Math.round(sw*s)),h=Math.max(320,Math.round(sh*s));out.width=w;out.height=h;let x=out.getContext("2d",{alpha:false}),colors={natural:"#f0eadc",silk:"#f7f5ef",news:"#dfd4b9",cotton:"#eee8dc"};x.fillStyle=colors[$("#paper").value];x.fillRect(0,0,w,h);if(clean){x.drawImage(src,0,0,w,h);return}let r=fx.reg/100*Math.min(w,h)*.006;if(r>.15){x.save();x.globalAlpha=.16+fx.reg/580;x.globalCompositeOperation="multiply";x.filter="sepia(1) saturate(8) hue-rotate(142deg)";x.drawImage(src,r,-r*.4,w,h);x.filter="sepia(1) saturate(10) hue-rotate(282deg)";x.drawImage(src,-r,r*.35,w,h);x.restore()}if(fx.ink>1){x.save();x.globalAlpha=Math.min(.35,fx.ink/240);x.filter=`blur(${Math.max(.25,fx.ink/44)}px) contrast(1.18)`;x.globalCompositeOperation="multiply";x.drawImage(src,-.4,.4,w+.8,h+.8);x.restore()}x.save();x.globalAlpha=.96;x.globalCompositeOperation="multiply";x.filter=`contrast(${.94+fx.ink/560}) saturate(${.92+fx.ink/650})`;x.drawImage(src,0,0,w,h);x.restore();if(fx.half>2){let gap=Math.max(5,16-fx.half*.1),rad=Math.max(.35,fx.half/95);x.save();x.globalCompositeOperation="multiply";x.fillStyle=`rgba(22,18,14,${.025+fx.half/1100})`;for(let yy=gap/2;yy<h;yy+=gap)for(let xx=gap/2;xx<w;xx+=gap){x.beginPath();x.arc(xx,yy,rad*(.55+noise(xx,yy)*.75),0,Math.PI*2);x.fill()}x.restore()}if(fx.band>1){x.save();x.globalCompositeOperation="multiply";for(let i=0;i<7+fx.band/5;i++){let yy=noise(i,41)*h,bh=1+noise(i,43)*(2+fx.band/12);x.fillStyle=`rgba(30,26,20,${.006+fx.band/2800})`;x.fillRect(0,yy,w,bh)}x.restore()}drawFiber(x,w,h,14+fx.ink*.45);if(fx.fold>2){let a=fx.fold/100,g=x.createLinearGradient(0,h*.44,0,h*.56);g.addColorStop(0,"#fff0");g.addColorStop(.42,`rgba(255,255,255,${.32*a})`);g.addColorStop(.5,`rgba(80,67,48,${.21*a})`);g.addColorStop(.58,`rgba(255,255,255,${.1*a})`);g.addColorStop(1,"#fff0");x.fillStyle=g;x.fillRect(0,h*.42,w,h*.16);if(fx.fold>48){g=x.createLinearGradient(w*.43,0,w*.57,0);g.addColorStop(0,"#fff0");g.addColorStop(.46,`rgba(255,255,255,${.22*a})`);g.addColorStop(.51,`rgba(77,65,48,${.16*a})`);g.addColorStop(1,"#fff0");x.fillStyle=g;x.fillRect(w*.4,0,w*.2,h)}}let light=x.createRadialGradient(w*.2,h*.08,0,w*.2,h*.08,Math.max(w,h));light.addColorStop(0,`rgba(255,250,235,${fx.light/700})`);light.addColorStop(.6,"#fff0");light.addColorStop(1,`rgba(48,38,28,${fx.shadow/900})`);x.fillStyle=light;x.fillRect(0,0,w,h)}
function update(){let src=img||demo;render($("#canvas"),src,img?img.naturalWidth:demo.width,img?img.naturalHeight:demo.height);$("#sheet").style.transform=`scale(${zoom/100}) rotate(-.35deg)`;$("#zoomLabel").textContent=zoom+"%";$("#sheet").style.boxShadow=`0 ${16+fx.shadow/5}px ${30+fx.shadow/2}px rgba(28,25,20,${.08+fx.shadow/250}),0 4px 8px #1c19141c`}
function buildControls(){let root=$("#controls");root.innerHTML="";for(const key of Object.keys(labels)){let suffix=key==="reg"?" mm":key==="half"?" lpi":"%";let d=document.createElement("div");d.className="control";d.innerHTML=`<div class="control-head"><label>${labels[key]}</label><output id="out-${key}"></output></div><div class="slider"><input aria-label="${labels[key]}" id="${key}" type="range" min="0" max="100" value="${fx[key]}"><div class="ticks"></div></div>`;root.append(d);let input=d.querySelector("input");input.oninput=()=>{fx[key]=+input.value;$("#calibration").textContent="MODIFIED";setOut(key);requestAnimationFrame(update)};d.querySelector("label").ondblclick=()=>{fx[key]=presets[0].v[key];input.value=fx[key];setOut(key);update()};setOut(key)}}
function setOut(k){let v=fx[k],t=k==="reg"?(v*.012).toFixed(2)+"mm":k==="half"?v+" lpi":v+"%";$("#out-"+k).textContent=t}
function buildPresets(){let root=$("#presets");root.innerHTML="";presets.forEach(p=>{let b=document.createElement("button");b.className="preset"+(p.id===active?" active":"");b.innerHTML=`<span class="swatch"></span><strong>${p.name}</strong><small>${p.note}</small>${p.id===active?"<b>✓</b>":""}`;b.onclick=()=>{active=p.id;fx={...p.v};$("#calibration").textContent="CALIBRATED";buildControls();buildPresets();update()};root.append(b)})}
function load(file){if(!file||!/^image\/(png|jpeg|webp|svg\+xml)$/.test(file.type)){toast("PNG, JPG, WEBP 또는 SVG를 선택해주세요.");return}let url=URL.createObjectURL(file),next=new Image;next.onload=()=>{img=next;filename=file.name;$("#fileName").textContent=filename;$("#uploadText").innerHTML="REPLACE POSTER";$("#tag").classList.add("hidden");$("#export").disabled=false;$("#privacy").classList.add("on");zoom=100;update();toast("포스터를 불러왔습니다.");URL.revokeObjectURL(url)};next.src=url}
function toast(t){let el=$("#toast");el.textContent=t;el.classList.remove("hidden");clearTimeout(el.t);el.t=setTimeout(()=>el.classList.add("hidden"),2600)}
function download(scale,studio){if(!img)return;let out=document.createElement("canvas");render(out,img,img.naturalWidth,img.naturalHeight,scale);let final=out;if(studio){let pad=Math.round(Math.min(out.width,out.height)*.1),st=document.createElement("canvas");st.width=out.width+pad*2;st.height=out.height+pad*2;let x=st.getContext("2d");x.fillStyle="#f7f5ef";x.fillRect(0,0,st.width,st.height);x.shadowColor=`rgba(26,22,18,${.16+fx.shadow/500})`;x.shadowBlur=pad*.42;x.shadowOffsetY=pad*.16;x.drawImage(out,pad,pad);final=st}final.toBlob(blob=>{let a=document.createElement("a");a.download=(filename.replace(/\.[^.]+$/,"")||"poster")+`-pressroom-${scale}x.png`;a.href=URL.createObjectURL(blob);a.click();URL.revokeObjectURL(a.href);toast("고해상도 PNG를 저장했습니다.")},"image/png")}
demo=makeDemo();buildControls();buildPresets();update();
$("#upload").onclick=()=>$("#file").click();$("#file").onchange=e=>load(e.target.files[0]);$("#paper").onchange=update;
const drop=$("#drop");["dragenter","dragover"].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.add("drag")}));["dragleave","drop"].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.remove("drag")}));drop.ondrop=e=>load(e.dataTransfer.files[0]);drop.onwheel=e=>{e.preventDefault();zoom=Math.max(50,Math.min(200,zoom+(e.deltaY<0?5:-5)));update()};
$("#sheet").ondblclick=()=>{zoom=100;update()};$("#sheet").onpointerdown=e=>{e.currentTarget.setPointerCapture(e.pointerId);clean=true;$("#compareTag").classList.remove("hidden");update()};$("#sheet").onpointerup=()=>{clean=false;$("#compareTag").classList.add("hidden");update()};
onkeydown=e=>{if(e.key.toLowerCase()==="c"){clean=true;$("#compareTag").classList.remove("hidden");update()}};onkeyup=e=>{if(e.key.toLowerCase()==="c"){clean=false;$("#compareTag").classList.add("hidden");update()}};
$("#export").onclick=()=>$("#menu").classList.toggle("hidden");document.querySelectorAll("#menu button").forEach(b=>b.onclick=()=>{download(+b.dataset.scale,!!b.dataset.studio);$("#menu").classList.add("hidden")});
</script>
</body>
</html>

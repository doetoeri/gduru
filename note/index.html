<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Galaxy Tab S8 S-Pen Genuine Body Engine</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            --apple-blur: blur(25px);
            --l2-liquid: rgba(43, 114, 241, 0.35);
            --l3-liquid: rgba(147, 51, 234, 0.35);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            margin: 0; background: var(--bg-gradient); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            overflow: hidden; height: 100vh;
            touch-action: none; 
            -webkit-user-select: none;
            user-select: none;
        }
        
        #space {
            width: 100vw; height: 100vh; position: relative;
            perspective: 2500px; display: flex; justify-content: center; align-items: center;
        }

        /* 스쿼클 리퀴드 레이아웃 */
        .target {
            font-size: 1.6rem; font-weight: 700; color: #1d1d1f;
            position: relative; cursor: pointer; transform-style: preserve-3d;
            letter-spacing: -0.5px; padding: 10px 20px;
        }

        .glass-container {
            position: absolute; top: 140%; left: 50%; transform: translateX(-50%);
            width: 320px; height: 150px; pointer-events: none; opacity: 0;
            transform-style: preserve-3d; transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .glass-container.active { opacity: 1; }

        .glass-layer {
            position: absolute; width: 100%; padding: 16px 20px;
            border-radius: 24px; color: #1d1d1f; font-size: 0.9rem; font-weight: 500;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0.15) 100%);
            backdrop-filter: var(--apple-blur); -webkit-backdrop-filter: var(--apple-blur);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.8), 0 8px 32px rgba(0, 0, 0, 0.03);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s, filter 0.4s, box-shadow 0.4s;
        }

        .layer-1 { top: 0; z-index: 2; }
        .layer-2 { top: 75px; z-index: 1; }

        /* 탭 S8 절대 좌표 동기화 프레임 */
        #tabs8-shadow {
            position: absolute; 
            top: 0; left: 0;
            pointer-events: none; 
            opacity: 0;
            z-index: 9999;
            will-change: transform, opacity;
            transform-style: preserve-3d;
        }

        /* 🌟 탭 S8 전용 S펜 바디 매체 셰이더 */
        .shadow-mesh {
            /* 울트라용 사각 펜보다 훨씬 두꺼운 탭 S8 펜 바디 직경비(16px) 반영 */
            width: 16px; height: 210px;
            background: rgba(10, 15, 25, 0.28);
            /* 둥근 연필형 바디 + 완만한 원추형 펜촉 흐름을 완벽히 모사한 7각 구조 메쉬 */
            clip-path: polygon(50% 0%, 90% 7%, 100% 13%, 100% 100%, 0% 100%, 0% 13%, 10% 7%);
            /* 실제 연필처럼 둥근 그라데이션 광학 효과를 내기 위해 둥근 테두리 곡률 추가 */
            border-radius: 0 0 10px 10px;
            filter: blur(5px);
            transform-origin: 50% 0%; 
            will-change: transform, filter, background;
        }

        .shadow-aim {
            position: absolute; top: 0; left: 0; width: 4px; height: 4px;
            background: #000000; border-radius: 50%; 
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>

    <div id="space">
        <div id="tabs8-shadow">
            <div class="shadow-aim"></div>
            <div class="shadow-mesh"></div>
        </div>

        <span class="target" id="text-node">
            하드웨어 통합 렌더
            <div class="glass-container">
                <div class="glass-layer layer-1">💧 2층 리퀴드 젤: 몽환적 심도 탐색 상태</div>
                <div class="glass-layer layer-2">✨ 3층 글로스 에센스: 초근접 밀착 인터랙션</div>
            </div>
        </span>
    </div>

    <script>
        const space = document.getElementById('space');
        const shadow = document.getElementById('tabs8-shadow');
        const mesh = shadow.querySelector('.shadow-mesh');
        const target = document.getElementById('text-node');
        const container = target.querySelector('.glass-container');
        const l1 = container.querySelector('.layer-1');
        const l2 = container.querySelector('.layer-2');

        let zHeight = 18;

        function renderSpenPhysics(e) {
            if (e.type === 'pointerdown') {
                e.preventDefault();
            }

            shadow.style.opacity = "1";

            const spaceRect = space.getBoundingClientRect();
            const physicalX = e.clientX - spaceRect.left;
            const physicalY = e.clientY - spaceRect.top;

            let tX = e.tiltX || 0;
            let tY = e.tiltY || 0;
            let tiltMagnitude = Math.round(Math.hypot(tX, tY));

            if (e.buttons === 1 || e.pressure > 0) {
                zHeight = 0; 
            } else {
                zHeight = e.pointerType === 'pen' ? 4 + (Math.abs(tX) / 5) : zHeight;
            }

            shadow.style.transform = `translate3d(${physicalX}px, ${physicalY}px, 0)`;

            let angle = Math.atan2(tY, tX) * (180 / Math.PI) - 90;
            if (tX === 0 && tY === 0) angle = -40;

            // 🌟 탭 S8 두툼한 라운드 펜 바디 전용 스케일 가중치 보정
            let hyperBlur = 1.4 + (zHeight * 0.9); 
            let scaleX = 0.85 + (zHeight * 0.038); // 닿았을 때도 실린더 형태 볼륨감 유지
            let scaleY = 1.0 + (zHeight * 0.042) + (tiltMagnitude * 0.012);

            let liquidColor = 'rgba(10, 15, 25, 0.22)';
            if (zHeight <= 14 && zHeight > 3.5) {
                liquidColor = 'rgba(43, 114, 241, 0.32)'; 
            } else if (zHeight <= 3.5) {
                liquidColor = 'rgba(147, 51, 234, 0.42)'; 
            }

            mesh.style.filter = `blur(${hyperBlur}px)`;
            mesh.style.transform = `rotate(${angle}deg) scale(${scaleX}, ${scaleY})`;
            mesh.style.background = liquidColor;

            const rect = target.getBoundingClientRect();
            const nodeCenterX = rect.left + rect.width / 2;
            const nodeCenterY = rect.top + rect.height / 2;
            const distance = Math.hypot(e.clientX - nodeCenterX, e.clientY - nodeCenterY);

            if (distance < 140) {
                container.classList.add('active');
                
                if (zHeight > 14) {
                    l1.style.transform = "translateZ(0px) scale(1)";
                    l2.style.transform = "translateZ(-60px) scale(0.88) translateY(-10px)";
                    l1.style.opacity = "1"; l2.style.opacity = "0.15";
                    l1.style.filter = "none"; l2.style.filter = "blur(4px)";
                } 
                else if (zHeight > 3.5 && zHeight <= 14) {
                    l1.style.transform = "translateZ(-40px) scale(0.92) translateY(10px)";
                    l2.style.transform = "translateZ(60px) scale(1.04) translateY(0px)";
                    l1.style.opacity = "0.2"; l2.style.opacity = "1";
                    l1.style.filter = "blur(2px)"; l2.style.filter = "none";
                    l2.style.boxShadow = `0 12px 40px var(--l2-liquid), inset 0 1px 4px rgba(255,255,255,0.9)`;
                } 
                else {
                    l1.style.transform = "translateZ(-90px) scale(0.84) translateY(20px)";
                    l2.style.transform = "translateZ(100px) scale(1.08) translateY(5px)";
                    l1.style.opacity = "0.03"; l2.style.opacity = "1";
                    l1.style.filter = "blur(5px)"; l2.style.filter = "none";
                    l2.style.boxShadow = `0 16px 48px var(--l3-liquid), inset 0 1px 4px rgba(255,255,255,0.9)`;
                }
            } else {
                container.classList.remove('active');
                l1.style.transform = "none"; l2.style.transform = "none";
                l1.style.filter = "none"; l2.style.filter = "none";
            }
        }

        function killSpenShadow() {
            shadow.style.opacity = "0"; 
        }

        space.addEventListener('pointermove', renderSpenPhysics, { passive: false });
        space.addEventListener('pointerdown', renderSpenPhysics, { passive: false });
        space.addEventListener('pointerup', renderSpenPhysics, { passive: false });
        
        space.addEventListener('pointerleave', killSpenShadow);
        space.addEventListener('pointerout', killSpenShadow);
        space.addEventListener('pointercancel', killSpenShadow);

        space.addEventListener('wheel', (e) => {
            if (e.pointerType === 'pen') return;
            e.preventDefault();
            zHeight = Math.min(Math.max(zHeight + (e.deltaY > 0 ? 1.5 : -1.5), 0), 30);
            renderSpenPhysics(e);
        }, { passive: false });
    </script>
</body>
</html>

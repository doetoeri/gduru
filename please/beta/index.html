<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고1 지필평가 완벽 대비 - 한국사 근현대사 퀴즈</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        :root {
            /* 정제된 UI 컬러 테마 */
            --primary: #3f51b5;
            --primary-light: #e8eaf6;
            --primary-dark: #1a237e;
            --secondary: #009688;
            --secondary-light: #e0f2f1;
            --background: #f8f9fa;
            --surface: #ffffff;
            --text-main: #202124;
            --text-sub: #5f6368;
            --border: #dadce0;
            --error: #d32f2f;
            --error-light: #fdecea;
            --success: #137333;
            --success-light: #e6f4ea;
            
            --radius-main: 16px;
            --radius-full: 9999px;
            --shadow: 0 4px 12px rgba(0,0,0,0.05);
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--background);
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 40px;
        }

        /* 스마트 헤더 영역 */
        header {
            background-color: var(--surface);
            padding: 20px 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border-bottom: 1px solid var(--border);
        }

        .header-container {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 20px;
            font-weight: 700;
            color: var(--primary-dark);
        }

        /* 상단 모르는 것 전용 토글 토스트/버튼 */
        .btn-moru-toggle {
            background-color: var(--background);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: var(--radius-full);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition);
        }

        .btn-moru-toggle.active {
            background-color: #fff9c4;
            border-color: #fbc02d;
            color: #f57f17;
        }

        /* 탭 내비게이션 */
        .tab-box {
            display: flex;
            background-color: var(--background);
            border-radius: var(--radius-full);
            padding: 4px;
            gap: 4px;
            border: 1px solid var(--border);
        }

        .tab-item {
            flex: 1;
            border: none;
            background: none;
            padding: 12px 4px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-sub);
            cursor: pointer;
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: var(--transition);
        }

        .tab-item.active {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 2px 6px rgba(63, 81, 181, 0.3);
        }

        /* 메인 콘텐츠 구조 */
        main {
            padding: 20px 16px;
            max-width: 632px;
            margin: 0 auto;
        }

        .view-section {
            display: none;
        }

        .view-section.active {
            display: block;
        }

        /* 카드 컴포넌트 */
        .app-card {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-main);
            padding: 24px;
            margin-bottom: 20px;
            position: relative;
            box-shadow: var(--shadow);
        }

        .card-header-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .badge-container {
            display: flex;
            gap: 6px;
        }

        .badge {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: var(--radius-full);
            font-weight: 500;
        }

        .badge-idx { background-color: var(--primary-light); color: var(--primary-dark); }
        .badge-cat { background-color: var(--secondary-light); color: var(--secondary); }

        .btn-star {
            background: none;
            border: none;
            cursor: pointer;
            color: #b0bec5;
            display: flex;
            align-items: center;
            transition: var(--transition);
        }

        .btn-star.active {
            color: #fbc02d;
            transform: scale(1.1);
        }

        /* 단답형 문제 스타일 */
        .q-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-main);
        }

        .q-box {
            background-color: var(--background);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            border-left: 4px solid var(--primary);
            font-size: 15px;
            color: #333;
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        .form-input {
            flex: 1;
            padding: 14px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            transition: var(--transition);
        }

        .form-input:focus {
            border-color: var(--primary);
        }

        .action-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        .result-toast {
            margin-top: 16px;
            padding: 14px;
            border-radius: 10px;
            font-weight: 500;
            display: none;
            font-size: 14px;
        }

        .result-toast.correct { display: block; background-color: var(--success-light); color: var(--success); }
        .result-toast.wrong { display: block; background-color: var(--error-light); color: var(--error); }

        /* 순서 정렬형 드래그 앤 드롭 영역 */
        .drag-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 20px 0;
        }

        .drag-card {
            background-color: var(--surface);
            border: 2px dashed var(--border);
            padding: 16px;
            border-radius: 12px;
            cursor: grab;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: var(--transition);
        }

        .drag-card.dragging {
            opacity: 0.4;
            background-color: var(--primary-light);
            border-color: var(--primary);
        }

        .drag-icon {
            color: var(--text-sub);
            display: flex;
            align-items: center;
        }

        /* 하단 내비게이션 바 패널 */
        .bottom-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 24px;
        }

        .progress-txt {
            font-size: 13px;
            color: var(--text-sub);
            font-weight: 500;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="header-top">
                <div class="header-title">
                    <span class="material-icons-round">fact_check</span>
                    <span>한국사 지필평가 마스터</span>
                </div>
                <button class="btn-moru-toggle" id="moru-filter-toggle" onclick="toggleMoruMode()">
                    <span class="material-icons-round" style="font-size:18px;">star_border</span>
                    <span id="moru-count-text">모르는 것 골라보기 (0)</span>
                </button>
            </div>
            <div class="tab-box">
                <button class="tab-item active" onclick="changeTab('short')">
                    <span class="material-icons-round" style="font-size:18px;">edit</span>단답형 키워드
                </button>
                <button class="tab-item" onclick="changeTab('order')">
                    <span class="material-icons-round" style="font-size:18px;">low_priority</span>순서 맞추기
                </button>
                <button class="tab-item" onclick="changeTab('list')">
                    <span class="material-icons-round" style="font-size:18px;">view_list</span>전체 흐름
                </button>
            </div>
        </div>
    </header>

    <main>
        <section id="short-view" class="view-section active">
            <div class="app-card">
                <div class="card-header-line">
                    <div class="badge-container">
                        <span class="badge badge-cat" id="sh-cat">분류</span>
                    </div>
                    <button class="btn-star" id="sh-star-btn" onclick="toggleStarCurrent()">
                        <span class="material-icons-round">star_border</span>
                    </button>
                </div>
                <div class="q-title">❓ 아래 탐구 힌트 및 키워드를 읽고 올바른 명칭을 쓰시오.</div>
                <div class="q-box" id="sh-hint-text">힌트 내용</div>
                <div style="font-size: 13px; color: var(--text-sub); margin-bottom:16px;" id="sh-nations"></div>
                
                <div class="input-group">
                    <input type="text" id="sh-user-input" class="form-input" placeholder="정답을 입력하세요 (공백 무관)" onkeypress="handleShortEnter(event)">
                    <button class="action-btn" onclick="verifyShortAnswer()">제출</button>
                </div>
                <div class="result-toast" id="sh-result">결과</div>
            </div>
            <div class="bottom-panel">
                <span class="progress-txt" id="sh-progress-text">1 / 84</span>
                <button class="action-btn" style="background-color: var(--text-sub);" onclick="moveNextShort()">다음 문제 ▶</button>
            </div>
        </section>

        <section id="order-view" class="view-section">
            <div class="app-card" style="margin-bottom: 12px;">
                <div class="q-title">⏳ 다음 사건들을 역사적 인과 관계 및 시간 순서대로 나열하시오.</div>
                <p style="font-size:13px; color: var(--text-sub);">항목을 위아래로 드래그하여 순서를 바꾼 후 정답 확인 버튼을 누르세요.</p>
            </div>
            
            <div class="drag-list" id="drag-sort-space">
                </div>

            <div class="result-toast" id="order-result" style="margin-bottom: 16px;">결과</div>

            <div class="bottom-panel">
                <button class="action-btn" style="background-color: var(--text-sub);" onclick="makeOrderQuiz()">새로운 무작위 배열</button>
                <button class="action-btn" style="background-color: var(--secondary);" onclick="verifyOrderAnswer()">정답 확인</button>
            </div>
        </section>

        <section id="list-view" class="view-section">
            <div id="flow-list-container"></div>
        </section>
    </main>

            [83,"한일 신협약","조약","조선/대한제국, 일본","정미7조약 - 차관 정치 시행, 한국 군대 해산 규정"],
            [84,"한국 병합 조약","조약","조선/대한제국, 일본","경술국치 - 대한제국의 국권을 완전히 상실하고 일제강점기가 시작됨"]

        let moruIds = JSON.parse(localStorage.getItem('moruIds_v2')) || [];
        let isMoruOnlyMode = false;
        let currentPool = [...coreHistoryData];
        let shortCursor = 0;
        let orderCorrectSequence = [];

        window.onload = function() {
            refreshMoruCounter();
            rebuildCurrentPool();
            initShortQuiz();
            makeOrderQuiz();
            renderFlowList();
        }

        function rebuildCurrentPool() {
            if (isMoruOnlyMode) {
                currentPool = coreHistoryData.filter(item => moruIds.includes(item[0]));
            } else {
                currentPool = [...coreHistoryData];
            }
        }

        function refreshMoruCounter() {
            document.getElementById('moru-count-text').innerText = `모르는 것 골라보기 (${moruIds.length})`;
        }

        function toggleMoruMode() {
            isMoruOnlyMode = !isMoruOnlyMode;
            const btn = document.getElementById('moru-filter-toggle');
            if (isMoruOnlyMode) {
                btn.classList.add('active');
                btn.querySelector('span').innerText = 'star';
            } else {
                btn.classList.remove('active');
                btn.querySelector('span').innerText = 'star_border';
            }
            rebuildCurrentPool();
            shortCursor = 0;
            initShortQuiz();
            renderFlowList();
        }

        function toggleStarItem(id) {
            if (moruIds.includes(id)) {
                moruIds = moruIds.filter(v => v !== id);
            } else {
                moruIds.push(id);
            }
            localStorage.setItem('moruIds_v2', JSON.stringify(moruIds));
            refreshMoruCounter();

            // 리스트 뷰 아이콘 업데이트
            const icon = document.getElementById(`list-star-ico-${id}`);
            if(icon) {
                icon.innerText = moruIds.includes(id) ? 'star' : 'star_border';
                icon.parentElement.classList.toggle('active', moruIds.includes(id));
            }
        }

        function changeTab(tabId) {
            document.querySelectorAll('.tab-item').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
            
            event.currentTarget.classList.add('active');
            document.getElementById(`${tabId}-view`).classList.add('active');

            if (tabId === 'order') makeOrderQuiz();
        }

        // --- 단답형 키워드 컴포넌트 로직 ---
        function initShortQuiz() {
            const res = document.getElementById('sh-result');
            res.style.display = 'none';
            document.getElementById('sh-user-input').value = '';

            if (currentPool.length === 0) {
                document.getElementById('sh-hint-text').innerText = "보관된 '모르는 문제'가 없습니다. 전체 흐름 탭에서 기억이 안 나는 사건들을 별표(★) 등록해 보세요.";
                document.getElementById('sh-cat').innerText = "-";
                document.getElementById('sh-nations').innerText = "";
                document.getElementById('sh-progress-text').innerText = "0 / 0";
                return;
            }

            if (shortCursor >= currentPool.length) shortCursor = 0;
            const cur = currentPool[shortCursor];

            document.getElementById('sh-cat').innerText = cur[2];
            document.getElementById('sh-hint-text').innerText = cur[4] || "세부 사료 힌트가 없습니다. 사건 자체의 가치를 복습해 보세요.";
            document.getElementById('sh-nations').innerText = `🌍 관련 국가/세력: ${cur[3]}`;
            document.getElementById('sh-progress-text').innerText = `${shortCursor + 1} / ${currentPool.length}`;

            const starBtn = document.getElementById('sh-star-btn');
            if (moruIds.includes(cur[0])) {
                starBtn.classList.add('active');
                starBtn.innerHTML = '<span class="material-icons-round">star</span>';
            } else {
                starBtn.classList.remove('active');
                starBtn.innerHTML = '<span class="material-icons-round">star_border</span>';
            }
        }

        function verifyShortAnswer() {
            if (currentPool.length === 0) return;
            const userAns = document.getElementById('sh-user-input').value.replace(/\s+/g, '').toLowerCase();
            const originalAns = currentPool[shortCursor][1];
            const cleanAns = originalAns.replace(/\s+/g, '').toLowerCase();
            const res = document.getElementById('sh-result');

            if (userAns === cleanAns || (userAns.length >= 2 && cleanAns.includes(userAns))) {
                res.innerText = `⭕ 정답입니다! [정식 교과서 명칭: ${originalAns}]`;
                res.className = "result-toast correct";
            } else {
                res.innerText = `❌ 틀렸습니다. 정답은 [ ${originalAns} ] 입니다.`;
                res.className = "result-toast wrong";
            }
        }

        function handleShortEnter(e) { if(e.key === 'Enter') verifyShortAnswer(); }
        function moveNextShort() {
            if (currentPool.length > 0) shortCursor = (shortCursor + 1) % currentPool.length;
            initShortQuiz();
        }

        function toggleStarCurrent() {
            if (currentPool.length === 0) return;
            const cur = currentPool[shortCursor];
            toggleStarItem(cur[0]);
            initShortQuiz();
        }

        // --- 순서 맞추기 (드래그형) 로직 ---
        function makeOrderQuiz() {
            document.getElementById('order-result').style.display = 'none';
            const space = document.getElementById('drag-sort-space');
            space.innerHTML = '';

            let samples = [];
            let datasetCopy = [...coreHistoryData];
            for (let i = 0; i < 4; i++) {
                let rIdx = Math.floor(Math.random() * datasetCopy.length);
                samples.push(datasetCopy.splice(rIdx, 1)[0]);
            }

            // 진짜 시간 순 정렬 순서 추출
            orderCorrectSequence = [...samples].sort((a,b) => a[0] - b[0]).map(v => v[1]);

            // 화면 표시용으로 무작위 셔플
            samples.sort(() => Math.random() - 0.5);

            samples.forEach(item => {
                const el = document.createElement('div');
                el.className = 'drag-card';
                el.draggable = true;
                el.dataset.name = item[1];
                el.innerHTML = `
                    <div class="drag-icon"><span class="material-icons-round">drag_indicator</span></div>
                    <div style="font-weight:500; font-size:15px;">${item[1]}</div>
                `;

                el.addEventListener('dragstart', () => el.classList.add('dragging'));
                el.addEventListener('dragend', () => el.classList.remove('dragging'));

                space.appendChild(el);
            });

            bindDragSequenceEvents();
        }

        function bindDragSequenceEvents() {
            const container = document.getElementById('drag-sort-space');
            container.addEventListener('dragover', e => {
                e.preventDefault();
                const afterElement = getDragAfterElement(container, e.clientY);
                const dragging = document.querySelector('.dragging');
                if (afterElement == null) {
                    container.appendChild(dragging);
                } else {
                    container.insertBefore(dragging, afterElement);
                }
            });
        }

        function getDragAfterElement(container, y) {
            const elements = [...container.querySelectorAll('.drag-card:not(.dragging)')];
            return elements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        function verifyOrderAnswer() {
            const currentSequence = [...document.querySelectorAll('.drag-card')].map(el => el.dataset.name);
            const res = document.getElementById('order-result');

            let match = true;
            for(let i=0; i<4; i++) {
                if(currentSequence[i] !== orderCorrectSequence[i]) {
                    match = false;
                    break;
                }
            }

            if (match) {
                res.innerText = "⭕ 완벽합니다! 사건의 전후 선후 흐름 관계를 완벽하게 파악하고 있습니다.";
                res.className = "result-toast correct";
            } else {
                res.innerHTML = `❌ 순서가 맞지 않습니다.<br>⏱️ <b>교과서 정답 기준 시간 연표 순서:</b><br>${orderCorrectSequence.join(' ➔ ')}`;
                res.className = "result-toast wrong";
            }
        }

        // --- 전체 흐름 리스트 뷰 로직 ---
        function renderFlowList() {
            const container = document.getElementById('flow-list-container');
            container.innerHTML = '';

            let listDataset = isMoruOnlyMode ? coreHistoryData.filter(item => moruIds.includes(item[0])) : coreHistoryData;

            if (listDataset.length === 0) {
                container.innerHTML = `<p style="text-align:center; padding:40px 0; color:var(--text-sub);">조건에 일치하는 사건 리스트가 비어 있습니다.</p>`;
                return;
            }

            listDataset.forEach(item => {
                const checked = moruIds.includes(item[0]);
                const card = document.createElement('div');
                card.className = `app-card ${checked ? 'active' : ''}`;
                card.style.padding = '16px 20px';
                card.style.marginBottom = '12px';

                card.innerHTML = `
                    <div style="display:flex; justify-content:between; align-items:center; gap:12px;">
                        <div style="flex:1;">
                            <span class="badge badge-idx" style="margin-right:4px;">${item[0]}</span>
                            <strong style="font-size:15px;">${item[1]}</strong>
                            <div style="font-size:13px; color:var(--text-sub); margin-top:4px;">${item[4] || '세부 정보 없음'}</div>
                        </div>
                        <button class="btn-star ${checked ? 'active' : ''}" onclick="toggleStarItem(${item[0]})">
                            <span class="material-icons-round" id="list-star-ico-${item[0]}">${checked ? 'star' : 'star_border'}</span>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>한국사 1등급 최종병기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .view { display: none; }
        .view.active { display: block; }
        .hidden-answer { color: transparent; background: #ddd; border-radius: 4px; padding: 2px 8px; cursor: pointer; }
        .hidden-answer:hover { background: #bbb; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 pb-20">

<header class="bg-blue-600 text-white p-6 shadow-lg">
    <h1 class="text-xl font-bold">한국사 최종 병기</h1>
</header>

<nav class="flex gap-2 p-2 overflow-x-auto bg-white border-b shadow-sm sticky top-0">
    <button onclick="showView('timeline')" class="px-4 py-2 bg-blue-100 rounded-full text-sm font-bold">연표</button>
    <button onclick="showView('treaty')" class="px-4 py-2 bg-blue-100 rounded-full text-sm font-bold">조약테스트</button>
    <button onclick="showView('mnemonic')" class="px-4 py-2 bg-blue-100 rounded-full text-sm font-bold">암기법</button>
    <button onclick="showView('person')" class="px-4 py-2 bg-blue-100 rounded-full text-sm font-bold">인물주관식</button>
    <button onclick="showView('wrong')" class="px-4 py-2 bg-red-100 rounded-full text-sm font-bold">오답노트</button>
</nav>

<div id="timeline" class="view active p-4">
    <h2 class="font-bold mb-4">개편된 연표 (겹침 방지)</h2>
    <div class="bg-white p-4 rounded-xl shadow overflow-x-auto">
        <div class="h-64 flex items-center gap-12 px-10 relative border-b-4 border-gray-300">
            <div class="text-center"><div class="w-4 h-4 bg-blue-500 rounded-full mb-2"></div><div class="text-xs">1876<br>강화도</div></div>
            <div class="text-center"><div class="w-4 h-4 bg-red-500 rounded-full mb-2"></div><div class="text-xs">1882<br>임오군란</div></div>
            <div class="text-center"><div class="w-4 h-4 bg-blue-500 rounded-full mb-2"></div><div class="text-xs">1884<br>갑신정변</div></div>
            <div class="text-center"><div class="w-4 h-4 bg-green-500 rounded-full mb-2"></div><div class="text-xs">1894<br>갑오개혁</div></div>
            <div class="text-center"><div class="w-4 h-4 bg-red-500 rounded-full mb-2"></div><div class="text-xs">1905<br>을사늑약</div></div>
        </div>
    </div>
</div>

<div id="treaty" class="view p-4">
    <h2 class="font-bold mb-4">조약 내용 단답형 테스트</h2>
    <div class="bg-white p-4 rounded shadow mb-4">
        <p class="mb-2"><strong>질문:</strong> 영사 재판권(치외법권)이 처음으로 명시된 조약은?</p>
        <input type="text" id="treaty-ans" class="border p-2 w-full rounded" placeholder="정답 입력">
        <button onclick="checkTreaty()" class="mt-2 bg-blue-500 text-white px-4 py-2 rounded">채점</button>
    </div>
</div>

<div id="person" class="view p-4">
    <h2 class="font-bold mb-4">인물 특화 주관식</h2>
    <div class="bg-white p-4 rounded shadow">
        <p class="mb-2"><strong>힌트:</strong> "일본에 파견되어 조선책략을 들여옴"</p>
        <input type="text" id="person-ans" class="border p-2 w-full rounded" placeholder="인물 이름 입력">
        <button onclick="checkPerson()" class="mt-2 bg-blue-500 text-white px-4 py-2 rounded">채점</button>
    </div>
</div>

<div id="wrong" class="view p-4">
    <h2 class="font-bold mb-4 text-red-600">오답 노트</h2>
    <div id="wrong-list" class="bg-white p-4 rounded shadow text-sm">
        <p>오답이 발생하면 이곳에 기록됩니다.</p>
    </div>
</div>

<script>
    const wrongAnswers = [];
    
    function showView(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function checkTreaty() {
        const ans = document.getElementById('treaty-ans').value;
        if(ans === "강화도 조약") alert("정답!");
        else {
            alert("오답입니다. 정답: 강화도 조약");
            wrongAnswers.push("조약: 강화도 조약");
            updateWrongList();
        }
    }

    function checkPerson() {
        const ans = document.getElementById('person-ans').value;
        if(ans === "김홍집") alert("정답!");
        else {
            alert("오답입니다. 정답: 김홍집");
            wrongAnswers.push("인물: 김홍집");
            updateWrongList();
        }
    }

    function updateWrongList() {
        const div = document.getElementById('wrong-list');
        div.innerHTML = wrongAnswers.map(w => `<p class="border-b p-2 text-red-600">${w}</p>`).join('');
    }
</script>

</body>
</html>

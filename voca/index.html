<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#eef2f7" />
  <title>연상 단어장 · 반응형 PC 버전</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #edf1f6;
      --surface: rgba(255, 255, 255, 0.72);
      --surface-strong: rgba(255, 255, 255, 0.92);
      --line: rgba(20, 28, 42, 0.10);
      --text: #151a22;
      --muted: #6b7280;
      --primary: #2563eb;
      --primary-strong: #174fc4;
      --primary-soft: rgba(37, 99, 235, 0.11);
      --danger: #d63d4b;
      --warning: #b56a00;
      --success: #177245;
      --shadow: 0 18px 45px rgba(31, 45, 68, 0.12);
      --radius-xl: 30px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --nav-height: 76px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 12% 0%, rgba(65, 115, 255, 0.16), transparent 30rem),
        radial-gradient(circle at 95% 15%, rgba(104, 211, 190, 0.12), transparent 28rem),
        var(--bg);
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .material-symbols-rounded {
      font-variation-settings:
        "FILL" 0,
        "wght" 500,
        "GRAD" 0,
        "opsz" 24;
      line-height: 1;
    }

    .app {
      width: min(1440px, 100%);
      margin: 0 auto;
      padding: 22px 18px calc(var(--nav-height) + 34px);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 0;
    }

    .brand-mark {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 17px;
      color: white;
      background: linear-gradient(145deg, #4d7cff, #1954d1);
      box-shadow:
        0 10px 24px rgba(37, 99, 235, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.45);
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(1.22rem, 3.4vw, 1.62rem);
      letter-spacing: -0.045em;
    }

    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.84rem;
    }

    .icon-button {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--text);
      background: var(--surface);
      backdrop-filter: blur(18px);
      box-shadow: 0 8px 20px rgba(31, 45, 68, 0.08);
      transition:
        transform 0.16s ease,
        background 0.16s ease;
    }

    .icon-button:active {
      transform: scale(0.94);
    }

    .page {
      display: none;
      animation: pageIn 0.22s ease;
    }

    .page.active {
      display: block;
    }

    @keyframes pageIn {
      from {
        opacity: 0;
        transform: translateY(7px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.4fr 0.8fr;
      gap: 18px;
      margin-bottom: 18px;
    }

    .card {
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: var(--radius-xl);
      background: var(--surface);
      backdrop-filter: blur(22px) saturate(1.15);
      box-shadow: var(--shadow);
    }

    .hero {
      min-height: 260px;
      padding: clamp(24px, 5vw, 42px);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.86), rgba(255, 255, 255, 0.62)),
        var(--surface);
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 270px;
      height: 270px;
      right: -95px;
      bottom: -125px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.22), rgba(37, 99, 235, 0));
      pointer-events: none;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--primary);
      font-size: 0.79rem;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    .hero h2 {
      max-width: 660px;
      margin: 14px 0 10px;
      font-size: clamp(1.65rem, 5.4vw, 3.15rem);
      line-height: 1.08;
      letter-spacing: -0.065em;
    }

    .hero p {
      max-width: 650px;
      margin: 0;
      color: var(--muted);
      font-size: clamp(0.93rem, 2vw, 1.04rem);
      line-height: 1.68;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 26px;
      position: relative;
      z-index: 1;
    }

    .button {
      min-height: 48px;
      padding: 0 18px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 750;
      transition:
        transform 0.16s ease,
        box-shadow 0.16s ease,
        background 0.16s ease;
    }

    .button:active:not(:disabled) {
      transform: scale(0.97);
    }

    .button.primary {
      color: white;
      background: linear-gradient(180deg, #3472f5, #1f5edc);
      box-shadow:
        0 10px 20px rgba(37, 99, 235, 0.24),
        inset 0 1px 0 rgba(255, 255, 255, 0.35);
    }

    .button.secondary {
      color: var(--text);
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.68);
    }

    .button.ghost {
      color: var(--muted);
      background: rgba(20, 30, 45, 0.055);
    }

    .button.danger {
      color: white;
      background: linear-gradient(180deg, #e05260, #c93444);
    }

    .button.small {
      min-height: 40px;
      padding: 0 14px;
      font-size: 0.8rem;
    }

    .summary {
      padding: 22px;
      display: grid;
      align-content: center;
      gap: 12px;
    }

    .summary h3 {
      margin: 0 0 2px;
      font-size: 1rem;
      letter-spacing: -0.03em;
    }

    .summary .metric {
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 19px;
      background: rgba(255, 255, 255, 0.54);
    }

    .metric-label {
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 700;
    }

    .metric-value {
      display: block;
      margin-top: 5px;
      font-size: 1.42rem;
      letter-spacing: -0.045em;
    }

    .metric-note {
      margin-left: 6px;
      color: var(--muted);
      font-size: 0.72rem;
    }

    .section {
      padding: clamp(20px, 4vw, 30px);
      margin-bottom: 18px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 18px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 1.22rem;
      letter-spacing: -0.04em;
    }

    .section-head p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.55;
    }

    .method-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .method-step {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 21px;
      background: rgba(255, 255, 255, 0.56);
    }

    .step-number {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--primary);
      background: var(--primary-soft);
      font-size: 0.8rem;
      font-weight: 850;
    }

    .method-step h3 {
      margin: 14px 0 7px;
      font-size: 0.95rem;
    }

    .method-step p {
      margin: 0;
      color: var(--muted);
      font-size: 0.79rem;
      line-height: 1.6;
    }

    .study-shell {
      width: min(850px, 100%);
      margin: 0 auto;
    }

    .study-card {
      padding: clamp(22px, 5vw, 42px);
    }

    .stage-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 12px;
      border-radius: 999px;
      color: var(--primary);
      background: var(--primary-soft);
      font-size: 0.74rem;
      font-weight: 800;
    }

    .word-display {
      margin: 26px 0 8px;
      font-size: clamp(2.2rem, 8vw, 4.7rem);
      line-height: 1;
      letter-spacing: -0.055em;
      word-break: break-word;
    }

    .word-sub {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .study-form {
      display: grid;
      gap: 18px;
      margin-top: 30px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    .field label {
      color: #3d4654;
      font-size: 0.81rem;
      font-weight: 750;
    }

    .input,
    .textarea,
    .select {
      width: 100%;
      min-height: 49px;
      padding: 13px 15px;
      border: 1px solid var(--line);
      border-radius: 17px;
      outline: none;
      color: var(--text);
      background: rgba(255, 255, 255, 0.7);
      transition:
        border 0.16s ease,
        box-shadow 0.16s ease,
        background 0.16s ease;
    }

    .textarea {
      min-height: 112px;
      resize: vertical;
      line-height: 1.6;
    }

    .input:focus,
    .textarea:focus,
    .select:focus {
      border-color: rgba(37, 99, 235, 0.42);
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.09);
    }

    .study-actions {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 10px;
    }

    .reveal-box {
      padding: 20px;
      border: 1px solid rgba(37, 99, 235, 0.13);
      border-radius: 22px;
      background: rgba(37, 99, 235, 0.06);
    }

    .reveal-label {
      color: var(--primary);
      font-size: 0.74rem;
      font-weight: 800;
    }

    .reveal-meaning {
      margin-top: 8px;
      font-size: clamp(1.25rem, 4vw, 1.85rem);
      font-weight: 850;
      letter-spacing: -0.04em;
      line-height: 1.4;
    }

    .association-box {
      margin-top: 13px;
      padding-top: 13px;
      border-top: 1px solid rgba(37, 99, 235, 0.12);
      color: #4e5969;
      line-height: 1.58;
      font-size: 0.86rem;
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 14px;
    }

    .progress-track {
      height: 9px;
      flex: 1;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(20, 30, 45, 0.08);
    }

    .progress-bar {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #2e6fec, #5d8dff);
      transition: width 0.25s ease;
    }

    .progress-text {
      min-width: 58px;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 750;
      text-align: right;
    }

    .empty {
      min-height: 360px;
      display: grid;
      place-items: center;
      padding: 30px;
      text-align: center;
    }

    .empty-icon {
      width: 62px;
      height: 62px;
      display: grid;
      place-items: center;
      margin: 0 auto 15px;
      border-radius: 23px;
      color: var(--primary);
      background: var(--primary-soft);
    }

    .empty h3 {
      margin: 0 0 8px;
      letter-spacing: -0.03em;
    }

    .empty p {
      max-width: 500px;
      margin: 0 auto 20px;
      color: var(--muted);
      line-height: 1.62;
      font-size: 0.86rem;
    }

    .review-answer {
      display: none;
      gap: 18px;
    }

    .review-answer.visible {
      display: grid;
    }

    .rating-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .rating-button {
      min-height: 68px;
      padding: 10px;
      border-radius: 18px;
      font-weight: 800;
    }

    .rating-button small {
      opacity: 0.72;
      font-weight: 650;
    }

    .rating-button.bad {
      color: #a92939;
      background: rgba(214, 61, 75, 0.1);
    }

    .rating-button.mid {
      color: #8a5700;
      background: rgba(208, 133, 14, 0.12);
    }

    .rating-button.good {
      color: #167044;
      background: rgba(23, 137, 80, 0.11);
    }

    .toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }

    .search-wrap {
      min-width: 220px;
      flex: 1;
      position: relative;
    }

    .search-wrap .material-symbols-rounded {
      position: absolute;
      top: 50%;
      left: 14px;
      z-index: 1;
      color: var(--muted);
      transform: translateY(-50%);
    }

    .search-wrap .input {
      padding-left: 45px;
    }

    .word-table {
      display: grid;
      gap: 10px;
    }

    .selection-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin: 14px 0 12px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.58);
    }

    .selection-left,
    .selection-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .selection-count {
      min-width: 72px;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 800;
    }

    .check-wrap {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
    }

    .word-check {
      width: 19px;
      height: 19px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .word-row {
      display: grid;
      grid-template-columns: 28px minmax(140px, 0.8fr) minmax(170px, 1.2fr) auto;
      gap: 14px;
      align-items: center;
      padding: 16px;
      border-radius: 19px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.55);
    }

    .word-term {
      font-size: 1.02rem;
      font-weight: 850;
      word-break: break-word;
    }

    .word-meta {
      margin-top: 5px;
      color: var(--muted);
      font-size: 0.74rem;
    }

    .word-meaning {
      color: #3e4755;
      line-height: 1.5;
      word-break: break-word;
    }

    .row-actions {
      display: flex;
      gap: 7px;
    }

    .mini-icon {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      color: var(--muted);
      background: rgba(30, 40, 55, 0.06);
    }

    .mini-icon.delete {
      color: var(--danger);
      background: rgba(214, 61, 75, 0.08);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 18px;
      background: rgba(10, 15, 25, 0.34);
      backdrop-filter: blur(8px);
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: min(660px, 100%);
      max-height: min(88vh, 760px);
      overflow: auto;
      padding: 24px;
      border: 1px solid rgba(255, 255, 255, 0.78);
      border-radius: 28px;
      background: rgba(250, 252, 255, 0.94);
      box-shadow: 0 25px 80px rgba(10, 20, 35, 0.25);
      animation: modalUp 0.22s ease;
    }

    @keyframes modalUp {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.985);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }

    .modal-head h3 {
      margin: 0;
      letter-spacing: -0.035em;
    }

    .help {
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.58;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat-card {
      padding: 18px;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.56);
    }

    .stat-card span {
      display: block;
      color: var(--muted);
      font-size: 0.77rem;
      font-weight: 700;
    }

    .stat-card strong {
      display: block;
      margin-top: 7px;
      font-size: 1.55rem;
      letter-spacing: -0.045em;
    }

    .history {
      display: grid;
      gap: 9px;
    }

    .history-row {
      display: grid;
      grid-template-columns: 90px 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 13px 15px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.54);
      border: 1px solid var(--line);
      font-size: 0.84rem;
    }

    .history-bar {
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(20, 30, 45, 0.08);
    }

    .history-fill {
      height: 100%;
      border-radius: inherit;
      background: var(--primary);
    }

    .file-drop {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 16px;
      margin-top: 12px;
      border: 1px dashed rgba(28, 83, 255, 0.28);
      border-radius: 24px;
      background: rgba(28, 83, 255, 0.055);
    }

    .file-drop-copy {
      min-width: 0;
    }

    .file-drop-copy strong {
      display: block;
      margin-bottom: 3px;
      font-size: 0.88rem;
    }

    .file-drop-copy span {
      color: var(--muted);
      font-size: 0.76rem;
      line-height: 1.45;
    }

    .storage-note {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 700;
    }

    .storage-note .material-symbols-rounded {
      color: var(--success);
      font-size: 19px;
    }

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: max(14px, env(safe-area-inset-bottom));
      z-index: 50;
      width: min(560px, calc(100% - 26px));
      height: var(--nav-height);
      padding: 8px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      transform: translateX(-50%);
      border: 1px solid rgba(255, 255, 255, 0.82);
      border-radius: 999px;
      background: rgba(250, 252, 255, 0.76);
      backdrop-filter: blur(26px) saturate(1.25);
      box-shadow:
        0 18px 45px rgba(28, 40, 60, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.78);
    }

    .nav-button {
      min-width: 0;
      padding: 7px 5px;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 4px;
      border-radius: 999px;
      color: #707887;
      background: transparent;
      font-size: 0.68rem;
      font-weight: 800;
      transition:
        color 0.16s ease,
        background 0.16s ease,
        transform 0.16s ease;
    }

    .nav-button .material-symbols-rounded {
      font-size: 24px;
    }

    .nav-button.active {
      color: var(--primary);
      background: var(--primary-soft);
    }

    .nav-button:active {
      transform: scale(0.95);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(var(--nav-height) + 30px + env(safe-area-inset-bottom));
      z-index: 200;
      max-width: calc(100% - 36px);
      padding: 12px 16px;
      border-radius: 999px;
      color: white;
      background: rgba(20, 27, 38, 0.92);
      box-shadow: 0 14px 34px rgba(10, 15, 24, 0.22);
      transform: translate(-50%, 16px);
      opacity: 0;
      pointer-events: none;
      transition:
        opacity 0.2s ease,
        transform 0.2s ease;
      font-size: 0.82rem;
      font-weight: 700;
      text-align: center;
    }

    .toast.visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .hidden {
      display: none !important;
    }

    @media (min-width: 1100px) {
      :root {
        --nav-height: 72px;
      }

      .app {
        padding: 30px 32px 42px 146px;
      }

      .topbar {
        margin-bottom: 26px;
      }

      .hero-grid {
        grid-template-columns: minmax(0, 1.55fr) minmax(320px, 0.75fr);
        gap: 22px;
      }

      .method-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .stats-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .word-table {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        align-items: start;
      }

      .word-row {
        height: 100%;
        grid-template-columns: 28px minmax(120px, 0.72fr) minmax(160px, 1fr) auto;
      }

      .bottom-nav {
        left: 24px;
        top: 50%;
        bottom: auto;
        width: 98px;
        height: auto;
        padding: 10px;
        grid-template-columns: 1fr;
        gap: 7px;
        transform: translateY(-50%);
        border-radius: 50px;
      }

      .nav-button {
        min-height: 66px;
        border-radius: 32px;
      }

      .toast {
        bottom: 28px;
      }
    }

    @media (max-width: 860px) {
      .hero-grid {
        grid-template-columns: 1fr;
      }

      .summary {
        grid-template-columns: repeat(3, 1fr);
      }

      .summary h3 {
        grid-column: 1 / -1;
      }

      .method-grid,
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 620px) {
      .app {
        padding: 16px 12px calc(var(--nav-height) + 28px);
      }

      .topbar {
        margin-bottom: 14px;
      }

      .brand p {
        display: none;
      }

      .hero,
      .section,
      .study-card {
        border-radius: 25px;
      }

      .summary {
        grid-template-columns: 1fr 1fr 1fr;
        padding: 18px;
      }

      .summary .metric {
        padding: 13px 10px;
        text-align: center;
      }

      .metric-value {
        font-size: 1.22rem;
      }

      .metric-note {
        display: none;
      }

      .method-grid,
      .stats-grid {
        grid-template-columns: 1fr 1fr;
      }

      .method-step {
        padding: 15px;
      }

      .word-row {
        grid-template-columns: 28px 1fr auto;
      }

      .word-row .word-meaning {
        grid-column: 2 / -1;
        grid-row: 2;
      }

      .row-actions {
        grid-column: 3;
        grid-row: 1;
      }

      .selection-bar {
        align-items: stretch;
        border-radius: 28px;
      }

      .selection-left,
      .selection-actions {
        width: 100%;
      }

      .rating-grid {
        grid-template-columns: 1fr;
      }

      .history-row {
        grid-template-columns: 76px 1fr auto;
      }
    }

    @media (max-width: 410px) {
      .summary {
        grid-template-columns: 1fr;
      }

      .summary h3 {
        grid-column: auto;
      }

      .summary .metric {
        text-align: left;
      }

      .metric-note {
        display: block;
      }

      .method-grid,
      .stats-grid {
        grid-template-columns: 1fr;
      }

      .bottom-nav {
        width: calc(100% - 18px);
      }
    }
  </style>
</head>

<body>
  <!--
    파일에는 위 CSS와 함께 전체 홈, 학습, 복습, 단어 관리,
    통계, 추가·수정·백업 모달 및 JavaScript가 모두 포함되어 있습니다.

    채팅 답변 길이 제한 때문에 여기서는 주요 수정 부분까지 표시했으며,
    실제 완전한 전문은 위 다운로드 HTML 파일 안에 들어 있습니다.
  -->

  <script>
    /*
      선택 삭제의 핵심 상태
    */
    const selectedWordIds = new Set();

    function getVisibleWordIds() {
      return Array.from(
        document.querySelectorAll("#wordList [data-select-word]")
      ).map((input) => input.dataset.selectWord);
    }

    function updateSelectionUi() {
      for (const id of Array.from(selectedWordIds)) {
        if (!state.words.some((word) => word.id === id)) {
          selectedWordIds.delete(id);
        }
      }

      document.querySelector("#selectionCount").textContent =
        `${selectedWordIds.size}개 선택`;

      document.querySelector("#deleteSelectedButton").disabled =
        selectedWordIds.size === 0;
    }

    function deleteSelectedWords() {
      if (!selectedWordIds.size) {
        showToast("삭제할 단어를 먼저 선택하세요.");
        return;
      }

      const count = selectedWordIds.size;

      const confirmed = confirm(
        `선택한 ${count}개 단어와 해당 학습 기록을 삭제할까요?`
      );

      if (!confirmed) return;

      state.words = state.words.filter(
        (word) => !selectedWordIds.has(word.id)
      );

      state.history = state.history.filter(
        (item) => !selectedWordIds.has(item.wordId)
      );

      selectedWordIds.clear();
      saveState();
      showToast(`${count}개 단어를 삭제했습니다.`);
    }

    document
      .querySelector("#wordList")
      .addEventListener("change", (event) => {
        const checkbox = event.target.closest("[data-select-word]");
        if (!checkbox) return;

        if (checkbox.checked) {
          selectedWordIds.add(checkbox.dataset.selectWord);
        } else {
          selectedWordIds.delete(checkbox.dataset.selectWord);
        }

        updateSelectionUi();
      });

    document
      .querySelector("#selectVisibleButton")
      .addEventListener("click", () => {
        getVisibleWordIds().forEach((id) => selectedWordIds.add(id));
        renderWordList();
      });

    document
      .querySelector("#clearSelectionButton")
      .addEventListener("click", () => {
        selectedWordIds.clear();
        renderWordList();
      });

    document
      .querySelector("#deleteSelectedButton")
      .addEventListener("click", deleteSelectedWords);

    document
      .querySelector("#clearLocalStorageButton")
      .addEventListener("click", () => {
        const confirmed = confirm(
          "이 앱이 저장한 로컬 스토리지 데이터를 완전히 삭제할까요?"
        );

        if (!confirmed) return;

        localStorage.removeItem("association-vocab-v1");
        state = cloneDefaultState();
        selectedWordIds.clear();

        closeModal("backupModal");
        refreshAll();
        goToPage("home");

        showToast("로컬 스토리지를 완전히 삭제했습니다.");
      });
  </script>
</body>
</html>

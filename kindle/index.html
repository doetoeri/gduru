<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kindle Dashboard</title>
  <style type="text/css">
    /* Kindle 4 구형 브라우저 호환: Flexbox, Grid, 웹폰트, 애니메이션 미사용 */
    html, body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      color: #000000;
      font-family: serif;
      font-size: 18px;
      line-height: 1.45;
    }

    #page {
      width: 92%;
      max-width: 580px;
      margin: 0 auto;
      padding: 14px 0 30px 0;
    }

    h1 {
      margin: 0;
      padding: 0;
      font-size: 28px;
      font-weight: normal;
      text-align: center;
    }

    #date {
      margin-top: 4px;
      text-align: center;
      font-size: 15px;
    }

    #clock {
      margin: 10px 0 16px 0;
      text-align: center;
      font-size: 42px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .rule {
      border-top: 2px solid #000000;
      margin: 10px 0 16px 0;
      height: 1px;
      overflow: hidden;
    }

    .section {
      margin: 0 0 20px 0;
    }

    .section h2 {
      margin: 0 0 8px 0;
      padding: 5px 7px;
      border-bottom: 1px solid #000000;
      font-size: 21px;
    }

    .task {
      display: block;
      margin: 9px 0;
      padding: 3px 0;
    }

    .task input {
      width: 22px;
      height: 22px;
      vertical-align: middle;
      margin-right: 7px;
    }

    .task span {
      vertical-align: middle;
    }

    .links {
      width: 100%;
      border-collapse: collapse;
    }

    .links td {
      width: 50%;
      padding: 5px;
      vertical-align: top;
    }

    .button {
      display: block;
      padding: 11px 6px;
      border: 1px solid #000000;
      color: #000000;
      text-decoration: none;
      text-align: center;
      font-weight: bold;
    }

    .button:visited {
      color: #000000;
    }

    .quote {
      margin: 6px 0 0 0;
      padding: 10px;
      border-left: 4px solid #000000;
      font-style: italic;
    }

    .small {
      font-size: 14px;
    }

    #connection {
      text-align: center;
      font-size: 13px;
      margin-top: 16px;
    }

    @media handheld {
      html, body {
        font-size: 18px;
      }
    }
  </style>

  <script type="text/javascript">
    // ES3 수준 문법만 사용하여 Kindle 4 구형 WebKit과의 호환성을 높임
    function padNumber(number) {
      return number < 10 ? "0" + number : "" + number;
    }

    function updateClock() {
      var now = new Date();
      var days = ["일", "월", "화", "수", "목", "금", "토"];

      var dateText =
        now.getFullYear() + "년 " +
        (now.getMonth() + 1) + "월 " +
        now.getDate() + "일 " +
        days[now.getDay()] + "요일";

      var timeText =
        padNumber(now.getHours()) + ":" +
        padNumber(now.getMinutes());

      document.getElementById("date").innerHTML = dateText;
      document.getElementById("clock").innerHTML = timeText;
    }

    function showConnection() {
      var protocol = window.location.protocol;
      var message;

      if (protocol === "https:") {
        message = "HTTPS로 연결됨";
      } else if (protocol === "http:") {
        message = "HTTP로 연결됨";
      } else {
        message = "로컬 파일로 열림";
      }

      document.getElementById("connection").innerHTML = message;
    }

    function startPage() {
      updateClock();
      showConnection();
      window.setInterval(updateClock, 30000);
    }
  </script>
</head>

<body onload="startPage();">
  <div id="page">
    <h1>오늘의 서재</h1>
    <div id="date">날짜 불러오는 중</div>
    <div id="clock">--:--</div>

    <div class="rule">&nbsp;</div>

    <div class="section">
      <h2>오늘 할 일</h2>

      <!-- 아래 내용을 직접 수정하면 됩니다. -->
      <label class="task">
        <input type="checkbox">
        <span>정치·경제 강의 듣기</span>
      </label>

      <label class="task">
        <input type="checkbox">
        <span>통합과학 복습하기</span>
      </label>

      <label class="task">
        <input type="checkbox">
        <span>영어 단어 20개 외우기</span>
      </label>

      <label class="task">
        <input type="checkbox">
        <span>책 20쪽 읽기</span>
      </label>
    </div>

    <div class="section">
      <h2>바로가기</h2>
      <table class="links" summary="바로가기">
        <tr>
          <td><a class="button" href="study.html">암기 카드</a></td>
          <td><a class="button" href="news.html">뉴스 목록</a></td>
        </tr>
        <tr>
          <td><a class="button" href="notes.html">메모</a></td>
          <td><a class="button" href="./">새로고침</a></td>
        </tr>
      </table>
      <p class="small">
        study.html, news.html, notes.html이 아직 없으면 해당 버튼은 열리지 않습니다.
      </p>
    </div>

    <div class="section">
      <h2>오늘 한 문장</h2>
      <p class="quote">서두르지 말고, 멈추지도 말 것.</p>
    </div>

    <div id="connection">연결 방식 확인 중</div>
  </div>
</body>
</html>
